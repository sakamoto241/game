<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11171c"><title>BGM試聴｜灯りだけが、覚えている</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:30px 18px max(30px,env(safe-area-inset-bottom));background:#0c1218;color:#e6d9c0;font:14px/1.9 'Hiragino Mincho ProN','Yu Mincho',serif}body:before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(0deg,#0b1118f5,#0b111899),url('akatsuki-world.webp') center/cover}main{width:min(100%,640px);border:1px solid #ba9a6555;background:linear-gradient(140deg,#20262be8,#111820f5);padding:clamp(24px,6vw,48px);box-shadow:0 20px 80px #0008}.eyebrow{font:10px sans-serif;letter-spacing:.22em;color:#c5a572;margin:0 0 25px}h1{font-size:clamp(26px,5vw,42px);font-weight:500;letter-spacing:.06em;line-height:1.7;margin:0 0 20px}h1 span{display:block}.line{width:45px;height:1px;background:#b99b67;margin:23px 0}.lead{color:#c5baa6;font-size:13px}.meta{font-size:11px;color:#a59b89;margin:20px 0}audio{display:block;width:100%;height:54px;margin:22px 0 15px}label{display:flex;align-items:center;gap:10px;font-size:12px;min-height:44px}input{width:18px;height:18px;accent-color:#c4a76e}nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}nav a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 17px;text-decoration:none;border:1px solid #aa8d5855;color:#d9c69e;font-size:12px}nav .download{background:#c7a66f;color:#211b15;border-color:#c7a66f}.foot{font-size:10px;color:#a99d87;margin:25px 0 0}.foot a{color:#c4b08b;text-underline-offset:4px}.note{font-size:11px;color:#b6a88f;margin-top:18px}a:focus-visible,input:focus-visible{outline:2px solid #e1c48e;outline-offset:4px}</style></head><body><main><p class="eyebrow">夜明けに、わたしを燃やして · BGM試作</p><h1>灯りだけが、<span>覚えている。</span></h1><div class="line"></div><p class="lead">夜の石畳、消えかけた灯り、帰らない人の記憶。<br>静かな街と会話のための、短い曲です。</p><p class="meta">約1分27秒 · ピアノ / 暗いパッド / 遠い鐘</p><audio id="player" controls loop preload="none" aria-label="BGM試作を再生"><source src="akatsuki-bgm-lantern.mp3" type="audio/mpeg">お使いのブラウザでは再生できません。下の保存リンクからMP3を開いてください。</audio><label><input id="loop" type="checkbox" checked>繰り返して聴く</label><p class="note">再生ボタンを押すと流れます。</p><nav><a class="download" href="akatsuki-bgm-lantern.mp3" download="灯りだけが、覚えている.mp3">MP3を保存</a><a href="akatsuki.html">ゲームへ</a></nav><p class="foot">ゲーム内への採用前に聴き比べるための試聴版です。<br>録音素材・編曲の詳細：<a href="akatsuki-bgm-lantern-credits.html">音楽クレジット</a></p></main><script>document.getElementById('loop').addEventListener('change',e=>document.getElementById('player').loop=e.target.checked);document.addEventListener('visibilitychange',()=>{if(document.hidden)document.getElementById('player').pause();});</script></body></html>
