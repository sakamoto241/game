<style>
  /* Layout: 畳の上に置いた実寸の碁盤を真上から。上に記録、中央に盤、下に師匠のひとこと */
  :root {
    color-scheme: dark;
    --tatami: #5d6a3c;
    --night: #23291d;
    --washi: #f5efe0;
    --ink: #1d1a16;
    --sumi: #4a443a;
    --gold: #c9a24a;
    --vermilion: #b8402e;
    --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--washi);
    font-family: var(--body);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #app { position: relative; height: 100%; display: flex; flex-direction: column; }
  header {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 10px 6px;
    position: relative; z-index: 2;
  }
  h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(26px, 7.5vw, 36px); letter-spacing: .08em; line-height: 1; }
  h1 small { display: block; font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: .12em; color: color-mix(in srgb, var(--washi) 65%, transparent); margin-top: 6px; }
  .recs { display: grid; grid-template-columns: auto auto; gap: 2px 10px; text-align: right; font-size: 12px; }
  .recs dt { color: color-mix(in srgb, var(--washi) 65%, transparent); font-weight: 700; }
  .recs dd { margin: 0; font-family: var(--display); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }

  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #shout {
    position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none;
    font-family: var(--display); font-weight: 800; font-size: clamp(44px, 14vw, 84px);
    color: var(--gold); text-shadow: 0 2px 0 var(--ink), 0 0 24px rgba(0,0,0,.6);
    letter-spacing: .1em;
  }
  #shout.show { animation: shout 1.4s ease-out forwards; }
  @keyframes shout { 0% { opacity: 0; transform: scale(1.6); } 15% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }

  footer {
    position: relative; z-index: 2;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 6px 10px;
  }
  .panel {
    position: absolute; z-index: 3;
    left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    bottom: 10px;
    background: var(--washi); color: var(--ink);
    border-radius: 4px; padding: 10px 12px;
    display: grid; gap: 6px;
    box-shadow: 0 2px 0 rgba(0,0,0,.3);
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  #result { font-family: var(--display); font-weight: 800; font-size: clamp(20px, 6vw, 26px); font-variant-numeric: tabular-nums; min-width: 0; }
  #title-badge {
    font-weight: 900; font-size: 13px; color: var(--washi); background: var(--vermilion);
    padding: 3px 10px; border-radius: 2px; letter-spacing: .1em;
  }
  #master { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.6; }
  #master b { flex: none; font-family: var(--display); font-weight: 800; color: var(--vermilion); }
  .actions { display: flex; gap: 8px; }
  .btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    font: 900 14px var(--body); text-decoration: none; cursor: pointer;
    border-radius: 3px; padding: 10px; border: 2px solid var(--ink);
  }
  #share { background: var(--ink); color: var(--washi); }
  #again { background: var(--washi); color: var(--ink); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #hint { font-size: 13px; text-align: center; color: var(--washi); font-weight: 700; padding-block: 6px; }
  #hint .spec { display: block; font-size: 11px; font-weight: 500; color: color-mix(in srgb, var(--washi) 60%, transparent); margin-top: 2px; }
  @media (prefers-reduced-motion: reduce) { #shout.show { animation: none; opacity: 1; } }
</style>

<div id="app">
  <header>
    <h1>天元ピタリ<small>……これが、千年追い求めた一手か</small></h1>
    <dl class="recs">
      <dt>初手の記録</dt><dd id="first">—</dd>
      <dt>最高記録</dt><dd id="best">—</dd>

    </dl>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="shout"></div>
  </div>

  <footer>
    <div id="hint">盤に指を置いて、引っぱって離す（向きは自由）。引いた長さだけ石が進む<span class="spec">実物と同じ寸法：盤 42.4×45.5cm／線の間隔 横22mm・縦23.7mm／石の直径22mm</span></div>
    <div id="panel" class="panel" hidden>

        <div id="result">天元から 0.00mm</div>

          Xでシェア
        </a>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');

  // ---------- 実寸（mm） ----------
  const BW = 424, BH = 455;                 // 盤の大きさ
  const GX = 22.0, GY = 23.7;               // 線の間隔
  const MX = (BW - GX * 18) / 2, MY = (BH - GY * 18) / 2;
  const R = 11.0;                           // 石の半径
  const TX = BW / 2, TY = BH / 2;           // 天元
  const START = { x: TX, y: MY + GY * 18 }; // 手前の一線から弾く
  const FRICTION = 5200;                    // 減速 mm/s²（盤の上を滑る石）

  const ix = (i) => MX + GX * i;
  const iy = (j) => MY + GY * j;

  // ---------- 保存 ----------
  const K = 'tengenpitari_';
  const load = (k, d) => { try { const v = localStorage.getItem(K + k); return v === null ? d : v; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(K + k, v); } catch {} };
  let first = load('first', null);
  let best = load('best', null);
  let tries = parseInt(load('tries', '0'), 10) || 0;
  const fmtRec = (v) => v === null ? '—' : (v === 'off' ? '盤外' : parseFloat(v).toFixed(2) + 'mm');
  function showRecs() {
    $('first').textContent = fmtRec(first);
    $('best').textContent = fmtRec(best);
    $('tries').textContent = tries + '回';
  }
  showRecs();

  // ---------- 音 ----------
  let ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function noiseBuf(a, dur) {
    const b = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  let slideNode = null, slideGain = null;
  const sfx = {
    // 石を打つ「パチッ」：短いノイズ＋高めの共鳴
    snap(vol = 0.6) {
      const a = audio(); if (!a) return;
      const t = a.currentTime;
      const s = a.createBufferSource(); s.buffer = noiseBuf(a, 0.08);
      const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 6;
      const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .08);
      s.connect(f).connect(g).connect(a.destination); s.start(t);
      const o = a.createOscillator(); o.frequency.setValueAtTime(1800, t); o.frequency.exponentialRampToValueAtTime(900, t + .05);
      const g2 = a.createGain(); g2.gain.setValueAtTime(vol * .25, t); g2.gain.exponentialRampToValueAtTime(.0001, t + .06);
      o.connect(g2).connect(a.destination); o.start(t); o.stop(t + .07);
    },
    slideStart() {
      const a = audio(); if (!a) return;
      sfx.slideStop();
      slideNode = a.createBufferSource(); slideNode.buffer = noiseBuf(a, 2); slideNode.loop = true;
      const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
      slideGain = a.createGain(); slideGain.gain.value = 0;
      slideNode.connect(f).connect(slideGain).connect(a.destination); slideNode.start();
    },
    slideVol(v) { if (slideGain) slideGain.gain.value = Math.min(.12, v / 20000); },
    slideStop() { if (slideNode) { try { slideNode.stop(); } catch {} slideNode = null; slideGain = null; } },
    fall() {
      const a = audio(); if (!a) return;
      [0, .18, .3, .38].forEach((w, i) => {
        const t = a.currentTime + w;
        const s = a.createBufferSource(); s.buffer = noiseBuf(a, .06);
        const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800 - i * 200; f.Q.value = 4;
        const g = a.createGain(); g.gain.setValueAtTime(.35 - i * .07, t); g.gain.exponentialRampToValueAtTime(.0001, t + .06);
        s.connect(f).connect(g).connect(a.destination); s.start(t);
      });
    },
    crack() {
      const a = audio(); if (!a) return;
      [0, .07, .16].forEach((w, i) => {
        const t = a.currentTime + w;
        const s = a.createBufferSource(); s.buffer = noiseBuf(a, .05);
        const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500 + i * 700;
        const g = a.createGain(); g.gain.setValueAtTime(.45, t); g.gain.exponentialRampToValueAtTime(.0001, t + .05);
        s.connect(f).connect(g).connect(a.destination); s.start(t);
      });
    },
    rumble(dur, vol) {
      const a = audio(); if (!a) return;
      const t = a.currentTime;
      const s = a.createBufferSource(); s.buffer = noiseBuf(a, dur);
      const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 140;
      const g = a.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .15); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      s.connect(f).connect(g).connect(a.destination); s.start(t);
    },
    boom() {
      const a = audio(); if (!a) return;
      const t = a.currentTime;
      const o = a.createOscillator(); o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(28, t + 1.2);
      const g = a.createGain(); g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.0001, t + 1.4);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + 1.5);
      sfx.rumble(2.2, .9);
    },
    bell() {
      const a = audio(); if (!a) return;
      [880, 1320, 1760].forEach((fr, i) => {
        const t = a.currentTime + i * .02;
        const o = a.createOscillator(); o.type = 'sine'; o.frequency.value = fr;
        const g = a.createGain(); g.gain.setValueAtTime(.12 / (i + 1), t); g.gain.exponentialRampToValueAtTime(.0001, t + 2.2);
        o.connect(g).connect(a.destination); o.start(t); o.stop(t + 2.3);
      });
    },
  };

  // ---------- 画面 ----------
  let W = 0, H = 0, dpr = 1, S = 1, ox = 0, oy = 0;   // S: px/mm
  let woodCanvas = null, tatamiCanvas = null;
  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    S = Math.min((W - 24) / BW, (H - 40) / (BH + 30));
    ox = (W - BW * S) / 2;
    oy = Math.max(8, (H - (BH + 24) * S) / 2);
    woodCanvas = makeWood(); tatamiCanvas = makeTatami();
  }
  const px = (x) => ox + x * S;
  const py = (y) => oy + y * S;

  // 榧の柾目
  function makeWood() {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(BW * S * dpr)); c.height = Math.max(1, Math.round(BH * S * dpr));
    const g = c.getContext('2d');
    const base = g.createLinearGradient(0, 0, c.width, c.height);
    base.addColorStop(0, '#e7bf74'); base.addColorStop(.5, '#deb062'); base.addColorStop(1, '#d6a556');
    g.fillStyle = base; g.fillRect(0, 0, c.width, c.height);
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < c.width; i += 1) {
      const n = Math.sin(i * 0.05) * 0.5 + Math.sin(i * 0.013 + 1.3) * 0.5;
      const a = 0.03 + 0.05 * Math.abs(n) + (rnd() < 0.06 ? 0.06 : 0);
      g.fillStyle = `rgba(150,95,35,${a})`;
      g.fillRect(i, 0, 1, c.height);
    }
    for (let k = 0; k < 40; k++) {
      const x = rnd() * c.width, w = 1 + rnd() * 3 * dpr;
      g.fillStyle = `rgba(120,70,20,${0.05 + rnd() * 0.08})`;
      g.fillRect(x, 0, w, c.height);
    }
    const sheen = g.createLinearGradient(0, 0, c.width, 0);
    sheen.addColorStop(0, 'rgba(255,240,200,.0)'); sheen.addColorStop(.35, 'rgba(255,240,200,.12)'); sheen.addColorStop(.6, 'rgba(255,240,200,0)');
    g.fillStyle = sheen; g.fillRect(0, 0, c.width, c.height);
    return c;
  }
  // 畳
  function makeTatami() {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(W * dpr)); c.height = Math.max(1, Math.round(H * dpr));
    const g = c.getContext('2d');
    g.fillStyle = '#5d6a3c'; g.fillRect(0, 0, c.width, c.height);
    for (let y = 0; y < c.height; y += 3 * dpr) {
      g.fillStyle = (y / (3 * dpr)) % 2 ? 'rgba(255,240,180,.05)' : 'rgba(0,0,0,.06)';
      g.fillRect(0, y, c.width, 1.5 * dpr);
    }
    g.fillStyle = 'rgba(0,0,0,.12)';
    for (let x = 0; x < c.width; x += 18 * dpr) g.fillRect(x, 0, 1, c.height);
    const v = g.createRadialGradient(c.width / 2, c.height / 2, c.width * .2, c.width / 2, c.height / 2, c.width * .8);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
    g.fillStyle = v; g.fillRect(0, 0, c.width, c.height);
    return c;
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  resize();

  // ---------- 石 ----------
  // state: 'ready' | 'drag' | 'slide' | 'fall' | 'done'
  let state = 'ready';
  const stone = { x: START.x, y: START.y, vx: 0, vy: 0, z: 1, rot: 0 };
  let trail = [];
  let result = null;
  let glow = 0;

  function reset() {
    Object.assign(stone, { x: START.x, y: START.y, vx: 0, vy: 0, z: 1, rot: 0 });
    state = 'ready';
    result = null; glow = 0; cine = null;
    $('panel').hidden = true;
  }

  // ---------- 判定 ----------
  const KANJI = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九'];
  function pointName(i, j) {
    // 日本式の座標：横は右から 1〜19、縦は上から 一〜十九
    const col = 19 - i, row = j + 1;
    const a = Math.min(col, 20 - col), b = Math.min(row, 20 - row);
    const lo = Math.min(a, b), hi = Math.max(a, b);
    let name = '';
    if (col === 10 && row === 10) name = '天元';
    else if (lo === 4 && hi === 4) name = '星';
    else if ((lo === 4 && hi === 10)) name = '辺の星';
    else if (lo === 3 && hi === 4) name = '小目';
    else if (lo === 3 && hi === 3) name = '三々';
    else if (lo === 3 && hi === 5) name = '目外し';
    else if (lo === 4 && hi === 5) name = '高目';
    else if (lo === 1 && hi === 1) name = '一の一';
    return { coord: `${col}の${KANJI[row]}`, name };
  }

  // [ズレの上限mm, 称号, 師匠のひとこと, 被害の段階]
  const TITLES = [
    [0.01, '神の一手', ['……打ちすぎじゃ。宇宙にまでヒビが入っておる。', 'これが千年追い求めた一手か……。宇宙ごと割れたがな。'], 6],
    [0.8, '神の一手', ['……打ちすぎじゃ。地球が割れてしもうた。', 'これが千年追い求めた一手か……。地球は割れたがな。'], 5],
    [1.5, '名人', ['日本列島が割れた。見事だが、加減を覚えよ。', '名人の一手じゃ。列島が二つになったが。'], 4],
    [2.2, '本因坊', ['町に亀裂が走った。近所に謝ってまいれ。', '良い一手じゃ。町内会から苦情が来ておる。'], 3],
    [4, '九段', ['盤が真っ二つじゃ。榧の盤は高いのだぞ。', '見事に割れた。盤の弁償は分割でよい。'], 2],
    [7, '七段', ['盤にヒビが入った。力が強すぎる。', 'ピシッと鳴ったな。良い手じゃが盤が泣いておる。'], 1],
    [11, '初段', ['かろうじて天元に触れておる。かろうじてな。', '天元は踏んでおる。だが真ん中ではない。', '惜しい。石の端で天元に触れておる。'], 0],
    [Infinity, '級位者', ['天元に届いておらぬ。石の下に点が見えておる。', '盤は広い。焦らずともよい。'], 0],
  ];
  const STAGES = ['crack', 'split', 'town', 'japan', 'earth', 'universe'];
  const STAGE_DUR = { crack: 1.5, split: 1.5, town: 1.8, japan: 1.9, earth: 2.4, universe: 2.2 };
  const STAGE_TEXT = { crack: '盤にヒビ', split: '盤が割れた', town: '町が割れた', japan: '日本が割れた', earth: '地球が割れた', universe: '宇宙が割れた' };
  const EFFECT = ['', '碁盤にヒビが入った', '碁盤が真っ二つに割れた', '町が割れた', '日本列島が割れた', '地球が割れた🌏', '宇宙にヒビが入った🌌'];
  function judge() {
    const d = Math.hypot(stone.x - TX, stone.y - TY);
    const i = Math.max(0, Math.min(18, Math.round((stone.x - MX) / GX)));
    const j = Math.max(0, Math.min(18, Math.round((stone.y - MY) / GY)));
    const pt = pointName(i, j);
    let title = TITLES[TITLES.length - 1];
    for (const t of TITLES) if (d < t[0]) { title = t; break; }
    let line = title[2][Math.floor(Math.random() * title[2].length)];
    if (d >= 11) {
      if (pt.name === '小目') line = '小目か。秀策流の布石も小目から始まる。悪くはないが、今日は天元じゃ。';
      else if (pt.name === '星') line = '星に打ったな。それは別の遊びじゃ。';
      else if (pt.name === '三々') line = '三々……。隅に逃げたな。';
      else if (pt.name === '一の一') line = '一の一。盤の隅で何をしておる。';
      else if (pt.name) line = `${pt.name}に着手。天元はもっと真ん中じゃ。`;
      else if (stone.y > TY + GY * 3) line = '弱い。石に気持ちが乗っておらぬ。';
      else if (stone.y < TY - GY * 3) line = '強すぎる。天元を通り過ぎておる。';
    }
    return { d, pt, title: title[1], line, off: false, tier: title[3] };
  }

  function finish(res) {
    result = res;

    const recVal = res.off ? 'off' : res.d.toFixed(2);
    if (first === null) { first = recVal; save('first', first); }
    const better = !res.off && (best === null || best === 'off' || res.d < parseFloat(best));
    if (better || best === null) { best = recVal; save('best', best); }
    showRecs();

    if (res.off) {
      $('result').textContent = '盤外';
      $('title-badge').textContent = '観戦者';
    } else {
      $('result').textContent = `天元から ${res.d.toFixed(2)}mm`;
      $('title-badge').textContent = res.title;
    }
    $('master-line').textContent = res.line + (better && tries > 1 ? '（最高記録）' : '');
    const where = res.off ? '' : `（${res.pt.coord}${res.pt.name && res.pt.name !== '天元' ? '・' + res.pt.name : ''}）`;
    const text = res.off
      ? `天元を狙ったら、石が盤の外へ飛んでいった⚫\n称号：観戦者\n#天元ピタリ\n${location.href}`
      : res.tier > 0
        ? `天元に${res.d.toFixed(2)}mmで打ったら、${EFFECT[res.tier]}⚫\n称号：${res.title}\n#天元ピタリ #囲碁\n${location.href}`
        : `碁石を弾いて、天元から${res.d.toFixed(2)}mmに打った⚫${where}\n称号：${res.title}\n#天元ピタリ #囲碁\n${location.href}`;
    $('share').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text);

  }

  // ---------- 入力：下に引っぱって離す（引いた長さに比例して進む） ----------
  const PULL_K = 0.6;           // 引いた長さ（盤上のmm換算）× PULL_K = 石が進む距離
  const STEP = (START.y - TY) / 305;   // 約0.70mm
  let drag = null;
  function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  stage.addEventListener('pointerdown', (e) => {
    if (state === 'cine') { skipCine(); return; }
    if (state !== 'ready') return;
    audio();
    e.preventDefault();
    try { stage.setPointerCapture(e.pointerId); } catch {}
    state = 'drag';
    const q = pos(e);
    drag = { x0: q.x, y0: q.y, pull: 0 };
  });
  stage.addEventListener('pointermove', (e) => {
    if (state !== 'drag') return;
    const q = pos(e);

  });
  function release(e) {
    if (state !== 'drag') return;
    const q = pos(e);
    drag.pull = Math.hypot(q.x - drag.x0, q.y - drag.y0);
    if (drag.pull < 6) { state = 'ready'; drag = null; return; }
    // 進む距離は STEP 刻み。天元までの距離がちょうど 305 刻みなので、0.00mm を狙える
    const D = Math.round(drag.pull / S * PULL_K / STEP) * STEP;
    stone.v0 = Math.sqrt(2 * FRICTION * D);
    stone.D = D; stone.t = 0;

  // ブラウザのスクロールや「引っぱって更新」が反応しないようにする

  // ---------- 物理 ----------
  function update(dt) {
    if (state === 'slide') {
      stone.t += dt;
      const tStop = stone.v0 / FRICTION;
      const t = Math.min(stone.t, tStop);
      const trav = t >= tStop ? stone.D : stone.v0 * t - 0.5 * FRICTION * t * t;
      const sp = stone.v0 - FRICTION * t;
      stone.y = START.y - trav;
      sfx.slideVol(sp);
      trail.push({ x: stone.x, y: stone.y });
      if (trail.length > 18) trail.shift();
      // 石の中心が盤の外に出たら落ちる
      if (stone.y < 0) {
        stone.vx = 0; stone.vy = -sp;
        sfx.slideStop();
        sfx.fall();
        state = 'fall';
        return;
      }
      if (stone.t >= tStop) {
        sfx.slideStop();
        sfx.snap(0.5);
        const res = judge();
        if (res.tier > 0) startCine(res);
        else { state = 'done'; finish(res); }
      }
    } else if (state === 'fall') {
      stone.x += stone.vx * dt * 0.6; stone.y += stone.vy * dt * 0.6;
      stone.z -= dt * 2.2;
      if (stone.z <= 0.35) {
        state = 'done';
        finish({ off: true, line: ['石が盤から落ちた。盤と石は大事にせよ。', '力みすぎじゃ。石が畳を転がっておる。', '天元は盤の上にある。外ではない。'][Math.floor(Math.random() * 3)] });
      }
    }

  }

  // ---------- 描画 ----------
  function drawBoard() {
    ctx.drawImage(tatamiCanvas, 0, 0, W, H);
    drawBoardSurface();
  }
  function drawBoardSurface() {
    // 盤の厚みと影
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(px(6), py(10), BW * S, BH * S + 16 * S);
    ctx.fillStyle = '#b4843f';
    ctx.fillRect(px(0), py(BH), BW * S, 18 * S);
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.fillRect(px(0), py(BH) + 12 * S, BW * S, 6 * S);
    ctx.drawImage(woodCanvas, px(0), py(0), BW * S, BH * S);

    // 線（漆の黒）
    ctx.strokeStyle = 'rgba(25,18,10,.88)';
    ctx.lineWidth = Math.max(1, 0.9 * S);
    ctx.beginPath();
    for (let i = 0; i < 19; i++) {
      ctx.moveTo(px(ix(i)), py(iy(0))); ctx.lineTo(px(ix(i)), py(iy(18)));
      ctx.moveTo(px(ix(0)), py(iy(i))); ctx.lineTo(px(ix(18)), py(iy(i)));
    }
    ctx.stroke();
    ctx.lineWidth = Math.max(1.5, 1.6 * S);
    ctx.strokeRect(px(ix(0)), py(iy(0)), GX * 18 * S, GY * 18 * S);
    // 星と天元
    ctx.fillStyle = 'rgba(25,18,10,.92)';
    for (const i of [3, 9, 15]) for (const j of [3, 9, 15]) {
      ctx.beginPath(); ctx.arc(px(ix(i)), py(iy(j)), Math.max(2, 2.1 * S), 0, Math.PI * 2); ctx.fill();
    }
    if (glow > 0) {
      const g = ctx.createRadialGradient(px(TX), py(TY), 0, px(TX), py(TY), 80 * S);
      g.addColorStop(0, `rgba(255,220,120,${0.6 * glow})`); g.addColorStop(1, 'rgba(255,220,120,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }

  function drawStone(x, y, r, z = 1, alpha = 1) {
    const cx = px(x), cy = py(y), rr = r * S * z;
    ctx.save();
    ctx.globalAlpha = alpha;
    // 影
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(cx + 1.6 * S, cy + 2.2 * S, rr, rr * .96, 0, 0, Math.PI * 2); ctx.fill();
    // 那智黒（黒石）

    g.addColorStop(0, '#6a6a6a'); g.addColorStop(.25, '#2b2b2b'); g.addColorStop(1, '#0b0b0b');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.ellipse(cx - rr * .3, cy - rr * .38, rr * .32, rr * .16, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawStartMark() {
    if (state === 'drag' && drag) {
      // 引っぱりの強さ（数字は出さない）
      const full = START.y / PULL_K * S;                 // これ以上引くと盤外
      const k = Math.min(1, drag.pull / full);
      const gx = px(BW) + 4, gh = BH * S * .8, gy = py(BH * .1);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(gx, gy, 6, gh);
      ctx.fillStyle = k >= 1 ? '#b8402e' : '#c9a24a';
      ctx.fillRect(gx, gy + gh * (1 - k), 6, gh * k);

      const off = Math.min(40, drag.pull * 0.2);
      ctx.strokeStyle = 'rgba(245,239,224,.8)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px(START.x - 30), py(START.y)); ctx.lineTo(px(START.x), py(START.y) + off);
      ctx.lineTo(px(START.x + 30), py(START.y)); ctx.stroke();
      return;
    }
    if (state !== 'ready') return;
    ctx.strokeStyle = 'rgba(245,239,224,.75)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(px(START.x), py(START.y - 20)); ctx.lineTo(px(TX), py(TY + 20)); ctx.stroke();
    ctx.setLineDash([]);
    const t = performance.now() / 1000;
    const a = 0.5 + Math.sin(t * 4) * 0.3;
    ctx.fillStyle = `rgba(245,239,224,${a})`;
    ctx.beginPath();
    ctx.moveTo(px(START.x), py(START.y + 30)); ctx.lineTo(px(START.x - 8), py(START.y + 18)); ctx.lineTo(px(START.x + 8), py(START.y + 18));
    ctx.fill();
  }

  // 結果のルーペ（天元まわりを6倍で拡大）
  function drawLoupe() {
    if (state !== 'done' || !result || result.off || (result.tier || 0) >= 2 || result.d > 15) return;
    const Z = 6;
    const rad = Math.min(W * 0.2, 78);
    const lx = W - rad - 12, ly = rad + 12;
    ctx.save();
    ctx.beginPath(); ctx.arc(lx, ly, rad, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#deb062'; ctx.fillRect(lx - rad, ly - rad, rad * 2, rad * 2);
    const k = S * Z;
    const mx = (x) => lx + (x - TX) * k, my = (y) => ly + (y - TY) * k;
    ctx.strokeStyle = 'rgba(25,18,10,.85)'; ctx.lineWidth = 1.2 * Z * .6;
    ctx.beginPath();
    for (let i = 7; i <= 11; i++) { ctx.moveTo(mx(ix(i)), my(iy(6))); ctx.lineTo(mx(ix(i)), my(iy(12))); ctx.moveTo(mx(ix(6)), my(iy(i))); ctx.lineTo(mx(ix(12)), my(iy(i))); }
    ctx.stroke();
    // 石（半透明で天元の点が透けて見える）
    const sxp = mx(stone.x), syp = my(stone.y);
    ctx.fillStyle = 'rgba(15,15,15,.55)';
    ctx.beginPath(); ctx.arc(sxp, syp, R * k, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(245,239,224,.9)'; ctx.lineWidth = 1.5;
    ctx.stroke();
    // 天元の点
    ctx.fillStyle = '#b8402e';
    ctx.beginPath(); ctx.arc(mx(TX), my(TY), 3, 0, Math.PI * 2); ctx.fill();
    // 石の中心
    ctx.fillStyle = '#f5efe0';
    ctx.beginPath(); ctx.arc(sxp, syp, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#f5efe0'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(mx(TX), my(TY)); ctx.lineTo(sxp, syp); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = '#1d1a16'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(lx, ly, rad, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#c9a24a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(lx, ly, rad - 3, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#f5efe0'; ctx.font = '900 11px "Zen Kaku Gothic New", sans-serif'; ctx.textAlign = 'center';

  }


  // ---------- 天元が正確すぎた時の演出 ----------
  let cine = null;
  let seed2 = 1;
  const rnd2 = () => (seed2 = (seed2 * 16807) % 2147483647) / 2147483647;
  const ease = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
  function shout(text) { const el = $('shout'); el.textContent = text; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }

  function startCine(res) {
    seed2 = 12345;
    // 盤のヒビ（天元から放射状）
    const cracks = [];
    for (let k = 0; k < 9; k++) {
      let a = (k / 9) * Math.PI * 2 + rnd2() * 0.5, x = stone.x, y = stone.y;
      const pts = [[x, y]];
      for (let i = 0; i < 16; i++) { a += (rnd2() - .5) * 0.9; const l = 6 + rnd2() * 12; x += Math.cos(a) * l; y += Math.sin(a) * l; pts.push([x, y]); }
      cracks.push(pts);
    }
    // 盤を割る線（縦のギザギザ）
    const seam = [];
    for (let y = -10; y <= BH + 30; y += 14) seam.push([TX + (rnd2() - .5) * 14, y]);
    const stars = Array.from({ length: 160 }, () => ({ x: rnd2(), y: rnd2(), r: rnd2() * 1.4 + .3 }));
    const debris = Array.from({ length: 40 }, () => ({ a: rnd2() * Math.PI * 2, s: .2 + rnd2() * .9, r: 1 + rnd2() * 3 }));
    const glass = Array.from({ length: 14 }, (_, k) => {
      let a = (k / 14) * Math.PI * 2 + rnd2() * .3; const pts = [[0, 0]]; let x = 0, y = 0;
      for (let i = 0; i < 10; i++) { a += (rnd2() - .5) * .5; x += Math.cos(a) * .09; y += Math.sin(a) * .09; pts.push([x, y]); }
      return pts;
    });
    cine = { res, stages: STAGES.slice(0, res.tier), i: 0, t: 0, cracks, seam, stars, debris, glass, flash: 0 };

  }
  function enterStage() {
    const st = cine.stages[cine.i];
    shout(STAGE_TEXT[st]);
    ({
      crack: () => { sfx.snap(.8); sfx.crack(); },
      split: () => { sfx.crack(); sfx.rumble(1.2, .5); },
      town: () => sfx.rumble(1.6, .7),
      japan: () => sfx.rumble(1.8, .9),
      earth: () => sfx.boom(),

  }
  function updateCine(dt) {

    if (cine.t >= STAGE_DUR[st]) {
      if (cine.i < cine.stages.length - 1) { cine.i++; cine.t = 0; enterStage(); }
      else { cine.t = STAGE_DUR[st]; state = 'done'; finish(cine.res); }
    }
  }
  function skipCine() {
    if (!cine) return;

  }

  function shakeFor(st, p) {
    const amp = { crack: 3, split: 6, town: 8, japan: 9, earth: 12, universe: 6 }[st] * (1 - p) * (state === 'cine' ? 1 : 0);
    return [(Math.random() - .5) * amp, (Math.random() - .5) * amp];
  }

  function drawCracks(p) {
    ctx.lineCap = 'round';
    for (const pts of cine.cracks) {
      const n = Math.max(1, Math.floor(pts.length * ease(p * 1.3)));
      for (const [w, c, o] of [[2.4, 'rgba(255,230,180,.35)', .8], [1.6, 'rgba(30,15,5,.92)', 0]]) {

  }

    for (const [x, y] of cine.seam) ctx.lineTo(px(x), py(y));

    ctx.closePath();
  }

  function drawSplit(p) {
    ctx.drawImage(tatamiCanvas, 0, 0, W, H);

  function drawTown(p) {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#1b1f3a'); sky.addColorStop(.55, '#6b4a6e'); sky.addColorStop(1, '#e09a5c');

    ctx.fillRect(W / 2 - g, gy, g * 2, H);
    ctx.restore();
  }

  // ざっくりした日本列島（0〜1の座標）
  const JAPAN = [
    [[.66, .14], [.72, .12], [.78, .16], [.76, .22], [.70, .23], [.66, .19]],                               // 北海道
    [[.64, .28], [.66, .36], [.63, .44], [.58, .52], [.50, .58], [.42, .62], [.34, .65], [.28, .66]],     // 本州
    [[.38, .70], [.44, .69], [.46, .72], [.40, .74]],                                                       // 四国
    [[.22, .68], [.27, .70], [.27, .77], [.22, .80], [.19, .74]],                                           // 九州
  ];
  function drawJapanShape(cx0, cy0, size) {
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    JAPAN.forEach((pts, k) => {
      const closed = k !== 1;
      for (const [w, c] of [[k === 1 ? .075 : .03, '#e8dcb0'], [k === 1 ? .06 : .02, '#5f9a4c']]) {
        ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = w * size;
        ctx.beginPath();
        pts.forEach(([x, y], i) => { const X = cx0 + (x - .5) * size, Y = cy0 + (y - .5) * size; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
        if (closed) { ctx.closePath(); ctx.fill(); }
        ctx.stroke();
      }
    });
  }
  function drawJapan(p) {
    const sea = ctx.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, Math.max(W, H));
    sea.addColorStop(0, '#2f6f9a'); sea.addColorStop(1, '#0f2c44');
    ctx.fillStyle = sea; ctx.fillRect(0, 0, W, H);
    const size = Math.min(W, H) * (1.25 - ease(p) * .15);
    const cx0 = W / 2, cy0 = H / 2;
    const crackX = cx0 + (.5 - .5) * size;  // 本州の真ん中あたり
    const g = ease(p) * size * .08;
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.translate(side * g, -side * g * .5);
      ctx.beginPath();
      if (side < 0) ctx.rect(-W, -H, crackX + W, H * 3); else ctx.rect(crackX, -H, W * 2, H * 3);
      ctx.clip();
      drawJapanShape(cx0, cy0, size);
      ctx.restore();
    }
    ctx.fillStyle = '#b8402e';
    ctx.beginPath(); ctx.arc(crackX, cy0 + .06 * size, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(245,239,224,.85)'; ctx.font = '900 12px "Zen Kaku Gothic New", sans-serif';
    ctx.fillText('天元', crackX + 8, cy0 + .06 * size + 4);
  }

  function drawStars(alpha = 1) {
    ctx.fillStyle = '#05060c'; ctx.fillRect(0, 0, W, H);
    for (const s of cine.stars) {
      ctx.fillStyle = `rgba(255,255,255,${(.4 + s.r / 3) * alpha})`;
      ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
    }
  }
  function drawEarthHalves(cx0, cy0, rE, g, rot) {
    // 割れ目の奥に光るコア
    const core = ctx.createRadialGradient(cx0, cy0, 0, cx0, cy0, rE * .9);
    core.addColorStop(0, `rgba(255,240,180,${Math.min(1, g / rE * 3)})`); core.addColorStop(.4, `rgba(255,120,30,${Math.min(.9, g / rE * 3)})`); core.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = core; ctx.beginPath(); ctx.arc(cx0, cy0, rE * .9, 0, Math.PI * 2); ctx.fill();
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.translate(side * g, side * g * .12);
      ctx.translate(cx0, cy0); ctx.rotate(side * rot); ctx.translate(-cx0, -cy0);
      ctx.beginPath();
      const k = rE / 6;
      ctx.moveTo(cx0 + (side < 0 ? -rE * 2 : rE * 2), cy0 - rE * 2);
      for (let i = -6; i <= 6; i++) ctx.lineTo(cx0 + ((i % 2) ? k * .35 : -k * .35), cy0 + i * k);
      ctx.lineTo(cx0 + (side < 0 ? -rE * 2 : rE * 2), cy0 + rE * 2);
      ctx.closePath(); ctx.clip();
      const sea = ctx.createRadialGradient(cx0 - rE * .35, cy0 - rE * .35, rE * .1, cx0, cy0, rE);
      sea.addColorStop(0, '#5fa8e0'); sea.addColorStop(.7, '#1f5f9a'); sea.addColorStop(1, '#0b2c52');
      ctx.fillStyle = sea; ctx.beginPath(); ctx.arc(cx0, cy0, rE, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.arc(cx0, cy0, rE, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = '#4f8f45';
      for (const [dx, dy, w, h] of [[-.45, -.3, .35, .22], [-.2, .2, .25, .4], [.35, -.15, .3, .3], [.45, .35, .2, .15], [.05, -.55, .3, .12]]) {
        ctx.beginPath(); ctx.ellipse(cx0 + dx * rE, cy0 + dy * rE, w * rE, h * rE, .4, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      ctx.beginPath(); ctx.ellipse(cx0, cy0 - rE * .1, rE * .9, rE * .08, -.2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // 割れ面のマグマ
      ctx.strokeStyle = `rgba(255,120,30,${Math.min(1, g / 10)})`; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = -6; i <= 6; i++) { const X = cx0 + ((i % 2) ? k * .35 : -k * .35), Y = cy0 + i * k; i === -6 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y); }
      ctx.stroke();
      ctx.restore();
    }
  }
  function drawEarth(p) {
    drawStars();
    const rE = Math.min(W, H) * .3;
    const cx0 = W / 2, cy0 = H / 2;
    const g = ease(p) * rE * .55;
    drawEarthHalves(cx0, cy0, rE, g, ease(p) * .12);
    for (const d of cine.debris) {
      const dist = rE * (.3 + ease(p) * d.s * 1.2);
      ctx.fillStyle = `rgba(150,120,90,${1 - p * .5})`;
      ctx.fillRect(cx0 + Math.cos(d.a) * dist * .7, cy0 + Math.sin(d.a) * dist, d.r, d.r);
    }
  }
  function drawUniverse(p) {
    drawStars();
    const rE = Math.min(W, H) * .12;
    drawEarthHalves(W / 2, H / 2, rE, rE * .55, .12);
    // 宇宙そのものにヒビ
    const L = Math.max(W, H);
    ctx.lineCap = 'round';
    for (const pts of cine.glass) {
      const n = Math.max(1, Math.floor(pts.length * ease(p * 1.2)));
      for (const [w, c] of [[5, 'rgba(160,200,255,.25)'], [1.5, 'rgba(255,255,255,.95)']]) {
        ctx.strokeStyle = c; ctx.lineWidth = w;
        ctx.beginPath();
        for (let i = 0; i < n; i++) { const [x, y] = pts[i]; const X = W / 2 + x * L, Y = H / 2 + y * L; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
        ctx.stroke();
      }
    }
    if (cine.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${cine.flash * .8})`; ctx.fillRect(0, 0, W, H); }
  }

  function drawCine() {
    const st = cine.stages[cine.i];
    const p = cine.t / STAGE_DUR[st];
    const [sx0, sy0] = shakeFor(st, p);
    ctx.save();
    ctx.translate(sx0, sy0);
    if (st === 'crack') {
      drawBoard(); drawStone(stone.x, stone.y, R); drawCracks(p);
      const gl = ctx.createRadialGradient(px(TX), py(TY), 0, px(TX), py(TY), 90 * S);
      gl.addColorStop(0, `rgba(255,220,120,${.5 * (1 - p)})`); gl.addColorStop(1, 'rgba(255,220,120,0)');
      ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
    }
    else if (st === 'split') drawSplit(p);
    else if (st === 'town') drawTown(p);
    else if (st === 'japan') drawJapan(p);
    else if (st === 'earth') drawEarth(p);
    else drawUniverse(p);
    ctx.restore();
  }

  let last = 0;
  function frame(now) {
    const dt = last ? Math.min(0.033, (now - last) / 1000) : 0;
    last = now;
    // 物理は細かく刻む
    const n = 4;
    for (let i = 0; i < n; i++) update(dt / n);
    updateCine(dt);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (cine) { drawCine(); drawLoupe(); requestAnimationFrame(frame); return; }
    drawBoard();
    drawStartMark();
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i];
      ctx.fillStyle = `rgba(20,20,20,${(i / trail.length) * 0.12})`;
      ctx.beginPath(); ctx.arc(px(t.x), py(t.y), R * S, 0, Math.PI * 2); ctx.fill();
    }
    const pullOff = state === 'drag' && drag ? Math.min(40, drag.pull * 0.2) / S : 0;
    drawStone(stone.x, stone.y + pullOff, R, stone.z, state === 'fall' ? Math.max(0, stone.z) : 1);
    drawLoupe();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
