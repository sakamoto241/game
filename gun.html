<title>にゃんガン工房</title>
<meta name="description" content="銃のパーツをグリッドで組み替えて、迫り来る動物たちを撃退するウェーブシューティング">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<style>
  /* 手描きコミック風の世界で固定した配色（ライト/ダーク共通） */
  :root { color-scheme: light; --ink: #2B2320; --paper: #F4E9D2; --red: #C8412E; --pop: "Dela Gothic One", "Hiragino Sans", sans-serif; --round: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: #3A2E28; }
  body { font-family: var(--round); color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .col { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100vw, 62vh, 480px); pointer-events: none; }
  .col > * { pointer-events: auto; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(30,20,16,.55); }
  .card { width: 100%; background: var(--paper); border: 4px solid var(--ink); border-radius: 18px; padding: 18px; display: grid; gap: 12px; text-align: center; box-shadow: 0 6px 0 var(--ink); }
  .card h1 { margin: 0; font-family: var(--pop); font-weight: 400; font-size: clamp(34px, 10vw, 46px); line-height: 1.1; color: var(--red); -webkit-text-stroke: 1.5px var(--ink); text-wrap: balance; }
  .card h1 small { display: block; font-size: .36em; color: var(--ink); -webkit-text-stroke: 0; letter-spacing: .25em; margin-top: 6px; }
  .card h2 { margin: 0; font-family: var(--pop); font-weight: 400; font-size: 28px; }
  .card p { margin: 0; font-weight: 700; font-size: 14px; line-height: 1.7; }
  .how { text-align: left; background: rgba(255,255,255,.55); border: 2px dashed var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; line-height: 1.8; font-weight: 700; }
  .how b { color: var(--red); }
  .btn { font: inherit; font-weight: 800; font-size: 17px; border: 3px solid var(--ink); border-radius: 14px; padding: 12px 18px; background: #F2B53C; cursor: pointer; box-shadow: 0 4px 0 var(--ink); color: var(--ink); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn.white { background: #fff; }
  .btn:focus-visible, .pick:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .picks { display: grid; gap: 8px; }
  .pick { font: inherit; display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; text-align: left; border: 3px solid var(--ink); border-radius: 14px; background: #fff; padding: 8px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); color: var(--ink); }
  .pick canvas { width: 64px; height: 48px; }
  .pick b { display: block; font-size: 16px; }
  .pick small { font-size: 12.5px; font-weight: 700; color: #6A5A50; line-height: 1.5; display: block; }
  .pick .lv { color: var(--red); }
  .toast { position: fixed; left: 50%; top: 22%; transform: translate(-50%, -50%); z-index: 50; pointer-events: none; font-family: var(--pop); font-size: clamp(30px, 9vw, 44px); color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); white-space: nowrap; }
</style>

<canvas id="cv"></canvas>
<div class="col">
  <div class="overlay" id="ov" hidden><div class="card" id="card"></div></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const rand = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const INK = '#2B2320';

// =====================================================================
// データ：銃の本体とパーツ
// =====================================================================
// 本体：グリッド上で占めるマス（8×6 の中）と 基本ステータス
const BODIES = {
  pistol: { name: 'ピストル', cells: [[2, 2], [3, 2], [4, 2], [2, 3]], base: { atk: 20, rate: 2.0, crit: 5, critDmg: 150, range: 230, mag: 8, reload: 1.3 } },
  rifle:  { name: 'アサルトライフル', cells: [[1, 2], [2, 2], [3, 2], [4, 2], [5, 2], [2, 3], [4, 3]], base: { atk: 26, rate: 3.6, crit: 8, critDmg: 160, range: 270, mag: 18, reload: 1.6 } },
};
// パーツ：shape = 占めるマス、pref = ボーナスが付く位置（本体から見て）
const PARTS = {
  barrel:   { name: 'バレル', shape: [[0, 0], [1, 0]], pref: 'front', color: '#8E96A3', st: { atk: 6, range: 25 }, desc: '攻撃+6 射程+25' },
  long:     { name: 'ロングバレル', shape: [[0, 0], [1, 0], [2, 0]], pref: 'front', color: '#6E7684', st: { atk: 11, range: 60, ratePct: -8 }, desc: '攻撃+11 射程+60 連射-8%' },
  scope:    { name: 'スコープ', shape: [[0, 0], [1, 0]], pref: 'top', color: '#3E4A5C', st: { crit: 7, range: 45 }, desc: '会心率+7% 射程+45' },
  laser:    { name: 'レーザーサイト', shape: [[0, 0]], pref: 'top', color: '#D8483A', st: { crit: 4, ratePct: 6 }, desc: '会心率+4% 連射+6%' },
  grip:     { name: 'グリップ', shape: [[0, 0], [0, 1]], pref: 'bottom', color: '#7A5A3E', st: { ratePct: 18 }, desc: '連射+18%' },
  mag:      { name: 'マガジン', shape: [[0, 0], [0, 1]], pref: 'bottom', color: '#4A4F58', st: { mag: 5, reloadPct: 10 }, desc: '弾数+5 リロード-10%' },
  drum:     { name: 'ドラムマガジン', shape: [[0, 0], [1, 0], [0, 1], [1, 1]], pref: 'bottom', color: '#5A5048', st: { mag: 14, ratePct: 8 }, desc: '弾数+14 連射+8%' },
  stock:    { name: 'ストック', shape: [[0, 0], [1, 0]], pref: 'back', color: '#9A6A3E', st: { critDmg: 30, atkPct: 6 }, desc: '会心ダメ+30% 攻撃+6%' },
  core:     { name: 'パワーコア', shape: [[0, 0], [1, 0], [0, 1]], pref: null, color: '#E0A83A', st: { atkPct: 18 }, desc: '攻撃+18%（どこでもOK）' },
  pierce:   { name: '貫通チップ', shape: [[0, 0]], pref: null, color: '#5AA0D8', st: { pierce: 1 }, desc: '弾が 敵を1体 貫通' },
  boom:     { name: '爆発チップ', shape: [[0, 0]], pref: null, color: '#E0643A', st: { splash: 12 }, desc: '12%で 爆発（まわりにダメージ）' },
  fang:     { name: '吸血キバ', shape: [[0, 0]], pref: null, color: '#B03A5A', st: { heal: 2 }, desc: '敵を倒すと 体力+2' },
};
// 合成レベルごとの 倍率（同じパーツ・同じレベルを重ねると +1）
const LV_MUL = [0, 1, 2, 3.5, 5.5];
const MAX_LV = 4;
const PREF_BONUS = 1.5;
const PREF_LABEL = { front: '前', top: '上', bottom: '下', back: 'うしろ' };

// 敵
const ENEMIES = {
  pig:    { name: 'ブタ', hp: 40, speed: 30, dmg: 6, coin: 3, r: 22, color: '#F2A8A8' },
  bunny:  { name: 'ウサギ', hp: 24, speed: 62, dmg: 4, coin: 3, r: 18, color: '#F4EEE4' },
  crow:   { name: 'カラス', hp: 30, speed: 48, dmg: 5, coin: 4, r: 18, color: '#3A3A44', fly: true },
  turtle: { name: 'カメ', hp: 120, speed: 15, dmg: 10, coin: 6, r: 26, color: '#8CB86A', armor: 0.3 },
  goat:   { name: 'ヤギ', hp: 75, speed: 34, dmg: 12, coin: 5, r: 24, color: '#E8E2D4', charge: true },
  bear:   { name: 'ボスグマ', hp: 700, speed: 13, dmg: 25, coin: 60, r: 46, color: '#8A5A3A', boss: true },
};

// =====================================================================
// 状態
// =====================================================================
const GW = 8, GH = 6, BW = 8, BH2 = 2;   // 銃グリッド 8×6、パーツ置き場 8×2
const KEY = 'nyangun-v1';
let S;
function newState() {
  return { wave: 1, best: 1, coins: 30, body: 'pistol', items: [
    { id: 1, type: 'barrel', lv: 1, rot: 0, grid: 'gun', x: 5, y: 2 },
    { id: 2, type: 'grip', lv: 1, rot: 0, grid: 'bag', x: 0, y: 0 },
    { id: 3, type: 'scope', lv: 1, rot: 0, grid: 'bag', x: 2, y: 0 },
  ], nextId: 4, seenHelp: false };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.items ? s : null; } catch (e) { return null; } }

// ---- 形・配置 ----
function shapeOf(it) {
  let cells = PARTS[it.type].shape.map(c => [...c]);
  for (let r = 0; r < (it.rot || 0); r++) cells = cells.map(([x, y]) => [-y, x]);
  const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1]));
  return cells.map(([x, y]) => [x - mx, y - my]);
}
function cellsOf(it, x = it.x, y = it.y) { return shapeOf(it).map(([a, b]) => [x + a, y + b]); }
function gridSize(g) { return g === 'gun' ? [GW, GH] : [BW, BH2]; }
function bodyCells() { return BODIES[S.body].cells; }
function occupied(g, ignore) {
  const m = new Map();
  if (g === 'gun') for (const [x, y] of bodyCells()) m.set(x + ',' + y, 'body');
  for (const it of S.items) if (it.grid === g && it !== ignore) for (const [x, y] of cellsOf(it)) m.set(x + ',' + y, it);
  return m;
}
function canPlace(it, g, x, y) {
  const [w, h] = gridSize(g);
  const occ = occupied(g, it);
  for (const [cx, cy] of cellsOf(it, x, y)) {
    if (cx < 0 || cy < 0 || cx >= w || cy >= h) return false;
    if (occ.has(cx + ',' + cy)) return false;
  }
  return true;
}
function findBagSpot(it) {
  for (let r = 0; r < 4; r++) {
    const test = { ...it, rot: (it.rot + r) % 4 };
    for (let y = 0; y < BH2; y++) for (let x = 0; x < BW; x++) if (canPlace(test, 'bag', x, y)) return { x, y, rot: test.rot };
  }
  return null;
}

// ---- 接続判定：本体からつながっているパーツだけが 効く ----
function activeSet() {
  const occ = occupied('gun');
  const q = bodyCells().map(c => c.slice());
  const act = new Set();
  const visited = new Set(q.map(c => c.join(',')));
  while (q.length) {
    const [x, y] = q.shift();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const k = (x + dx) + ',' + (y + dy);
      if (visited.has(k)) continue;
      const o = occ.get(k);
      if (o && o !== 'body') {
        visited.add(k);
        if (!act.has(o)) { act.add(o); for (const c of cellsOf(o)) { const kk = c.join(','); if (!visited.has(kk)) visited.add(kk); q.push(c); } }
      }
    }
  }
  return act;
}
// ---- 位置ボーナス：本体の 前/上/下/うしろ に 置くと 1.5倍 ----
function regionOf(it) {
  const bc = bodyCells();
  const minX = Math.min(...bc.map(c => c[0])), maxX = Math.max(...bc.map(c => c[0]));
  const minY = Math.min(...bc.map(c => c[1])), maxY = Math.max(...bc.map(c => c[1]));
  const cs = cellsOf(it);
  const cx = cs.reduce((n, c) => n + c[0], 0) / cs.length, cy = cs.reduce((n, c) => n + c[1], 0) / cs.length;
  if (cx > maxX) return 'front';
  if (cx < minX) return 'back';
  if (cy < minY) return 'top';
  return 'bottom';
}
function hasBonus(it) { const p = PARTS[it.type].pref; return p && regionOf(it) === p; }

// ---- ステータス計算 ----
function calcStats() {
  const b = BODIES[S.body].base;
  const add = { atk: 0, atkPct: 0, ratePct: 0, crit: 0, critDmg: 0, range: 0, mag: 0, reloadPct: 0, pierce: 0, splash: 0, heal: 0 };
  const act = activeSet();
  for (const it of act) {
    const k = LV_MUL[it.lv] * (hasBonus(it) ? PREF_BONUS : 1);
    for (const [s, v] of Object.entries(PARTS[it.type].st)) add[s] += s === 'pierce' ? Math.max(1, Math.round(LV_MUL[it.lv] / 2)) : v * k;
  }
  const st = {
    atk: Math.round((b.atk + add.atk) * (1 + add.atkPct / 100)),
    rate: Math.max(0.5, b.rate * (1 + add.ratePct / 100)),
    crit: clamp(b.crit + add.crit, 0, 100),
    critDmg: b.critDmg + add.critDmg,
    range: Math.round(b.range + add.range),
    mag: Math.round(b.mag + add.mag),
    reload: b.reload * Math.max(0.3, 1 - add.reloadPct / 100),
    pierce: Math.round(add.pierce),
    splash: clamp(add.splash, 0, 80),
    heal: Math.round(add.heal),
  };
  // 目安の DPS（リロード込み）
  const cycle = st.mag / st.rate + st.reload;
  st.dps = Math.round(st.atk * (1 + st.crit / 100 * (st.critDmg / 100 - 1)) * st.mag / cycle);
  return st;
}

// =====================================================================
// 画面レイアウト（縦長スマホ：上バトル／中ステータス／下グリッド）
// =====================================================================
let W, H, dpr, SC, LH, OX, L = {};
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const colW = Math.min(W, H * 0.62, 480);
  OX = (W - colW) / 2; SC = colW / 390; LH = H / SC;
  const battleH = Math.max(230, Math.min(LH * 0.38, 340));
  const statY = battleH;
  const cs = Math.floor(Math.min(44, (390 - 30) / GW, (LH - battleH - 58 - 26 - 64 - 16) / (GH + BH2 + 0.6)));
  const gx = (390 - cs * GW) / 2;
  L = { battleH, statY, cs, gun: { x: gx, y: statY + 62, w: GW, h: GH }, bag: { x: gx, y: statY + 62 + cs * GH + 22, w: BW, h: BH2 } };
  L.btnY = L.bag.y + cs * BH2 + 10;
  L.groundY = battleH - 34;
  L.catX = 58;
}
window.addEventListener('resize', resize);
resize();

// =====================================================================
// バトル
// =====================================================================
let B = null;   // ウェーブ中の状態
let stats = null;
let catHp = 100, catMax = 100;
function startWave() {
  stats = calcStats();
  const w = S.wave;
  const boss = w % 5 === 0;
  const pool = ['pig'];
  if (w >= 2) pool.push('bunny');
  if (w >= 3) pool.push('crow');
  if (w >= 4) pool.push('turtle');
  if (w >= 6) pool.push('goat');
  const count = boss ? 4 + w : 6 + w * 2;
  const queue = [];
  for (let i = 0; i < count; i++) queue.push(pick(pool));
  if (boss) queue.splice(Math.floor(count * 0.6), 0, 'bear');
  catMax = 100 + (w - 1) * 5; catHp = catMax;
  B = { queue, enemies: [], shots: [], nums: [], fx: [], spawnT: 0.8, interval: Math.max(0.45, 1.3 - w * 0.05), ammo: stats.mag, cd: 0, reloadT: 0, kills: 0, coins: 0, total: queue.length, state: 'run', t: 0, recoil: 0 };
  toast(boss ? `WAVE ${w} ボス！` : `WAVE ${w}`);
}
function enemyHpScale() { return Math.pow(1.17, S.wave - 1); }
function spawnEnemy(type) {
  const d = ENEMIES[type];
  const hp = Math.round(d.hp * enemyHpScale() * (d.boss ? 1 + S.wave * 0.1 : 1));
  const y = d.fly ? L.groundY - rand(70, 110) : L.groundY;
  B.enemies.push({ type, d, hp, max: hp, x: 390 + d.r + 10, y, t: rand(0, 6), atkT: 0, flash: 0, chargeT: rand(2, 4), speedMul: 1 });
}
function nearestTarget() {
  let best = null, bd = Infinity;
  for (const e of B.enemies) { if (e.hp <= 0) continue; const d = e.x - L.catX; if (d <= stats.range && d < bd) { bd = d; best = e; } }
  return best;
}
function damageEnemy(e, dmg, crit) {
  const d = Math.max(1, Math.round(dmg * (1 - (e.d.armor || 0))));
  e.hp -= d; e.flash = 0.08;
  B.nums.push({ x: e.x + rand(-8, 8), y: e.y - e.d.r * 2 - 6, t: 0.8, text: d, crit });
  if (e.hp <= 0) {
    B.kills++; const c = Math.round(e.d.coin * (1 + S.wave * 0.05)); B.coins += c; S.coins += c;
    if (stats.heal) catHp = Math.min(catMax, catHp + stats.heal);
    for (let i = 0; i < 12; i++) B.fx.push({ x: e.x, y: e.y - e.d.r, vx: rand(-120, 120), vy: rand(-200, -40), life: .6, c: e.d.color });
  }
}
function fire() {
  const tgt = nearestTarget();
  if (!tgt) return false;
  const crit = Math.random() * 100 < stats.crit;
  const dmg = stats.atk * (crit ? stats.critDmg / 100 : 1) * rand(0.92, 1.08);
  const mz = muzzlePos();
  B.shots.push({ x: mz.x, y: mz.y, tx: tgt.x, ty: tgt.y - tgt.d.r, t: 0, life: Math.max(0.05, (tgt.x - mz.x) / 1400) });
  B.recoil = 0.08;
  // 当たり（貫通すると うしろの敵にも）
  const line = B.enemies.filter(e => e.hp > 0 && e.x >= tgt.x && Math.abs((e.y - e.d.r) - (tgt.y - tgt.d.r)) < 40).sort((a, b) => a.x - b.x).slice(0, 1 + stats.pierce);
  setTimeout(() => {
    if (!B) return;
    line.forEach((e, i) => { if (e.hp > 0) damageEnemy(e, dmg * (i ? 0.7 : 1), crit); });
    if (Math.random() * 100 < stats.splash) {
      B.fx.push({ boom: true, x: tgt.x, y: tgt.y - tgt.d.r, life: .35, r: 55 });
      for (const e of B.enemies) if (e.hp > 0 && Math.hypot(e.x - tgt.x, e.y - tgt.y) < 70) damageEnemy(e, dmg * 0.5, false);
    }
  }, (tgt.x - mz.x) / 1400 * 1000);
  sfx.shot();
  return true;
}
function updateBattle(dt) {
  if (!B || B.state !== 'run') return;
  B.t += dt;
  stats = calcStats();
  // 出現
  B.spawnT -= dt;
  if (B.spawnT <= 0 && B.queue.length) { spawnEnemy(B.queue.shift()); B.spawnT = B.interval * rand(0.7, 1.3); }
  // 射撃（弾数とリロード）
  B.recoil = Math.max(0, B.recoil - dt);
  if (B.reloadT > 0) { B.reloadT -= dt; if (B.reloadT <= 0) B.ammo = stats.mag; }
  else {
    B.cd -= dt;
    if (B.cd <= 0) { if (fire()) { B.ammo--; B.cd = 1 / stats.rate; if (B.ammo <= 0) B.reloadT = stats.reload; } else B.cd = 0.05; }
  }
  // 敵の移動と攻撃
  for (const e of B.enemies) {
    if (e.hp <= 0) continue;
    e.t += dt; e.flash = Math.max(0, e.flash - dt);
    const stopX = L.catX + 34 + e.d.r;
    if (e.d.charge) { e.chargeT -= dt; if (e.chargeT <= 0) { e.speedMul = e.speedMul > 1 ? 1 : 3.2; e.chargeT = e.speedMul > 1 ? 0.5 : rand(2, 3.5); } }
    if (e.x > stopX) e.x -= e.d.speed * e.speedMul * dt;
    else {
      e.atkT -= dt;
      if (e.atkT <= 0) { e.atkT = 1; catHp -= e.d.dmg * (1 + S.wave * 0.08); B.catHurt = 0.2; sfx.hurt(); }
    }
  }
  B.enemies = B.enemies.filter(e => e.hp > 0);
  B.catHurt = Math.max(0, (B.catHurt || 0) - dt);
  for (const s of B.shots) s.t += dt;
  B.shots = B.shots.filter(s => s.t < s.life + 0.05);
  for (const n of B.nums) { n.t -= dt; n.y -= 40 * dt; }
  B.nums = B.nums.filter(n => n.t > 0);
  for (const f of B.fx) { f.life -= dt; if (!f.boom) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 500 * dt; } }
  B.fx = B.fx.filter(f => f.life > 0);

  if (catHp <= 0) { catHp = 0; B.state = 'lose'; sfx.lose(); setTimeout(showLose, 700); }
  else if (!B.queue.length && !B.enemies.length) { B.state = 'win'; sfx.win(); setTimeout(showReward, 600); }
}

// =====================================================================
// 報酬・ショップ
// =====================================================================
function newItem(type, lv = 1) { return { id: S.nextId++, type, lv, rot: 0, grid: 'bag', x: 0, y: 0 }; }
function putInBag(it) {
  const spot = findBagSpot(it);
  if (!spot) return false;
  Object.assign(it, spot, { grid: 'bag' });
  S.items.push(it);
  return true;
}
function partCanvas(type, lv) {
  const c = document.createElement('canvas');
  const d = Math.min(2, window.devicePixelRatio || 1);

  if (types.has('drum')) { ctx.fillStyle = '#5A5048'; ctx.beginPath(); ctx.arc(bodyLen * 0.5, 16, 10, 0, 7); ctx.fill(); ctx.stroke(); }
  // スコープ・レーザー
  if (types.has('scope')) { ctx.fillStyle = '#3E4A5C'; ctx.beginPath(); ctx.rect(4, -20, 22, 8); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#9FD4EC'; ctx.beginPath(); ctx.arc(26, -16, 4, 0, 7); ctx.fill(); ctx.stroke(); }
  if (types.has('laser')) { ctx.fillStyle = '#D8483A'; ctx.beginPath(); ctx.rect(bodyLen - 12, 3, 10, 5); ctx.fill(); ctx.stroke(); if (B) { ctx.strokeStyle = 'rgba(255,60,50,.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(bodyLen - 2, 5); ctx.lineTo(bodyLen + stats.range - 20, 5); ctx.stroke(); } }
  if (types.has('core')) { ctx.fillStyle = '#E0A83A'; ctx.beginPath(); ctx.arc(bodyLen * 0.3, -1, 3.5, 0, 7); ctx.fill(); }
  // マズルフラッシュ
  if (B && B.recoil > 0.04) { ctx.fillStyle = '#FFE38A'; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5, r = i % 2 ? 5 : 13; ctx.lineTo(len + 6 + Math.cos(a) * r, -2 + Math.sin(a) * r); } ctx.closePath(); ctx.fill(); ctx.stroke(); }
  ctx.restore();
}

// ---- 敵 ----
function drawEnemy(e) {
  const d = e.d, r = d.r;
  const bob = d.fly ? Math.sin(e.t * 8) * 4 : Math.abs(Math.sin(e.t * (d.speed / 6))) * 3;
  ctx.save(); ctx.translate(e.x, e.y - bob);
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const col = e.flash > 0 ? '#FFFFFF' : d.color;
  if (!d.fly) { ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(0, bob, r, 5, 0, 0, 7); ctx.fill(); }
  const legs = () => { const s = Math.sin(e.t * d.speed / 5) * 5; ctx.beginPath(); ctx.moveTo(-r * 0.4, -r * 0.3); ctx.lineTo(-r * 0.4 - s, 0); ctx.moveTo(r * 0.3, -r * 0.3); ctx.lineTo(r * 0.3 + s, 0); ctx.stroke(); };
  const eye = (x, y) => { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x - 1.5, y, 2, 0, 7); ctx.fill(); ctx.beginPath(); ctx.moveTo(x - 6, y - 7); ctx.lineTo(x + 4, y - 4); ctx.stroke(); };
  if (e.type === 'pig') {
    legs(); ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, -r * 0.9, r, r * 0.75, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r * 0.3, -r * 1.55); ctx.lineTo(-r * 0.15, -r * 1.9); ctx.lineTo(0, -r * 1.55); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-r * 0.9, -r * 0.85, r * 0.3, r * 0.24, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(-r * 0.95, -r * 0.88, 2, 0, 7); ctx.arc(-r * 0.83, -r * 0.88, 2, 0, 7); ctx.fill();
    eye(-r * 0.45, -r * 1.15);
  } else if (e.type === 'bunny') {
    legs(); ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, -r, r * 0.8, r * 0.85, 0, 0, 7); ctx.fill(); ctx.stroke();
    for (const dx of [-0.2, 0.25]) { ctx.beginPath(); ctx.ellipse(r * dx, -r * 2.2, r * 0.2, r * 0.6, dx, 0, 7); ctx.fill(); ctx.stroke(); }
    eye(-r * 0.35, -r * 1.2); ctx.fillStyle = '#F2A0B0'; ctx.beginPath(); ctx.arc(-r * 0.75, -r * 0.95, 3, 0, 7); ctx.fill();
  } else if (e.type === 'crow') {
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, -r, r, r * 0.7, 0, 0, 7); ctx.fill(); ctx.stroke();
    const f = Math.sin(e.t * 16) * 10; ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.6, -r * 1.6 - f); ctx.lineTo(r * 1.1, -r * 1.1); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#F2B53C'; ctx.beginPath(); ctx.moveTo(-r * 0.9, -r * 1.05); ctx.lineTo(-r * 1.5, -r * 0.95); ctx.lineTo(-r * 0.9, -r * 0.8); ctx.fill(); ctx.stroke();
    eye(-r * 0.5, -r * 1.15);
  } else if (e.type === 'turtle') {
    legs(); ctx.fillStyle = '#C8B87A'; ctx.beginPath(); ctx.ellipse(-r * 0.9, -r * 0.7, r * 0.35, r * 0.3, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, -r * 0.7, r, r * 0.7, 0, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.7); ctx.lineTo(-r * 0.3, -r * 1.2); ctx.lineTo(r * 0.3, -r * 1.2); ctx.lineTo(r * 0.5, -r * 0.7); ctx.stroke();
    eye(-r * 0.95, -r * 0.8);
  } else if (e.type === 'goat') {
    legs(); ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, -r * 0.9, r, r * 0.7, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-r * 0.9, -r * 1.4, r * 0.45, r * 0.4, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = INK; ctx.beginPath(); ctx.moveTo(-r * 0.8, -r * 1.75); ctx.quadraticCurveTo(-r * 0.3, -r * 2.2, -r * 0.2, -r * 1.6); ctx.stroke();
    eye(-r * 1.0, -r * 1.45);
    if (e.speedMul > 1) { ctx.strokeStyle = 'rgba(0,0,0,.4)'; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(r * 1.1, -r * (0.5 + k * 0.3)); ctx.lineTo(r * 1.8, -r * (0.5 + k * 0.3)); ctx.stroke(); } }
  } else if (e.type === 'bear') {
    legs(); ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, -r * 0.9, r, r * 0.9, 0, 0, 7); ctx.fill(); ctx.stroke();
    for (const dx of [-0.6, 0.5]) { ctx.beginPath(); ctx.arc(r * dx, -r * 1.7, r * 0.25, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = '#C8A07A'; ctx.beginPath(); ctx.ellipse(-r * 0.5, -r * 0.8, r * 0.35, r * 0.25, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(-r * 0.7, -r * 0.85, 4, 0, 7); ctx.fill();
    eye(-r * 0.55, -r * 1.25); eye(-r * 0.1, -r * 1.25);
    ctx.fillStyle = '#F2B53C'; ctx.beginPath(); ctx.moveTo(-r * 0.4, -r * 1.85); for (let i = 0; i < 5; i++) ctx.lineTo(-r * 0.4 + i * r * 0.2, -r * (i % 2 ? 1.85 : 2.15)); ctx.lineTo(r * 0.4, -r * 1.85); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
  // 体力バー
  const w = Math.max(34, r * 1.6), y = e.y - bob - r * (d.boss ? 2.4 : 2.2) - 10;
  ctx.fillStyle = INK; ctx.fillRect(e.x - w / 2 - 2, y - 2, w + 4, 9);
  ctx.fillStyle = '#C8412E'; ctx.fillRect(e.x - w / 2, y, w * clamp(e.hp / e.max, 0, 1), 5);
}

let activeCache = new Set();
function draw(dt) {
  activeCache = activeSet();
  stats = stats || calcStats();
  const liveStats = calcStats();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#3A2E28'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(dpr * SC, 0, 0, dpr * SC, dpr * OX, 0);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 390, LH); ctx.clip();

  // ---------- バトル ----------
  const bh = L.battleH;
  ctx.fillStyle = '#EFE3C8'; ctx.fillRect(0, 0, 390, bh);
  // 手描きの森と 赤い幕
  ctx.fillStyle = '#C8412E'; ctx.fillRect(150, 30, 240, bh - 64);
  ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 2; for (let x = 160; x < 390; x += 22) { ctx.beginPath(); ctx.moveTo(x, 30); ctx.lineTo(x + 6, bh - 34); ctx.stroke(); }
  for (const [tx, s] of [[330, 1], [370, 0.8], [20, 0.9]]) { ctx.fillStyle = '#3E5A48'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(tx, 20); ctx.lineTo(tx - 26 * s, 90 * s + 20); ctx.lineTo(tx + 26 * s, 90 * s + 20); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = '#D8C8A4'; ctx.fillRect(0, L.groundY, 390, bh - L.groundY);
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, L.groundY); ctx.lineTo(390, L.groundY + 1); ctx.stroke();
  // 射程の線
  ctx.strokeStyle = 'rgba(43,35,32,.25)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
  const rx = L.catX + liveStats.range; ctx.beginPath(); ctx.moveTo(rx, 40); ctx.lineTo(rx, L.groundY); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(43,35,32,.5)'; ctx.font = '800 10px "M PLUS Rounded 1c"'; ctx.textAlign = 'center'; ctx.fillText('射程', rx, 36);

  if (B) for (const e of B.enemies) drawEnemy(e);
  drawCat();
  if (B) {
    for (const s of B.shots) { const k = clamp(s.t / s.life, 0, 1); const x = s.x + (s.tx - s.x) * k, y = s.y + (s.ty - s.y) * k; ctx.strokeStyle = '#FFE38A'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 12, y); ctx.lineTo(x, y); ctx.stroke(); }
    for (const f of B.fx) {
      if (f.boom) { ctx.fillStyle = `rgba(255,150,60,${f.life * 2})`; ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.2 - f.life), 0, 7); ctx.fill(); ctx.stroke(); }
      else { ctx.fillStyle = f.c; ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(f.x, f.y, 4, 0, 7); ctx.fill(); ctx.stroke(); }
    }
    for (const n of B.nums) {
      ctx.globalAlpha = Math.min(1, n.t * 2);
      ctx.font = `${n.crit ? 22 : 15}px "Dela Gothic One"`; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = INK;
      ctx.strokeText(n.text, n.x, n.y); ctx.fillStyle = n.crit ? '#FFD23A' : '#fff'; ctx.fillText(n.text, n.x, n.y);
      if (n.crit) { ctx.font = '800 10px "M PLUS Rounded 1c"'; ctx.fillStyle = '#FFD23A'; ctx.strokeText('CRIT!', n.x, n.y - 18); ctx.fillText('CRIT!', n.x, n.y - 18); }
    }
    ctx.globalAlpha = 1;
  }
  // 猫の体力・弾数
  const hpW = 110;
  ctx.fillStyle = INK; ctx.fillRect(10, 40, hpW + 4, 14);
  ctx.fillStyle = '#6CC46A'; ctx.fillRect(12, 42, hpW * clamp(catHp / catMax, 0, 1), 10);
  ctx.fillStyle = '#fff'; ctx.font = '800 10px "M PLUS Rounded 1c"'; ctx.textAlign = 'left'; ctx.fillText(`${Math.ceil(catHp)}/${catMax}`, 16, 51);
  if (B) {
    const mag = liveStats.mag;
    ctx.fillStyle = INK; ctx.fillText(B.reloadT > 0 ? 'リロード中…' : `弾 ${B.ammo}/${mag}`, 12, 68);
  }
  // タイトル
  ctx.font = '30px "Dela Gothic One"'; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = INK;
  const wt = `Wave ${S.wave}`; ctx.strokeText(wt, 195, 32); ctx.fillStyle = '#FFF4DA'; ctx.fillText(wt, 195, 32);
  if (B) { ctx.font = '800 11px "M PLUS Rounded 1c"'; ctx.fillStyle = INK; ctx.fillText(`のこり ${B.queue.length + B.enemies.length}体`, 195, 48); }
  ctx.textAlign = 'right'; ctx.font = '800 13px "M PLUS Rounded 1c"'; ctx.fillStyle = INK; ctx.fillText(`コイン ${S.coins}`, 380, 20);

  // ---------- ステータス ----------
  const sy = L.statY;
  ctx.fillStyle = '#6B3A2E'; ctx.fillRect(0, sy, 390, LH - sy);
  sketchRect(ctx, 8, sy + 6, 374, 50, '#EFE3C8', 3);
  const items = [
    ['攻撃', liveStats.atk], ['連射', liveStats.rate.toFixed(1) + '/s'], ['会心', Math.round(liveStats.crit) + '%'],
    ['会心ダメ', liveStats.critDmg + '%'], ['射程', liveStats.range], ['弾数', liveStats.mag],
  ];
  items.forEach(([k, v], i) => {
    const x = 8 + 374 / 6 * (i + 0.5);
    ctx.textAlign = 'center'; ctx.fillStyle = '#6A5A50'; ctx.font = '800 10px "M PLUS Rounded 1c"'; ctx.fillText(k, x, sy + 22);
    ctx.fillStyle = INK; ctx.font = '16px "Dela Gothic One"'; ctx.fillText(v, x, sy + 44);
  });
  ctx.textAlign = 'right'; ctx.fillStyle = INK; ctx.font = '800 11px "M PLUS Rounded 1c"';
  ctx.fillText(`DPS 目安 ${liveStats.dps}${liveStats.pierce ? `・貫通${liveStats.pierce}` : ''}${liveStats.splash ? `・爆発${Math.round(liveStats.splash)}%` : ''}${liveStats.heal ? `・吸血${liveStats.heal}` : ''}`, 382, L.groundY + 20);

  // ---------- グリッド ----------
  const cs = L.cs;
  for (const g of ['gun', 'bag']) {
    const r = L[g];
    sketchRect(ctx, r.x - 6, r.y - 6, r.w * cs + 12, r.h * cs + 12, g === 'gun' ? '#EFE3C8' : '#D9C8A4', 3);
    ctx.strokeStyle = 'rgba(43,35,32,.15)'; ctx.lineWidth = 1.5;
    for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(r.x + x * cs + 3, r.y + y * cs + 3, cs - 6, cs - 6, 6) : ctx.rect(r.x + x * cs + 3, r.y + y * cs + 3, cs - 6, cs - 6); ctx.stroke(); }
  }
  // 位置ボーナスの ガイド（前・上・下・うしろ）
  const bc = bodyCells();
  const minX = Math.min(...bc.map(c => c[0])), maxX = Math.max(...bc.map(c => c[0])), minY = Math.min(...bc.map(c => c[1])), maxY = Math.max(...bc.map(c => c[1]));
  ctx.font = '800 10px "M PLUS Rounded 1c"'; ctx.fillStyle = 'rgba(200,65,46,.55)'; ctx.textAlign = 'center';
  ctx.fillText('▲ 上', L.gun.x + (minX + maxX + 1) / 2 * cs, L.gun.y + minY * cs - 6);
  ctx.fillText('前 ▶', L.gun.x + (maxX + 1) * cs + cs / 2, L.gun.y + minY * cs + cs / 2 + 4);
  ctx.fillText('◀うしろ', L.gun.x + minX * cs - cs * 0.9, L.gun.y + minY * cs + cs / 2 + 4);
  ctx.fillText('▼ 下', L.gun.x + (minX + maxX + 1) / 2 * cs + cs, L.gun.y + (maxY + 1) * cs + 12);
  drawBodyOnGrid();
  ctx.fillStyle = '#FFE8C0'; ctx.textAlign = 'left'; ctx.font = '800 11px "M PLUS Rounded 1c"';
  ctx.fillText('パーツ置き場（ここのパーツは 効かない）', L.bag.x - 4, L.bag.y - 12);
  for (const it of S.items) if (!drag || drag.it !== it) drawItemAt(ctx, it, L[it.grid].x + it.x * cs, L[it.grid].y + it.y * cs, cs);
  // ドラッグ中
  if (drag && drag.moved) {
    const c = dropTarget();
    if (c) {
      const over = itemAt({ x: drag.px, y: drag.py });
      const merge = over && over.it !== drag.it && over.it.type === drag.it.type && over.it.lv === drag.it.lv && drag.it.lv < MAX_LV;
      const ok = merge || canPlace(drag.it, c.g, c.x, c.y);
      ctx.fillStyle = merge ? 'rgba(242,181,60,.5)' : ok ? 'rgba(108,196,106,.45)' : 'rgba(200,65,46,.4)';
      const cells = merge ? cellsOf(over.it) : cellsOf(drag.it, c.x, c.y);
      const r = L[merge ? over.it.grid : c.g];
      for (const [x, y] of cells) if (x >= 0 && y >= 0 && x < r.w && y < r.h) ctx.fillRect(r.x + x * cs + 2, r.y + y * cs + 2, cs - 4, cs - 4);
      if (merge) { ctx.fillStyle = INK; ctx.font = '800 12px "M PLUS Rounded 1c"'; ctx.textAlign = 'center'; ctx.fillText('合成！', drag.px, drag.py - 30); }
    }
    ctx.save(); ctx.globalAlpha = 0.9; ctx.translate(drag.px - drag.ox, drag.py - drag.oy); ctx.scale(1.05, 1.05);
    drawItemAt(ctx, drag.it, 0, 0, cs, true); ctx.restore();
  }

  // ---------- ボタン ----------
  const tr = trashRect(), br = buyRect(), st = startRect();
  const overTrash = drag && drag.moved && inR({ x: drag.px, y: drag.py }, tr);
  sketchRect(ctx, tr.x, tr.y, tr.w, tr.h, overTrash ? '#F2B53C' : '#EFE3C8', 3);
  ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.font = '800 12px "M PLUS Rounded 1c"'; ctx.fillText('売る', tr.x + tr.w / 2, tr.y + 22); ctx.font = '800 9px "M PLUS Rounded 1c"'; ctx.fillText('ここへドラッグ', tr.x + tr.w / 2, tr.y + 38);
  sketchRect(ctx, br.x, br.y, br.w, br.h, S.coins >= gachaCost() ? '#FFF4DA' : '#CFC2A8', 3);
  ctx.font = '800 12px "M PLUS Rounded 1c"'; ctx.fillStyle = INK; ctx.fillText('パーツを買う', br.x + br.w / 2, br.y + 22); ctx.font = '800 11px "M PLUS Rounded 1c"'; ctx.fillText(`${gachaCost()} コイン`, br.x + br.w / 2, br.y + 40);
  sketchRect(ctx, st.x, st.y, st.w, st.h, B ? '#B8A888' : '#F2B53C', 3);
  ctx.font = '18px "Dela Gothic One"'; ctx.fillStyle = INK; ctx.fillText(B ? '戦闘中…' : `WAVE ${S.wave} 開始`, st.x + st.w / 2, st.y + 33);

  ctx.restore();
}

// =====================================================================
// ループ・起動
// =====================================================================
let last = performance.now();
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts; T += dt;
  if ($('ov').hidden) updateBattle(dt);
  draw(dt);
  requestAnimationFrame(loop);
}
function title() {
  const saved = load();
  S = saved || newState();
  openCard(`<h1>にゃんガン工房<small>CAT GUNSMITH</small></h1>
    <p>動物たちが 押し寄せてくる！<br>銃を カスタムして 迎え撃て。</p>
    <div class="how">
      <b>ドラッグ</b>：パーツを 銃のグリッドへ<br>
      <b>タップ</b>：パーツを 回転<br>
      <b>同じパーツを 重ねる</b>：合成して レベルアップ<br>
      本体に <b>つながったパーツだけ</b> 効く。<br>
      バレルは<b>前</b>、スコープは<b>上</b>、グリップは<b>下</b>、ストックは<b>うしろ</b>に置くと ×1.5！<br>
      戦闘中も 組み替えOK。
    </div>`, [
    { label: saved ? `つづきから（WAVE ${S.wave}）` : 'はじめる', fn: () => { closeCard(); } },
    ...(saved ? [{ label: 'はじめから', cls: 'white', fn: () => { S = newState(); save(); closeCard(); } }] : []),
  ]);
}
window.addEventListener('pagehide', () => S && save());
title();
requestAnimationFrame(loop);
})();
</script>
