<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#435744"><title>ちいさな魔女と、眠れる森</title><meta name="description" content="ほうきを手に入れたら、あの場所へ。ちいさな魔女の探索アクション。スマホ・PC対応、無料・登録不要。"><meta property="og:title" content="ちいさな魔女と、眠れる森"><meta property="og:description" content="ほうきを手に入れたら、あの場所へ。森をめぐる探索アクション。"><meta property="og:image" content="https://sakamoto241.github.io/game/tabi-simple-og.png"><link rel="stylesheet" href="nemuri.css?v=1"></head><body>
