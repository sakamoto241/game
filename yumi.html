<title>月下の弓</title>
<meta name="description" content="止まると矢を撃つ、和風の妖怪退治ローグライク">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  /* 夜の神社という一つの世界で固定するため、ライト/ダーク共通の配色 */
  :root {
    color-scheme: dark;
    --night: #12142A;
    --ink: #EDE6D6;
    --muted: #A9A6B8;
    --panel: #1D2140;
    --line: #3A3F6B;
    --shu: #D9482B;
    --gold: #E8C170;
    --brush: "Yuji Syuku", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    background-image: radial-gradient(circle at 80% 0%, #2A2E5A 0, transparent 45%);
    color: var(--ink);
    font-family: var(--body);
    padding-inline: 16px;
    padding-block: 16px 24px;
    display: grid;
    justify-items: center;
    align-content: start;
    gap: 10px;
    -webkit-user-select: none; user-select: none;
  }
  .stage {
    position: relative;
    width: min(100%, 420px, calc((100dvh - 90px) * 0.6));
    aspect-ratio: 3 / 5;
    max-width: 100%;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,.5);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hint { color: var(--muted); font-size: 12.5px; text-align: center; margin: 0; }

  .overlay {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 20px;
    background: rgba(10, 11, 26, .78);
    backdrop-filter: blur(2px);
  }
  .card {
    width: 100%; max-width: 330px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 4px solid var(--shu);
    border-radius: 12px;
    padding: 22px 20px;
    display: grid; gap: 14px;
    text-align: center;
  }
  .card h1, .card h2 { margin: 0; font-family: var(--brush); font-weight: 400; line-height: 1.2; text-wrap: balance; }
  .card h1 { font-size: 44px; letter-spacing: .08em; }
  .card h2 { font-size: 28px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .card .how { text-align: left; font-size: 13.5px; color: var(--ink); line-height: 1.8; padding: 10px 12px; background: rgba(255,255,255,.04); border-radius: 8px; }
  .card .how b { color: var(--gold); font-weight: 700; }
  .btn {
    font: inherit; font-weight: 700; font-size: 16px;
    padding: 12px 18px; border-radius: 10px; border: 0;
    background: var(--shu); color: #FFF4EC; cursor: pointer;
    box-shadow: 0 4px 0 #8E2A16;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8E2A16; }
  .btn:focus-visible, .skill:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .best { font-size: 12.5px; color: var(--muted); }

  .skills { display: grid; gap: 10px; }
  .skill {
    font: inherit; color: var(--ink); text-align: left;
    display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center;
    padding: 12px; border-radius: 10px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .skill:hover { border-color: var(--gold); }
  .skill .kanji {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--shu); color: #FFF4EC;
    font-family: var(--brush); font-size: 24px;
  }
  .skill b { font-family: var(--brush); font-weight: 400; font-size: 20px; display: block; }
  .skill small { color: var(--muted); font-size: 13px; line-height: 1.5; display: block; }
  .skill .lv { color: var(--gold); font-size: 12px; }
</style>

<div class="stage" id="stage">
  <canvas id="game" width="360" height="600" aria-label="ゲーム画面"></canvas>

  <div class="overlay" id="start">
    <div class="card">
      <h1>月下の弓</h1>
      <p>妖怪があふれる夜の神社。<br>十の間を抜けて、大天狗を討て。</p>
      <div class="how">
        <b>動く</b>と よける。<b>止まる</b>と 近くの妖怪へ 矢を撃つ。<br>
        スマホ：画面を なぞって移動<br>
        PC：WASD か 矢印キー
      </div>
      <button class="btn" type="button" id="go">はじめる</button>
      <div class="best" id="best"></div>
    </div>
  </div>

  <div class="overlay" id="levelup" hidden>
    <div class="card">
      <h2>技を ひとつ 選べ</h2>
      <div class="skills" id="skills"></div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="card">
      <h2 id="over-title">討ち死に…</h2>
      <p id="over-text"></p>
      <button class="btn" type="button" id="retry">もう一度</button>
    </div>
  </div>
</div>
<p class="hint">止まっている間だけ 矢を撃つ。敵の弾は 動いて よけよう。</p>

<script>
(() => {
  const W = 360, H = 600;
  const L = 18, R = 342, T = 78, B = 584, GX = 180, GATE_HALF = 30;
  const ROOMS = 10;
  const $ = id => document.getElementById(id);
  const cv = $('game'), ctx = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- 技（レベルアップで選ぶ） ----------
  const SKILLS = [
    { id: 'multi',  k: '連', name: '連射の型', desc: '矢を もう1回 つづけて撃つ',            max: 3, apply: s => s.multi++ },
    { id: 'front',  k: '二', name: '二本矢',   desc: '前に撃つ矢が 1本ふえる',               max: 3, apply: s => s.front++ },
    { id: 'diag',   k: '扇', name: '扇撃ち',   desc: 'ななめにも 矢を撃つ',                  max: 2, apply: s => s.diag++ },
    { id: 'bounce', k: '跳', name: '跳ね矢',   desc: '当たった矢が 近くの妖怪へ 跳ねる',     max: 3, apply: s => s.bounce++ },
    { id: 'pierce', k: '貫', name: '貫き矢',   desc: '矢が 妖怪を 貫いて 飛んでいく',        max: 2, apply: s => s.pierce++ },
    { id: 'fire',   k: '火', name: '火矢',     desc: '当たった妖怪を 燃やす',                max: 1, apply: s => s.fire = true },
    { id: 'ofuda',  k: '札', name: '守り札',   desc: 'お札が 身のまわりを 回り、妖怪と弾を 払う', max: 3, apply: s => s.ofuda++ },
    { id: 'dmg',    k: '剛', name: '剛弓',     desc: '矢の 威力 +30%',                       max: 5, apply: s => s.dmg *= 1.3 },
    { id: 'speed',  k: '速', name: '早撃ち',   desc: '矢を撃つ 速さ +25%',                   max: 4, apply: s => s.cd *= 0.8 },
    { id: 'hp',     k: '鍛', name: '鍛錬',     desc: '最大体力 +30、体力も 30 回復',         max: 5, apply: (s, p) => { p.maxHp += 30; p.hp = Math.min(p.maxHp, p.hp + 30); } },
    { id: 'heal',   k: '癒', name: 'おにぎり', desc: '体力を 半分 回復する',                 max: 99, apply: (s, p) => { p.hp = Math.min(p.maxHp, p.hp + p.maxHp / 2); } },
  ];

  // ---------- 妖怪 ----------
  const TYPES = {
    onibi:   { name: '鬼火',     hp: 40,   r: 11, xp: 4,  touch: 12 },
    kasa:    { name: '唐傘',     hp: 60,   r: 13, xp: 5,  touch: 14 },
    kitsune: { name: '狐',       hp: 55,   r: 12, xp: 6,  touch: 10 },
    oni:     { name: '鬼',       hp: 170,  r: 18, xp: 11, touch: 22 },
    tengu:   { name: '大天狗',   hp: 2600, r: 30, xp: 0,  touch: 25 },
  };

  let G = null;
  let state = 'title';      // title | play | levelup | over
  let best = 0;
  try { best = +localStorage.getItem('gekka-best') || 0; } catch (e) {}

  // ---------- 背景（花びら） ----------
  const petals = Array.from({ length: 18 }, () => ({ x: rand(0, W), y: rand(0, H), s: rand(2, 4), v: rand(12, 26), w: rand(0, 6) }));

  function newGame() {
    G = {
      room: 1, level: 1, xp: 0, pendingLv: 0,
      p: { x: GX, y: 530, r: 11, hp: 100, maxHp: 100, inv: 0, cd: 0.4, face: -Math.PI / 2, moving: false },
      s: { dmg: 20, cd: 0.62, multi: 1, front: 1, diag: 0, bounce: 0, pierce: 0, fire: false, ofuda: 0 },
      taken: {},
      arrows: [], enemies: [], bullets: [], orbs: [], fx: [], texts: [], obstacles: [], volley: [],
      cleared: false, shake: 0, ofudaAng: 0, banner: 0, floor: null,
    };
    buildRoom();
  }

  function buildRoom() {
    const g = G;
    g.arrows = []; g.bullets = []; g.orbs = []; g.volley = []; g.enemies = [];
    g.cleared = false;
    g.p.x = GX; g.p.y = 540; g.p.cd = 0.5;
    g.banner = 1.6;

    g.obstacles = [];
    if (g.room > 1 && g.room < ROOMS) {
      const n = Math.floor(rand(1, 4));
      for (let i = 0; i < n; i++) {
        for (let tries = 0; tries < 20; tries++) {
          const o = { x: rand(L + 50, R - 50), y: rand(T + 110, B - 130), r: 15 };
          if (g.obstacles.every(q => dist(q, o) > 90) && Math.abs(o.x - GX) > 24) { g.obstacles.push(o); break; }
        }
      }
    }
    g.floor = makeFloor();

    if (g.room === ROOMS) {
      spawn('tengu', GX, T + 120);
      return;
    }
    const pool = ['onibi'];
    if (g.room >= 2) pool.push('kasa');
    if (g.room >= 3) pool.push('kitsune');
    if (g.room >= 5) pool.push('oni');
    const count = 3 + Math.floor(g.room * 0.8);
    for (let i = 0; i < count; i++) {
      const type = i === 0 && g.room >= 5 ? 'oni' : pick(pool);
      let pos;
      for (let tries = 0; tries < 30; tries++) {
        pos = { x: rand(L + 30, R - 30), y: rand(T + 30, T + 300) };
        if (g.obstacles.every(o => dist(o, pos) > 40)) break;
      }
      spawn(type, pos.x, pos.y);
    }
  }

  function spawn(type, x, y) {
    const t = TYPES[type];
    const scale = type === 'tengu' ? 1 : 1 + 0.16 * (G.room - 1);
    G.enemies.push({
      type, x, y, r: t.r, hp: t.hp * scale, maxHp: t.hp * scale,
      vx: 0, vy: 0, t: rand(0, 2), timer: rand(0.6, 1.6), mode: 'idle',
      spawn: 0.7, flash: 0, burn: 0, burnTick: 0, ofudaCd: 0, hop: 0, phase: 0,
    });
  }

  function makeFloor() {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const f = c.getContext('2d');
    // 石畳
    f.fillStyle = '#1E2240'; f.fillRect(0, 0, W, H);
    const size = 36;
    for (let y = T; y < B; y += size) {
      const off = (Math.floor((y - T) / size) % 2) * size / 2;
      for (let x = L - size; x < R; x += size) {
        const shade = 34 + Math.floor(Math.random() * 8);
        f.fillStyle = `rgb(${shade}, ${shade + 4}, ${shade + 30})`;
        f.fillRect(x + off + 1, y + 1, size - 2, size - 2);
      }
    }
    // 参道の中央
    f.fillStyle = 'rgba(232,193,112,0.05)';
    f.fillRect(GX - 26, T, 52, B - T);
    // 外側（塀）
    f.fillStyle = '#12142A';
    f.fillRect(0, 0, W, T); f.fillRect(0, B, W, H - B); f.fillRect(0, 0, L, H); f.fillRect(R, 0, W - R, H);
    f.strokeStyle = '#4A3226'; f.lineWidth = 6;
    f.strokeRect(L - 3, T - 3, R - L + 6, B - T + 6);
    f.strokeStyle = '#6B4A36'; f.lineWidth = 1.5;
    f.strokeRect(L - 6, T - 6, R - L + 12, B - T + 12);
    // 月
    f.fillStyle = '#F2EDE0';
    f.beginPath(); f.arc(262, 26, 11, 0, Math.PI * 2); f.fill();
    f.fillStyle = '#12142A';
    f.beginPath(); f.arc(258, 23, 10, 0, Math.PI * 2); f.fill();
    return c;
  }

  // ---------- 入力 ----------
  const keys = {};
  const joy = { on: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
  function toLocal(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    const p = toLocal(e);
    Object.assign(joy, { on: true, id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y });
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (!joy.on || e.pointerId !== joy.id) return;
    const p = toLocal(e); joy.x = p.x; joy.y = p.y;
  });
  const endJoy = e => { if (e.pointerId === joy.id) joy.on = false; };
  cv.addEventListener('pointerup', endJoy);
  cv.addEventListener('pointercancel', endJoy);
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase()) && state === 'play') e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; joy.on = false; });

  function inputVec() {
    let x = 0, y = 0;
    if (keys['a'] || keys['arrowleft']) x -= 1;
    if (keys['d'] || keys['arrowright']) x += 1;
    if (keys['w'] || keys['arrowup']) y -= 1;
    if (keys['s'] || keys['arrowdown']) y += 1;
    if (joy.on) {
      const dx = joy.x - joy.ox, dy = joy.y - joy.oy, len = Math.hypot(dx, dy);
      if (len > 6) { const m = Math.min(1, len / 40); x = dx / len * m; y = dy / len * m; }
    }
    const len = Math.hypot(x, y);
    if (len > 1) { x /= len; y /= len; }
    return { x, y };
  }

  // ---------- 更新 ----------
  function pushOut(o) {
    for (const ob of G.obstacles) {
      const d = dist(o, ob), min = o.r + ob.r;
      if (d < min && d > 0) { o.x = ob.x + (o.x - ob.x) / d * min; o.y = ob.y + (o.y - ob.y) / d * min; }
    }
  }
  function inArena(o) {
    o.x = clamp(o.x, L + o.r, R - o.r);
    o.y = clamp(o.y, T + o.r, B - o.r);
  }
  function hitsObstacle(o) { return G.obstacles.some(ob => dist(o, ob) < ob.r + 2); }

  function nearestEnemy(from, exclude) {
    let best = null, bd = Infinity;
    for (const e of G.enemies) {
      if (e.spawn > 0 || (exclude && exclude.has(e))) continue;
      const d = dist(from, e);
      if (d < bd) { bd = d; best = e; }
    }
    return best ? { e: best, d: bd } : null;
  }

  function fireVolley(angle) {
    for (let i = 0; i < G.s.multi; i++) G.volley.push({ t: i * 0.09, angle });
  }
  function shoot(angle) {
    const s = G.s, p = G.p;
    const mk = (a, off) => {
      const nx = -Math.sin(a), ny = Math.cos(a);
      G.arrows.push({
        x: p.x + Math.cos(a) * 12 + nx * off, y: p.y + Math.sin(a) * 12 + ny * off,
        vx: Math.cos(a) * 480, vy: Math.sin(a) * 480, a,
        dmg: s.dmg, pierce: s.pierce, bounce: s.bounce, hit: new Set(), life: 1.4,
      });
    };
    for (let i = 0; i < s.front; i++) mk(angle, (i - (s.front - 1) / 2) * 9);
    for (let k = 1; k <= s.diag; k++) { mk(angle + k * 0.45, 0); mk(angle - k * 0.45, 0); }
  }

  function damageEnemy(e, d, color) {
    e.hp -= d; e.flash = 0.1;
    G.texts.push({ x: e.x + rand(-6, 6), y: e.y - e.r, t: 0.7, text: Math.round(d), color: color || '#FFF4EC' });
    if (e.hp <= 0 && !e.dead) killEnemy(e);
  }
  function killEnemy(e) {
    e.dead = true;
    const t = TYPES[e.type];
    const n = Math.max(1, Math.round(t.xp / 2));
    for (let i = 0; i < n; i++) G.orbs.push({ x: e.x + rand(-8, 8), y: e.y + rand(-8, 8), v: t.xp / n, vx: rand(-60, 60), vy: rand(-60, 60) });
    burst(e.x, e.y, e.type === 'onibi' ? '#8FD0FF' : e.type === 'kasa' ? '#B07AD6' : e.type === 'kitsune' ? '#F2EDE0' : '#E35B3E', e.type === 'tengu' ? 60 : 14);
    if (e.type === 'tengu') { G.shake = 0.8; setTimeout(() => endGame(true), 1400); }
  }
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(40, 180);
      G.fx.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.3, 0.7), max: 0.7, color, size: rand(1.5, 3.5) });
    }
  }
  function hurtPlayer(d) {
    const p = G.p;
    if (p.inv > 0 || state !== 'play') return;
    p.hp -= d; p.inv = 0.8; G.shake = 0.25;
    G.texts.push({ x: p.x, y: p.y - 20, t: 0.8, text: '-' + Math.round(d), color: '#FF7A6B' });
    if (p.hp <= 0) { p.hp = 0; burst(p.x, p.y, '#F2EDE0', 30); endGame(false); }
  }
  function enemyShot(x, y, a, speed, color, r = 5) {
    G.bullets.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r, color, life: 6 });
  }

  function updateEnemy(e, dt) {
    const p = G.p;
    e.t += dt;
    if (e.spawn > 0) { e.spawn -= dt; return; }
    e.flash = Math.max(0, e.flash - dt);
    e.ofudaCd = Math.max(0, e.ofudaCd - dt);
    if (e.burn > 0) {
      e.burn -= dt; e.burnTick -= dt;
      if (e.burnTick <= 0) { e.burnTick = 0.5; damageEnemy(e, G.s.dmg * 0.18, '#FFB25C'); }
    }
    const ang = Math.atan2(p.y - e.y, p.x - e.x);
    const d = dist(e, p);
    const lvl = G.room;

    if (e.type === 'onibi') {
      const sp = 52 + lvl * 3;
      const wob = Math.sin(e.t * 3) * 0.7;
      e.x += Math.cos(ang + wob) * sp * dt; e.y += Math.sin(ang + wob) * sp * dt;
    } else if (e.type === 'kasa') {
      e.timer -= dt;
      if (e.mode === 'idle' && e.timer <= 0) { e.mode = 'hop'; e.timer = 0.4; e.vx = Math.cos(ang) * 190; e.vy = Math.sin(ang) * 190; }
      else if (e.mode === 'hop') {
        e.x += e.vx * dt; e.y += e.vy * dt;
        e.hop = Math.sin((0.4 - e.timer) / 0.4 * Math.PI) * 10;
        if (e.timer <= 0) { e.mode = 'idle'; e.timer = rand(0.7, 1.2); e.hop = 0; }
      }
    } else if (e.type === 'kitsune') {
      const want = 170;
      const dir = d > want + 20 ? 1 : d < want - 20 ? -1 : 0;
      const strafe = Math.sin(e.t * 0.9) > 0 ? 1 : -1;
      e.x += (Math.cos(ang) * dir * 50 + Math.cos(ang + Math.PI / 2) * strafe * 30) * dt;
      e.y += (Math.sin(ang) * dir * 50 + Math.sin(ang + Math.PI / 2) * strafe * 30) * dt;
      e.timer -= dt;
      if (e.timer <= 0) {
        e.timer = rand(1.9, 2.6);
        if (lvl >= 6) for (const k of [-0.25, 0, 0.25]) enemyShot(e.x, e.y, ang + k, 150, '#9EF0C8');
        else enemyShot(e.x, e.y, ang, 150, '#9EF0C8');
      }
    } else if (e.type === 'oni') {
      e.timer -= dt;
      if (e.mode === 'idle') {
        e.x += Math.cos(ang) * 38 * dt; e.y += Math.sin(ang) * 38 * dt;
        if (e.timer <= 0) { e.mode = 'wind'; e.timer = 0.6; e.da = ang; }
      } else if (e.mode === 'wind') {
        if (e.timer <= 0) { e.mode = 'dash'; e.timer = 0.45; }
      } else if (e.mode === 'dash') {
        e.x += Math.cos(e.da) * 330 * dt; e.y += Math.sin(e.da) * 330 * dt;
        if (e.timer <= 0) { e.mode = 'idle'; e.timer = rand(2.2, 3.2); }
      }
    } else if (e.type === 'tengu') {
      const angry = e.hp < e.maxHp / 2;
      if (e.mode !== 'dash' && e.mode !== 'wind') {
        e.x += Math.cos(e.t * 0.7) * 60 * dt;
        e.y += (T + 130 - e.y) * dt;
      }
      e.timer -= dt;
      if (e.timer <= 0) {
        if (e.mode === 'wind') { e.mode = 'dash'; e.timer = 0.55; }
        else if (e.mode === 'dash') { e.mode = 'idle'; e.timer = 1; }
        else {
          const pattern = e.phase % 4; e.phase++;
          if (pattern === 0) {
            const n = angry ? 18 : 14, off = rand(0, 1);
            for (let i = 0; i < n; i++) enemyShot(e.x, e.y, off + i / n * Math.PI * 2, 115, '#E07AFF', 6);
          } else if (pattern === 1) {
            for (let i = -2; i <= 2; i++) enemyShot(e.x, e.y, ang + i * 0.2, 175, '#FF8A5C', 6);
            if (angry) setTimeout(() => { if (!e.dead && state === 'play') for (let i = -2; i <= 2; i++) enemyShot(e.x, e.y, Math.atan2(G.p.y - e.y, G.p.x - e.x) + i * 0.2, 175, '#FF8A5C', 6); }, 350);
          } else if (pattern === 2) {
            spawn('onibi', e.x - 50, e.y + 20); spawn('onibi', e.x + 50, e.y + 20);
            if (angry) spawn('kasa', e.x, e.y + 50);
          } else {
            e.mode = 'wind'; e.timer = 0.7; e.da = ang;
            e.timer2 = 0;
            return;
          }
          e.timer = angry ? 1.5 : 2.2;
        }
      }
      if (e.mode === 'dash') { e.x += Math.cos(e.da) * 300 * dt; e.y += Math.sin(e.da) * 300 * dt; }
    }

    inArena(e); pushOut(e);
    if (dist(e, p) < e.r + p.r - 2) hurtPlayer(TYPES[e.type].touch * (1 + 0.06 * (lvl - 1)));
  }

  function update(dt) {
    const g = G, p = g.p, s = g.s;
    g.banner = Math.max(0, g.banner - dt);
    g.shake = Math.max(0, g.shake - dt);
    p.inv = Math.max(0, p.inv - dt);
    p.cd -= dt;

    // 移動
    const v = inputVec();
    p.moving = Math.hypot(v.x, v.y) > 0.1;
    if (p.moving) {
      p.x += v.x * 150 * dt; p.y += v.y * 150 * dt;
      p.face = Math.atan2(v.y, v.x);
    }
    const atGate = g.cleared && Math.abs(p.x - GX) < GATE_HALF - 4;
    p.x = clamp(p.x, L + p.r, R - p.r);
    p.y = clamp(p.y, atGate ? T - 30 : T + p.r, B - p.r);
    pushOut(p);
    if (g.cleared && p.y < T - 4 && atGate) return nextRoom();

    // 撃つ（止まっているときだけ）
    if (!p.moving && p.cd <= 0) {
      const t = nearestEnemy(p);
      if (t) { p.face = Math.atan2(t.e.y - p.y, t.e.x - p.x); fireVolley(p.face); p.cd = s.cd; }
    }
    for (const v of g.volley) { v.t -= dt; if (v.t <= 0) shoot(v.angle); }
    g.volley = g.volley.filter(v => v.t > 0);

    // 矢
    for (const a of g.arrows) {
      a.x += a.vx * dt; a.y += a.vy * dt; a.life -= dt;
      if (a.x < L || a.x > R || a.y < T || a.y > B || hitsObstacle(a)) { a.dead = true; continue; }
      for (const e of g.enemies) {
        if (e.dead || e.spawn > 0 || a.hit.has(e)) continue;
        if (dist(a, e) < e.r + 3) {
          a.hit.add(e);
          damageEnemy(e, a.dmg);
          if (s.fire) { e.burn = 3; }
          if (a.bounce > 0) {
            a.bounce--;
            const n = nearestEnemy(a, a.hit);
            if (n && n.d < 240) {
              const na = Math.atan2(n.e.y - a.y, n.e.x - a.x);
              a.vx = Math.cos(na) * 480; a.vy = Math.sin(na) * 480; a.a = na; a.life = 1;
            } else if (a.pierce > 0) a.pierce--; else a.dead = true;
          } else if (a.pierce > 0) a.pierce--;
          else a.dead = true;
          break;
        }
      }
      if (a.life <= 0) a.dead = true;
    }
    g.arrows = g.arrows.filter(a => !a.dead);

    // 守り札
    if (s.ofuda > 0) {
      g.ofudaAng += dt * 3.2;
      for (let i = 0; i < s.ofuda; i++) {
        const a = g.ofudaAng + i / s.ofuda * Math.PI * 2;
        const o = { x: p.x + Math.cos(a) * 46, y: p.y + Math.sin(a) * 46 };
        for (const e of g.enemies) {
          if (e.dead || e.spawn > 0 || e.ofudaCd > 0) continue;
          if (dist(o, e) < e.r + 8) { e.ofudaCd = 0.35; damageEnemy(e, 8 + s.dmg * 0.35, '#E8C170'); }
        }
        for (const b of g.bullets) if (dist(o, b) < b.r + 8) b.dead = true;
      }
    }

    // 妖怪
    for (const e of g.enemies) if (!e.dead) updateEnemy(e, dt);
    // 重なりすぎないように
    for (let i = 0; i < g.enemies.length; i++) for (let j = i + 1; j < g.enemies.length; j++) {
      const a = g.enemies[i], b = g.enemies[j];
      const d = dist(a, b), min = a.r + b.r;
      if (d < min && d > 0) {
        const push = (min - d) / 2, nx = (a.x - b.x) / d, ny = (a.y - b.y) / d;
        if (a.type !== 'tengu') { a.x += nx * push; a.y += ny * push; }
        if (b.type !== 'tengu') { b.x -= nx * push; b.y -= ny * push; }
      }
    }
    g.enemies = g.enemies.filter(e => !e.dead);

    // 敵の弾
    for (const b of g.bullets) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.x < L || b.x > R || b.y < T || b.y > B || b.life <= 0 || hitsObstacle(b)) b.dead = true;
      else if (dist(b, p) < b.r + p.r - 3) { b.dead = true; hurtPlayer(10 + G.room); }
    }
    g.bullets = g.bullets.filter(b => !b.dead);

    // 魂（経験値）
    for (const o of g.orbs) {
      if (g.cleared || dist(o, p) < 60) {
        const a = Math.atan2(p.y - o.y, p.x - o.x);
        o.vx += Math.cos(a) * 1400 * dt; o.vy += Math.sin(a) * 1400 * dt;
        o.vx *= 0.9; o.vy *= 0.9;
      } else { o.vx *= 0.92; o.vy *= 0.92; }
      o.x += o.vx * dt; o.y += o.vy * dt;
      if (dist(o, p) < p.r + 4) { o.dead = true; gainXp(o.v); }
    }
    g.orbs = g.orbs.filter(o => !o.dead);

    // 部屋クリア
    if (!g.cleared && g.enemies.length === 0 && g.room < ROOMS) {
      g.cleared = true;
      g.bullets = [];
      p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.05);
    }

    // 演出
    for (const f of g.fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.92; f.vy *= 0.92; f.life -= dt; }
    g.fx = g.fx.filter(f => f.life > 0);
    for (const t of g.texts) { t.y -= 30 * dt; t.t -= dt; }
    g.texts = g.texts.filter(t => t.t > 0);

    if (g.pendingLv > 0 && state === 'play') showLevelUp();
  }

  function need(lv) { return 4 + lv * 8; }
  function gainXp(v) {
    G.xp += v;
    while (G.xp >= need(G.level)) { G.xp -= need(G.level); G.level++; G.pendingLv++; }
  }

  function nextRoom() {
    G.room++;
    best = Math.max(best, G.room);
    try { localStorage.setItem('gekka-best', best); } catch (e) {}
    buildRoom();
  }

  // ---------- 描画 ----------
  function drawPlayer(p) {
    if (p.inv > 0 && Math.floor(p.inv * 20) % 2 === 0) return;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(0, 9, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
    // 袴（赤）と 白い着物、黒髪
    ctx.fillStyle = '#C8372D';
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#F2EDE0';
    ctx.beginPath(); ctx.arc(0, -1, p.r - 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1A1A22';
    ctx.beginPath(); ctx.arc(0, -2, 5, 0, Math.PI * 2); ctx.fill();
    // 弓
    ctx.rotate(p.face);
    ctx.strokeStyle = '#9A6A3A'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(2, 0, 16, -1.0, 1.0); ctx.stroke();
    ctx.strokeStyle = 'rgba(242,237,224,.7)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(2 + Math.cos(-1) * 16, Math.sin(-1) * 16);
    ctx.lineTo(p.moving ? 2 + Math.cos(1) * 16 * 0.9 : 4, 0);
    ctx.lineTo(2 + Math.cos(1) * 16, Math.sin(1) * 16);
    ctx.stroke();
    ctx.restore();

    // 頭の上の体力
    const w = 30;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(p.x - w / 2, p.y - 25, w, 4);
    ctx.fillStyle = p.hp / p.maxHp < 0.3 ? '#FF6B5B' : '#7FE08A';
    ctx.fillRect(p.x - w / 2, p.y - 25, w * p.hp / p.maxHp, 4);
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.spawn > 0) {
      // 出現の魔法陣
      const k = 1 - e.spawn / 0.7;
      ctx.strokeStyle = `rgba(217,72,43,${0.3 + k * 0.6})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, e.r * (0.6 + k), 0, Math.PI * 2); ctx.stroke();
      ctx.restore(); return;
    }
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(0, e.r * 0.8, e.r, e.r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    const ang = Math.atan2(G.p.y - e.y, G.p.x - e.x);

    if (e.type === 'onibi') {
      ctx.shadowColor = '#6FB7FF'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#7CC4FF';
      ctx.beginPath();
      ctx.moveTo(0, -e.r * 2 - Math.sin(e.t * 8) * 3);
      ctx.quadraticCurveTo(e.r * 1.2, -e.r * 0.4, 0, e.r);
      ctx.quadraticCurveTo(-e.r * 1.2, -e.r * 0.4, 0, -e.r * 2 - Math.sin(e.t * 8) * 3);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#E8F6FF';
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1B2A55';
      ctx.fillRect(-4, -2, 2.5, 3); ctx.fillRect(1.5, -2, 2.5, 3);
    } else if (e.type === 'kasa') {
      ctx.translate(0, -e.hop);
      ctx.fillStyle = '#8A55B5';
      ctx.beginPath(); ctx.moveTo(0, -e.r - 8); ctx.lineTo(e.r + 3, e.r * 0.5); ctx.lineTo(-e.r - 3, e.r * 0.5); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#5E3585'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, -e.r - 8); ctx.lineTo(-5, e.r * 0.5); ctx.moveTo(0, -e.r - 8); ctx.lineTo(5, e.r * 0.5); ctx.stroke();
      ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(0, -2, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(Math.cos(ang) * 2, -2 + Math.sin(ang) * 2, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#E0394F'; ctx.fillRect(-2, e.r * 0.5 - 1, 4, 6);
      ctx.strokeStyle = '#6B4A36'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(0, e.r * 0.5); ctx.lineTo(0, e.r + 4); ctx.stroke();
    } else if (e.type === 'kitsune') {
      ctx.fillStyle = '#F2EDE0';
      ctx.beginPath();
      ctx.moveTo(-e.r, -e.r * 0.2); ctx.lineTo(-e.r * 0.8, -e.r * 1.4); ctx.lineTo(-e.r * 0.2, -e.r * 0.7);
      ctx.lineTo(e.r * 0.2, -e.r * 0.7); ctx.lineTo(e.r * 0.8, -e.r * 1.4); ctx.lineTo(e.r, -e.r * 0.2);
      ctx.lineTo(0, e.r * 1.1); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#D9482B'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-6, -1); ctx.lineTo(-2, 1); ctx.moveTo(6, -1); ctx.lineTo(2, 1); ctx.stroke();
      ctx.fillStyle = '#D9482B'; ctx.beginPath(); ctx.arc(0, -6, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(0, e.r * 0.85, 1.8, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'oni') {
      const warn = e.mode === 'wind';
      if (warn) { ctx.strokeStyle = 'rgba(255,90,70,.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(e.da) * 120, Math.sin(e.da) * 120); ctx.stroke(); }
      ctx.fillStyle = '#F2E2C4';
      ctx.beginPath(); ctx.moveTo(-10, -12); ctx.lineTo(-14, -26); ctx.lineTo(-4, -15); ctx.fill();
      ctx.beginPath(); ctx.moveTo(10, -12); ctx.lineTo(14, -26); ctx.lineTo(4, -15); ctx.fill();
      ctx.fillStyle = warn && Math.floor(e.t * 16) % 2 ? '#FF8A70' : '#C8372D';
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#F7D34A';
      ctx.beginPath(); ctx.arc(-6, -3, 3, 0, Math.PI * 2); ctx.arc(6, -3, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#F2EDE0';
      ctx.fillRect(-7, 6, 3, 4); ctx.fillRect(4, 6, 3, 4);
    } else if (e.type === 'tengu') {
      const warn = e.mode === 'wind';
      if (warn) { ctx.strokeStyle = 'rgba(255,90,70,.55)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(e.da) * 200, Math.sin(e.da) * 200); ctx.stroke(); }
      // 翼
      ctx.fillStyle = '#1A1A2A';
      const flap = Math.sin(e.t * 6) * 6;
      ctx.beginPath(); ctx.moveTo(-20, -6); ctx.quadraticCurveTo(-60, -30 - flap, -58, 10); ctx.quadraticCurveTo(-40, 0, -20, 12); ctx.fill();
      ctx.beginPath(); ctx.moveTo(20, -6); ctx.quadraticCurveTo(60, -30 - flap, 58, 10); ctx.quadraticCurveTo(40, 0, 20, 12); ctx.fill();
      ctx.fillStyle = warn && Math.floor(e.t * 16) % 2 ? '#FF7A5C' : '#B83227';
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();
      // 頭襟
      ctx.fillStyle = '#1A1A2A'; ctx.fillRect(-7, -e.r - 4, 14, 10);
      // 眉と目
      ctx.strokeStyle = '#F2EDE0'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-16, -12); ctx.lineTo(-5, -8); ctx.moveTo(16, -12); ctx.lineTo(5, -8); ctx.stroke();
      ctx.fillStyle = '#F7D34A';
      ctx.beginPath(); ctx.arc(-9, -3, 3, 0, Math.PI * 2); ctx.arc(9, -3, 3, 0, Math.PI * 2); ctx.fill();
      // 鼻
      ctx.fillStyle = '#D94A3A';
      ctx.beginPath(); ctx.ellipse(0, 10, 5, 13, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (e.flash > 0) {
      ctx.globalAlpha = 0.6; ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (e.burn > 0) {
      ctx.fillStyle = `rgba(255,150,60,${0.5 + Math.sin(e.t * 20) * 0.3})`;
      ctx.beginPath(); ctx.arc(rand(-e.r, e.r) * 0.6, -e.r * 0.8, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    if (e.type !== 'tengu' && e.hp < e.maxHp) {
      const w = e.r * 2;
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(e.x - w / 2, e.y - e.r - 12, w, 3);
      ctx.fillStyle = '#FF6B5B'; ctx.fillRect(e.x - w / 2, e.y - e.r - 12, w * Math.max(0, e.hp / e.maxHp), 3);
    }
  }

  function drawTorii() {
    const open = G.cleared;
    const c = '#D9482B';
    ctx.fillStyle = c;
    ctx.fillRect(GX - GATE_HALF - 6, T - 44, 8, 46);
    ctx.fillRect(GX + GATE_HALF - 2, T - 44, 8, 46);
    ctx.fillStyle = '#1A1A22';
    ctx.fillRect(GX - GATE_HALF - 18, T - 52, (GATE_HALF + 18) * 2, 6);
    ctx.fillStyle = c;
    ctx.fillRect(GX - GATE_HALF - 14, T - 46, (GATE_HALF + 14) * 2, 5);
    ctx.fillRect(GX - GATE_HALF - 4, T - 34, (GATE_HALF + 4) * 2, 4);
    if (open) {
      const pulse = 0.35 + Math.sin(performance.now() / 300) * 0.15;
      const grad = ctx.createLinearGradient(0, T - 30, 0, T + 40);
      grad.addColorStop(0, `rgba(232,193,112,${pulse + 0.2})`);
      grad.addColorStop(1, 'rgba(232,193,112,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(GX - GATE_HALF + 2, T - 30, GATE_HALF * 2 - 4, 70);
    } else {
      // しめ縄の結界
      ctx.strokeStyle = '#E8DCC0'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(GX - GATE_HALF + 2, T - 8); ctx.quadraticCurveTo(GX, T + 2, GX + GATE_HALF - 2, T - 8); ctx.stroke();
      ctx.fillStyle = '#F2EDE0';
      for (const dx of [-14, 0, 14]) { ctx.fillRect(GX + dx - 2, T - 4 + (dx === 0 ? 2 : 0), 4, 9); }
    }
  }

  function drawObstacle(o) {
    // 石灯籠
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(o.x, o.y + 10, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6E7390'; ctx.fillRect(o.x - 13, o.y - 3, 26, 12);
    ctx.fillStyle = '#8A8FAE'; ctx.fillRect(o.x - 9, o.y - 13, 18, 11);
    ctx.fillStyle = '#FFD27A'; ctx.fillRect(o.x - 4, o.y - 10, 8, 6);
    ctx.fillStyle = '#5B6080';
    ctx.beginPath(); ctx.moveTo(o.x - 16, o.y - 13); ctx.lineTo(o.x, o.y - 24); ctx.lineTo(o.x + 16, o.y - 13); ctx.fill();
  }

  function draw() {
    ctx.save();
    if (G && G.shake > 0) ctx.translate(rand(-3, 3) * G.shake * 4, rand(-3, 3) * G.shake * 4);
    if (G) ctx.drawImage(G.floor, 0, 0, W, H);
    else { ctx.fillStyle = '#12142A'; ctx.fillRect(0, 0, W, H); }

    // 花びら
    ctx.fillStyle = 'rgba(244,182,194,.75)';
    for (const pt of petals) {
      ctx.beginPath(); ctx.ellipse(pt.x, pt.y, pt.s, pt.s * 0.6, pt.w, 0, Math.PI * 2); ctx.fill();
    }
    if (!G) { ctx.restore(); return; }

    drawTorii();
    for (const o of G.obstacles) drawObstacle(o);

    // 魂
    ctx.fillStyle = '#BFF6FF';
    ctx.shadowColor = '#7FE9FF'; ctx.shadowBlur = 8;
    for (const o of G.orbs) { ctx.beginPath(); ctx.arc(o.x, o.y, 3, 0, Math.PI * 2); ctx.fill(); }
    ctx.shadowBlur = 0;

    for (const e of G.enemies) drawEnemy(e);
    if (state !== 'over' || G.p.hp > 0) drawPlayer(G.p);

    // 守り札
    if (G.s.ofuda > 0) {
      for (let i = 0; i < G.s.ofuda; i++) {
        const a = G.ofudaAng + i / G.s.ofuda * Math.PI * 2;
        const x = G.p.x + Math.cos(a) * 46, y = G.p.y + Math.sin(a) * 46;
        ctx.save(); ctx.translate(x, y); ctx.rotate(a + Math.PI / 2);
        ctx.fillStyle = '#F2E6C8'; ctx.fillRect(-4, -8, 8, 16);
        ctx.fillStyle = '#D9482B'; ctx.fillRect(-1.5, -5, 3, 10);
        ctx.restore();
      }
    }

    // 矢
    ctx.lineCap = 'round';
    for (const a of G.arrows) {
      ctx.strokeStyle = G.s.fire ? '#FFB25C' : '#E8C170'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(a.x - Math.cos(a.a) * 14, a.y - Math.sin(a.a) * 14); ctx.lineTo(a.x, a.y); ctx.stroke();
      ctx.fillStyle = '#F2EDE0';
      ctx.beginPath(); ctx.arc(a.x, a.y, 2, 0, Math.PI * 2); ctx.fill();
    }

    // 敵の弾
    for (const b of G.bullets) {
      ctx.shadowColor = b.color; ctx.shadowBlur = 10;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2); ctx.fill();
    }

    for (const f of G.fx) {
      ctx.globalAlpha = Math.max(0, f.life / f.max);
      ctx.fillStyle = f.color; ctx.fillRect(f.x - f.size / 2, f.y - f.size / 2, f.size, f.size);
    }
    ctx.globalAlpha = 1;

    ctx.font = '700 13px "Zen Kaku Gothic New", sans-serif';
    ctx.textAlign = 'center';
    for (const t of G.texts) {
      ctx.globalAlpha = Math.min(1, t.t * 2);
      ctx.fillStyle = '#000'; ctx.fillText(t.text, t.x + 1, t.y + 1);
      ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    drawHud();

    // 操作スティック
    if (joy.on && state === 'play') {
      ctx.strokeStyle = 'rgba(242,237,224,.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 40, 0, Math.PI * 2); ctx.stroke();
      const dx = joy.x - joy.ox, dy = joy.y - joy.oy, len = Math.hypot(dx, dy), m = Math.min(len, 40);
      ctx.fillStyle = 'rgba(242,237,224,.45)';
      ctx.beginPath(); ctx.arc(joy.ox + (len ? dx / len * m : 0), joy.oy + (len ? dy / len * m : 0), 16, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawHud() {
    const g = G;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#EDE6D6';
    ctx.font = '22px "Yuji Syuku", serif';
    ctx.fillText(g.room === ROOMS ? '最後の間' : `第${g.room}の間`, 16, 30);
    ctx.font = '700 12px "Zen Kaku Gothic New", sans-serif';
    ctx.fillStyle = '#A9A6B8';
    ctx.fillText(`${g.room} / ${ROOMS}`, 16, 48);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#E8C170';
    ctx.font = '700 14px "Zen Kaku Gothic New", sans-serif';
    ctx.fillText(`Lv ${g.level}`, R, 30);
    // 経験値
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(R - 72, 40, 72, 4);
    ctx.fillStyle = '#7FE9FF'; ctx.fillRect(R - 72, 40, 72 * Math.min(1, g.xp / need(g.level)), 4);

    // 大天狗の体力
    const boss = g.enemies.find(e => e.type === 'tengu');
    if (boss && boss.spawn <= 0) {
      const bx = L + 62, bw = R - L - 72;
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(bx, T + 12, bw, 7);
      ctx.fillStyle = '#D9482B'; ctx.fillRect(bx, T + 12, bw * Math.max(0, boss.hp / boss.maxHp), 7);
      ctx.textAlign = 'left'; ctx.fillStyle = '#EDE6D6'; ctx.font = '16px "Yuji Syuku", serif';
      ctx.fillText('大天狗', L + 8, T + 21);
    }

    // 部屋の名前
    if (g.banner > 0) {
      ctx.globalAlpha = Math.min(1, g.banner);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#EDE6D6';
      ctx.font = '40px "Yuji Syuku", serif';
      ctx.fillText(g.room === ROOMS ? '大天狗 見参' : `第${g.room}の間`, GX, 300);
      ctx.globalAlpha = 1;
    }
    if (g.cleared) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#E8C170';
      ctx.font = '700 13px "Zen Kaku Gothic New", sans-serif';
      ctx.fillText('鳥居へ すすめ', GX, T + 58);
    }
  }

  // ---------- 画面の切りかえ ----------
  function showLevelUp() {
    state = 'levelup';
    joy.on = false;
    const s = G.s, p = G.p;
    let pool = SKILLS.filter(k => (G.taken[k.id] || 0) < k.max && !(k.id === 'heal' && p.hp > p.maxHp * 0.8));
    const choices = [];
    while (choices.length < 3 && pool.length) {
      const k = pick(pool); choices.push(k); pool = pool.filter(x => x !== k);
    }
    const box = $('skills');
    box.innerHTML = '';
    for (const k of choices) {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'skill';
      const lv = G.taken[k.id] || 0;
      btn.innerHTML = `<span class="kanji">${k.k}</span><span><b>${k.name}</b><small>${k.desc}</small>${k.max > 1 && k.max < 99 ? `<span class="lv">${'●'.repeat(lv + 1)}${'○'.repeat(k.max - lv - 1)}</span>` : ''}</span>`;
      btn.addEventListener('click', () => {
        k.apply(s, p);
        G.taken[k.id] = lv + 1;
        G.pendingLv--;
        $('levelup').hidden = true;
        state = 'play';
        last = performance.now();
      });
      box.appendChild(btn);
    }
    $('levelup').hidden = false;
    box.querySelector('button')?.focus();
  }

  function endGame(win) {
    if (state === 'over') return;
    state = 'over';
    joy.on = false;
    best = Math.max(best, G.room);
    try { localStorage.setItem('gekka-best', best); } catch (e) {}
    setTimeout(() => {
      $('over-title').textContent = win ? '大天狗を 討ち取った！' : '討ち死に…';
      $('over-text').textContent = win
        ? `十の間を 踏破。Lv ${G.level} で 夜明けを 迎えた。`
        : `第${G.room}の間で 力つきた（Lv ${G.level}）。技の組み合わせを 変えて もう一度。`;
      $('over').hidden = false;
      $('retry').focus();
    }, win ? 0 : 700);
  }

  function startGame() {
    newGame();
    $('start').hidden = true; $('over').hidden = true; $('levelup').hidden = true;
    state = 'play';
    last = performance.now();
  }
  $('go').addEventListener('click', startGame);
  $('retry').addEventListener('click', startGame);
  $('best').textContent = best ? `これまでの 最高到達：${best >= ROOMS ? '最後の間' : `第${best}の間`}` : '';

  // ---------- ループ ----------
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    for (const pt of petals) {
      pt.y += pt.v * dt; pt.x += Math.sin(now / 1000 + pt.w) * 10 * dt; pt.w += dt;
      if (pt.y > H + 5) { pt.y = -5; pt.x = rand(0, W); }
    }
    if (state === 'play') update(dt);
    else if (state === 'over' && G) {
      for (const f of G.fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt; }
      G.fx = G.fx.filter(f => f.life > 0);
    }
    draw();
    requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); });

  // タイトル画面の背景用に 最初の間を 用意しておく
  newGame();
  requestAnimationFrame(loop);
})();
</script>
