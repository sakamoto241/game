<style>
  /* Layout: 新聞紙を敷いた床の上。上に記録と丸まった爪、下に巨大な指先と爪切り */
  :root {
    --paper: #ecebe4;
    --rule: #dcdad0;
    --ink: #23221f;
    --muted: #6d6a62;
    --panel: #fbfaf6;
    --line: #c9c6bb;
    --accent: #d8406a;
    --good: #2f8a5b;
    --display: "Reggae One", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    --body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1c1b19; --rule: #252421; --ink: #ece8df; --muted: #9c978c;
      --panel: #282623; --line: #3d3a35; --accent: #ff7a9b; --good: #5fcf92;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1c1b19; --rule: #252421; --ink: #ece8df; --muted: #9c978c;
    --panel: #282623; --line: #3d3a35; --accent: #ff7a9b; --good: #5fcf92;
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(90deg, transparent 0 calc(20% - 12px), var(--paper) calc(20% - 12px) 20%),
      repeating-linear-gradient(0deg, var(--rule) 0 3px, transparent 3px 11px);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #app {
    position: relative;
    height: 100%;
    display: flex; flex-direction: column;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 10px 8px;
    box-sizing: border-box;
  }
  .headline {
    position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 70px;
    writing-mode: vertical-rl;
    font-family: var(--display); font-size: clamp(40px, 11vw, 76px);
    color: var(--rule); line-height: 1; pointer-events: none;
  }

  header {
    position: relative; z-index: 2;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  .label { font-size: 11px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
  #len {
    font-family: var(--display); font-size: clamp(40px, 12vw, 64px); line-height: 1;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .side { text-align: right; display: grid; gap: 4px; justify-items: end; }
  .side b { font-size: 18px; font-variant-numeric: tabular-nums; }
  #mult { font-weight: 900; color: var(--accent); font-size: 15px; }
  #mute {
    font: 700 11px var(--body); color: var(--muted);
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 6px; padding: 3px 8px;
  }

  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #judge {
    position: absolute; left: 0; right: 0; top: 30%;
    text-align: center; pointer-events: none;
    font-family: var(--display); font-size: clamp(34px, 10vw, 56px);
    color: var(--ink);
    text-shadow: 3px 3px 0 var(--paper), -3px -3px 0 var(--paper), 3px -3px 0 var(--paper), -3px 3px 0 var(--paper);
    opacity: 0;
  }
  #judge.show { animation: pop .55s ease-out; }
  #judge.perfect { color: var(--accent); }
  @keyframes pop {
    0% { opacity: 0; transform: scale(1.6) rotate(-6deg); }
    15% { opacity: 1; transform: scale(1) rotate(-3deg); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-24px) rotate(-3deg); }
  }

  footer { text-align: center; font-size: 12px; color: var(--muted); min-height: 18px; }

  .overlay {
    position: absolute; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #title { flex-direction: column; text-align: center; gap: 14px; background: color-mix(in srgb, var(--paper) 88%, transparent); }
  #title h1 {
    font-family: var(--display); font-weight: 400; margin: 0;
    font-size: clamp(48px, 16vw, 96px); line-height: 1.05; text-wrap: balance;
    color: var(--ink); text-shadow: 4px 4px 0 var(--accent);
  }
  #title p { margin: 0; line-height: 1.8; font-size: 15px; max-width: 26em; }
  .tap { font-weight: 900; color: var(--accent); animation: blink 1.1s steps(1) infinite; font-size: 17px; }
  @keyframes blink { 50% { opacity: .2; } }
  .legend { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--sw); border: 1px solid var(--line); }

  #result { background: color-mix(in srgb, var(--paper) 70%, transparent); }
  .card {
    width: 100%; max-width: 360px; box-sizing: border-box;
    background: var(--panel); border: 2.5px solid var(--ink); border-radius: 4px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 20px; text-align: center; display: grid; gap: 8px;
  }
  #r-cause { font-weight: 900; color: var(--accent); font-size: 15px; }
  #r-len { font-family: var(--display); font-size: clamp(40px, 13vw, 58px); line-height: 1.05; word-break: break-all; }
  #r-tier { display: inline-block; justify-self: center; font-size: 12px; font-weight: 900; padding: 2px 10px; border: 1.5px solid var(--ink); border-radius: 999px; }
  #r-comment { font-size: 15px; line-height: 1.6; font-weight: 700; }
  #r-best { font-size: 12px; color: var(--muted); }
  #r-new { color: var(--good); font-weight: 900; font-size: 13px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font: 900 16px var(--body); text-decoration: none;
    border: 2.5px solid var(--ink); border-radius: 4px; padding: 12px;
    box-shadow: 3px 3px 0 var(--ink); cursor: pointer;
  }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn:focus-visible, #mute:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #share { background: var(--ink); color: var(--paper); margin-top: 6px; }
  #retry { background: var(--panel); color: var(--ink); }

  .shake { animation: shake .35s; }
  @keyframes shake { 20% { transform: translate(-8px, 3px); } 40% { transform: translate(7px, -4px); } 60% { transform: translate(-5px, 2px); } 80% { transform: translate(3px, -1px); } }
  @media (prefers-reduced-motion: reduce) {
    .shake, #judge.show, .tap { animation: none; }
    #judge.show { opacity: 1; }
  }
</style>

<div id="app">
  <div class="headline" aria-hidden="true">爪切り選手権</div>

  <header>
    <div>
      <div class="label">一筆書きの長さ</div>
      <div id="len">0.0cm</div>
    </div>
    <div class="side">
      <div class="label">自己ベスト</div>
      <b id="best">0.0cm</b>
      <div id="mult">倍率 ×1.0</div>
      <button id="mute" type="button">音 ON</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="judge"></div>
  </div>
  <footer id="hint">白いところでパチン。真ん中ほど倍率アップ</footer>

  <div id="title" class="overlay">
    <h1>爪切り<br>パチン</h1>
    <p>ゆれる爪切りを、爪の<b>白いところ</b>で止めろ。<br>深すぎると「イテッ」、浅すぎると爪がちぎれる。<br>どこまで一筆書きで伸ばせるか。</p>
    <div class="legend">
      <span style="--sw:#f4ecdc">白い部分＝セーフ</span>
      <span style="--sw:#f0aeb0">ピンク＝深爪</span>
      <span style="--sw:transparent">外側＝ちぎれる</span>
    </div>
    <div class="tap">タップ / SPACE でスタート</div>
  </div>

  <div id="result" class="overlay" hidden>
    <div class="card">
      <div id="r-cause">イテッ！！深爪した</div>
      <div class="label">爪を一筆書きで</div>
      <div id="r-len">0.0cm</div>
      <div id="r-tier">ふつう</div>
      <div id="r-comment"></div>
      <div id="r-new" hidden>自己ベスト更新！</div>
      <div id="r-best"></div>
      <a id="share" class="btn" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        Xでシェア
      </a>
      <button id="retry" class="btn" type="button">もう一本切る</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
  const elLen = $('len'), elBest = $('best'), elMult = $('mult'), elJudge = $('judge'), elHint = $('hint');

  // ---------- 長さの表示とコメント ----------
  function fmt(cm) {
    if (cm < 100) return cm.toFixed(1) + 'cm';
    const m = cm / 100;
    if (m < 10) return m.toFixed(1) + 'm';
    if (m < 1000) return Math.floor(m) + 'm';
    const km = m / 1000;
    if (km < 10) return km.toFixed(3) + 'km';
    if (km < 1000) return km.toFixed(1) + 'km';
    return Math.floor(km).toLocaleString('ja-JP') + 'km';
  }
  // 下限(cm), 称号, コメント
  const TIERS = [
    [0, '深爪級', ['深爪の予感しかしない', 'これはもう「切った」じゃなくて「削った」']],
    [1, 'ふつう', ['ゴミ箱に入れる前に一回だけ眺めた', '家族に見せたら無視された', '三日月って呼んでいいですか']],
    [5, 'ちょっと自慢', ['新聞紙の上で静かにガッツポーズ', 'これでうどん食べられそう']],
    [10, '職人', ['爪切り歴20年の本気を見よ', '定規が足りなくなった']],
    [30, '人間やめかけ', ['爪というよりもはやベルト', '縁起がいいので神棚に飾ります']],
    [90, '人間やめかけ', ['あと少しで人類初のメートル爪だった']],
    [100, '伝説', ['なわとびできる', '近所の子どもに「爪の人」と呼ばれ始めた', '爪で家の間取りを測った', '鯉のぼりの横に爪を揚げた']],
    [1000, '災害級', ['電柱に巻きついて回収できない', '爪で洗濯物を干した']],
    [2500, '災害級', ['学校のプールの端から端まで届いた']],
    [5000, '災害級', ['爪で50m走ができる']],
    [10000, '災害級', ['ウサイン・ボルトの隣に並べたい', '爪が100m走のコースになった']],
    [33300, '観光名所', ['東京タワー超え。ライトアップ希望']],
    [63400, '観光名所', ['スカイツリー超え。爪が見える丘ができた']],
    [100000, '神話', ['キロ爪達成。指がもう限界', '爪で町内一周した']],
    [377600, '神話', ['富士山超え。爪の上で初日の出を見た']],
    [4219500, '神話', ['爪がフルマラソンを完走した']],
    [3.844e10, '宇宙', ['爪が月に届いた。人類にとっては大きな一切り']],
  ];
  function tierOf(cm) {
    let t = TIERS[0];
    for (const row of TIERS) if (cm >= row[0]) t = row;
    return t;
  }

  // ---------- 保存 ----------
  const BEST_KEY = 'tsumepachin_best', MUTE_KEY = 'tsumepachin_mute';
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  let best = parseFloat(load(BEST_KEY, '0')) || 0;
  let muted = load(MUTE_KEY, '0') === '1';
  elBest.textContent = fmt(best);

  // ---------- 音 ----------
  let ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function noise(dur, type, freq, vol) {
    const a = audio(); if (!a || muted) return;
    const t = a.currentTime;
    const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f).connect(g).connect(a.destination); s.start(t);
  }
  function tone(type, f0, f1, dur, vol) {
    const a = audio(); if (!a || muted) return;
    const t = a.currentTime;
    const o = a.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
  }
  const sfx = {
    snip: (lv, perfect) => {
      noise(.05, 'highpass', 3500, .5);
      tone('square', 1500 + Math.min(lv, 30) * 40, 700, .04, perfect ? .18 : .1);
    },
    ouch: () => { noise(.12, 'highpass', 2500, .4); tone('sawtooth', 320, 70, .45, .3); },
    miss: () => { noise(.35, 'bandpass', 900, .35); tone('sine', 600, 150, .35, .08); },
  };
  const muteBtn = $('mute');
  const syncMute = () => { muteBtn.textContent = muted ? '音 OFF' : '音 ON'; };
  syncMute();
  muteBtn.addEventListener('click', (e) => { e.stopPropagation(); muted = !muted; save(MUTE_KEY, muted ? '1' : '0'); syncMute(); });

  // ---------- キャンバス ----------
  let W = 0, H = 0, dpr = 1;
  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  // 正規化座標 n(0〜1) → 画面のy。0が爪の外側、1が指の奥
  const zone = () => {
    const top = H * 0.34, h = Math.min(H * 0.42, 320);
    return { top, h, y: (n) => top + n * h };
  };

  // ---------- ゲーム状態 ----------
  // state: 'title' | 'play' | 'over'
  let state = 'title';
  let lengthCm = 0, shown = 0;
  let level = 0;        // パーフェクトで上がる倍率レベル
  let cuts = 0;
  let cursor = 0.05, dir = 1;
  let freeze = 0;
  const band = { b0: 0.3, b1: 0.54, t0: 0.3, t1: 0.54 };
  const pieces = [];
  let spin = 0;
  let deathFx = null;

  const mult = () => Math.pow(1.2, level);
  const bandWidth = () => Math.max(0.06, 0.24 * Math.pow(0.97, cuts));
  const period = () => Math.max(0.5, 1.45 * Math.pow(0.975, cuts)); // 端から端まで(秒)

  function newBand() {
    const w = bandWidth();
    const c = 0.3 + Math.random() * 0.25;
    band.t0 = c - w / 2; band.t1 = c + w / 2;
  }

  function start() {
    state = 'play';
    lengthCm = 0; shown = 0; level = 0; cuts = 0;
    cursor = 0.05; dir = 1; freeze = 0; deathFx = null;
    pieces.length = 0;
    band.b0 = band.t0 = 0.3; band.b1 = band.t1 = 0.54;
    $('title').hidden = true;
    $('result').hidden = true;
    elHint.textContent = '白いところでパチン。真ん中ほど倍率アップ';
    updateHud();
  }

  function updateHud() {
    elMult.textContent = '倍率 ×' + (mult() < 100 ? mult().toFixed(1) : Math.round(mult()).toLocaleString('ja-JP'));
  }

  function judge(text, perfect) {
    elJudge.textContent = text;
    elJudge.className = perfect ? 'perfect' : '';
    void elJudge.offsetWidth;
    elJudge.classList.add('show');
  }

  function snip() {
    if (state !== 'play' || freeze > 0) return;
    const n = cursor;
    if (n > band.b1) return die('ouch');
    if (n < band.b0) return die('miss');
    const rel = (n - band.b0) / (band.b1 - band.b0);
    const perfect = Math.abs(rel - 0.5) < 0.18;
    if (perfect) level++;
    const gain = 0.35 * mult() * (perfect ? 1.3 : 0.7);
    lengthCm += gain;
    cuts++;
    sfx.snip(level, perfect);
    judge(perfect ? 'パチン！！' : 'パチ', perfect);
    const z = zone();
    pieces.push({ y0: z.y(band.b0), y1: z.y(n), t: 0 });
    freeze = 0.12;
    newBand();
    updateHud();
  }

  function die(cause) {
    state = 'over';
    const isNew = lengthCm > best;
    if (isNew) { best = lengthCm; save(BEST_KEY, String(best)); elBest.textContent = fmt(best); }
    if (cause === 'ouch') {
      sfx.ouch(); judge('イテッ！！', true);
      try { navigator.vibrate && navigator.vibrate(120); } catch {}
    } else {
      sfx.miss(); judge('スカッ…', false);
    }
    deathFx = { cause, t: 0 };
    stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');

    const [, tierName, lines] = tierOf(lengthCm);
    const comment = lines[Math.floor(Math.random() * lines.length)];
    const lenText = fmt(lengthCm);
    $('r-cause').textContent = cause === 'ouch' ? 'イテッ！！ 深爪した' : 'スカッ… 爪がちぎれて飛んでいった';
    $('r-len').textContent = lenText;
    $('r-tier').textContent = tierName;
    $('r-comment').textContent = '「' + comment + '」';
    $('r-new').hidden = !isNew;
    $('r-best').textContent = '自己ベスト ' + fmt(best);
    const text = `爪を一筆書きで${lenText}切った✂️ ${comment}\n#爪切りパチン\n${location.href}`;
    $('share').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text);
    setTimeout(() => { if (state === 'over') $('result').hidden = false; }, 1100);
  }

  // ---------- 描画 ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSpiral() {
    const cx = W / 2, cy = Math.max(60, H * 0.15);
    const maxR = Math.min(W * 0.36, H * 0.13);
    const turns = Math.min(9, 0.25 + Math.log2(shown + 1) * 0.75);
    if (shown <= 0.05) return;
    const steps = Math.ceil(turns * 60);
    const thick = Math.max(4, Math.min(9, maxR / (turns * 2.2)));
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(spin);
    ctx.lineCap = 'round';
    for (const [w, col] of [[thick + 3, 'rgba(120,100,70,.55)'], [thick, '#f4ecdc']]) {
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const a = (i / steps) * turns * Math.PI * 2;
        const r = 4 + (i / steps) * (maxR - 4);
        const x = Math.cos(a) * r, y = Math.sin(a) * r;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
    }
    ctx.restore();
  }

  function draw(dt) {
    ctx.clearRect(0, 0, W, H);
    const z = zone();
    const cx = W / 2;
    const fw = Math.min(W * 0.66, 280);
    const nw = fw * 0.8;

    drawSpiral();

    // 指（皮膚）
    const nTop = z.y(band.b0);
    const nLen = nw * 1.25;                       // 白い部分の下からの爪の長さ
    const nBot = z.y(band.b1) + nLen;
    const skinTop = z.y(band.b1) - nw * 0.08;
    ctx.fillStyle = '#f1c7a5';
    roundRect(cx - fw / 2, skinTop, fw, H - skinTop + 40, fw * 0.48);
    ctx.fill();
    // 関節のしわ
    ctx.strokeStyle = 'rgba(160,100,70,.35)'; ctx.lineWidth = 2;
    for (const off of [0, 9]) {
      const ky = nBot + nw * 0.55 + off;
      if (ky < H - 4) { ctx.beginPath(); ctx.moveTo(cx - fw * 0.22, ky); ctx.quadraticCurveTo(cx, ky + 6, cx + fw * 0.22, ky); ctx.stroke(); }
    }

    // 爪
    const r = nw * 0.42;
    const nailPath = () => {
      ctx.beginPath();
      ctx.moveTo(cx - nw / 2 + r, nTop);
      ctx.arcTo(cx + nw / 2, nTop, cx + nw / 2, nBot, r);
      ctx.lineTo(cx + nw / 2, nBot - nw * 0.2);
      ctx.quadraticCurveTo(cx, nBot + nw * 0.12, cx - nw / 2, nBot - nw * 0.2);
      ctx.arcTo(cx - nw / 2, nTop, cx + nw / 2, nTop, r);
      ctx.closePath();
    };
    ctx.save();
    nailPath();
    ctx.clip();
    ctx.fillStyle = '#f0aeb0';
    ctx.fillRect(0, 0, W, H);
    // 爪半月
    ctx.fillStyle = 'rgba(255,240,236,.6)';
    ctx.beginPath(); ctx.ellipse(cx, nBot, nw * 0.3, nw * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    // 白い部分
    ctx.fillStyle = '#f4ecdc';
    ctx.fillRect(0, nTop, W, z.y(band.b1) - nTop);
    // つや
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fillRect(cx - nw * 0.28, nTop, nw * 0.07, nBot - nTop);
    // 真ん中ガイド
    const mid = z.y((band.b0 + band.b1) / 2);
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = 'rgba(200,120,90,.45)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx - nw / 2, mid); ctx.lineTo(cx + nw / 2, mid); ctx.stroke();
    ctx.setLineDash([]);
    // 深爪の血
    if (deathFx && deathFx.cause === 'ouch') {
      ctx.fillStyle = `rgba(210,30,40,${Math.min(.8, deathFx.t * 2)})`;
      ctx.beginPath(); ctx.ellipse(cx, z.y(cursor), nw * 0.3, 10 + deathFx.t * 18, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    nailPath();
    ctx.strokeStyle = 'rgba(150,90,80,.55)'; ctx.lineWidth = 2;
    ctx.stroke();

    // 切れた破片が上へ飛んでいく
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      p.t += dt * 2.6;
      if (p.t >= 1) { pieces.splice(i, 1); continue; }
      const k = p.t;
      const ty = Math.max(60, H * 0.15);
      const y = p.y0 + (ty - p.y0) * k;
      ctx.save();
      ctx.globalAlpha = 1 - k;
      ctx.translate(cx, y);
      ctx.rotate(k * 3);
      ctx.scale(1 - k * 0.6, 1 - k * 0.6);
      ctx.fillStyle = '#f4ecdc';
      ctx.strokeStyle = 'rgba(120,100,70,.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      const h = Math.max(4, p.y1 - p.y0);
      ctx.ellipse(0, 0, nw / 2, h, 0, Math.PI, 0);
      ctx.ellipse(0, 0, nw / 2 - 6, Math.max(1, h - 4), 0, 0, Math.PI, true);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    // 爪切り
    if (state !== 'title') {
      const by = z.y(cursor);
      const x0 = cx - nw / 2 - 26, x1 = cx + nw / 2 + 26;
      const g = ctx.createLinearGradient(0, by - 9, 0, by + 9);
      g.addColorStop(0, '#d9dde3'); g.addColorStop(.5, '#8b929c'); g.addColorStop(1, '#c7ccd3');
      ctx.fillStyle = g;
      roundRect(x0, by - 9, x1 - x0, 18, 6); ctx.fill();
      // レバー
      ctx.fillStyle = '#6d747e';
      roundRect(x1 - 8, by - 5, Math.min(110, W - x1 - 4), 10, 5); ctx.fill();
      ctx.fillStyle = '#d8406a';
      roundRect(x1 + 30, by - 6, Math.min(70, W - x1 - 34), 12, 6); ctx.fill();
      // 刃のライン
      ctx.strokeStyle = '#2b2f36'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x0 + 6, by); ctx.lineTo(x1 - 6, by); ctx.stroke();
    }
  }

  // ---------- ループ ----------
  let last = 0;
  function frame(now) {
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    if (state === 'play') {
      if (freeze > 0) freeze -= dt;
      else {
        cursor += dir * dt * (0.9 / period());
        if (cursor > 0.95) { cursor = 0.95; dir = -1; }
        if (cursor < 0.05) { cursor = 0.05; dir = 1; }
      }
    }
    if (deathFx) deathFx.t += dt;
    // 爪の形はなめらかに変化
    const k = Math.min(1, dt * 12);
    band.b0 += (band.t0 - band.b0) * k;
    band.b1 += (band.t1 - band.b1) * k;
    // 数字はカウントアップ
    shown += (lengthCm - shown) * Math.min(1, dt * 10);
    if (Math.abs(lengthCm - shown) < 0.01) shown = lengthCm;
    elLen.textContent = fmt(shown);
    spin += dt * 0.5;
    draw(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- 入力 ----------
  function press() {
    audio();
    if (state === 'title') return start();
    if (state === 'play') return snip();
  }
  stage.addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });
  $('title').addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });
  window.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    if (e.target.closest && e.target.closest('button, a')) return;
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'over') { if (!$('result').hidden) start(); return; }
    press();
  });
  $('retry').addEventListener('click', start);
  window.addEventListener('contextmenu', (e) => e.preventDefault());
})();
</script>
