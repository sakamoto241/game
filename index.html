<title>ポケットもちっこ</title>
<meta name="description" content="たまごから育てる、ポケットサイズの育成ゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  :root {
    --bg: #DCE4EA;
    --bg-dot: #CAD4DC;
    --text: #1F2A33;
    --muted: #5A6A77;
    --panel: #F5F8FA;
    --line: #C9D3DB;
    --shell: #6FC2B0;
    --shell-dark: #3F8F7F;
    --shell-light: #9ADACB;
    --key: #F4C542;
    --key-dark: #C2952A;
    --lcd: #C3CFA3;
    --lcd-ink: #26301F;
    --good: #3E9E6C;
    --warn: #D99A2B;
    --bad: #D2553F;
    --track: #E3E9EE;
    --pixel: "DotGothic16", "Hiragino Maru Gothic ProN", monospace;
    --round: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1A2027; --bg-dot: #222A33; --text: #E4EBF1; --muted: #9AABB8;
      --panel: #242C35; --line: #36414C; --track: #313B46;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1A2027; --bg-dot: #222A33; --text: #E4EBF1; --muted: #9AABB8;
    --panel: #242C35; --line: #36414C; --track: #313B46;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 1.5px, transparent 1.5px);
    background-size: 22px 22px;
    color: var(--text);
    font-family: var(--round);
    padding-inline: 16px;
    padding-block: 28px 40px;
  }
  .wrap {
    max-width: 820px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 360px) minmax(0, 1fr);
    gap: 32px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .wrap { grid-template-columns: minmax(0, 1fr); justify-items: center; }
    .panel { width: 100%; max-width: 420px; }
  }

  /* ---- device ---- */
  .device {
    width: 100%;
    max-width: 360px;
    background: linear-gradient(160deg, var(--shell-light), var(--shell) 40%, var(--shell) 70%, var(--shell-dark));
    border-radius: 48% 48% 44% 44% / 36% 36% 30% 30%;
    padding: 56px 34px 40px;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,.12), inset 0 6px 0 rgba(255,255,255,.35), 0 18px 30px rgba(20,40,40,.25);
    display: grid;
    gap: 18px;
  }
  .brand {
    text-align: center;
    font-family: var(--round);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: .2em;
    color: #1E4D44;
    margin-top: -30px;
  }
  .screen {
    background: #2E4A43;
    border-radius: 14px;
    padding: 10px;
    box-shadow: inset 0 3px 6px rgba(0,0,0,.45);
  }
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 2;
    max-width: 100%;
    border-radius: 6px;
    image-rendering: pixelated;
    background: var(--lcd);
    cursor: pointer;
  }
  .msg {
    margin-top: 8px;
    background: var(--lcd);
    color: var(--lcd-ink);
    font-family: var(--pixel);
    font-size: 15px;
    line-height: 1.35;
    padding: 6px 10px;
    border-radius: 6px;
    min-height: 2.7em;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .key {
    display: grid;
    justify-items: center;
    gap: 6px;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    font-family: var(--round);
    font-weight: 800;
    font-size: 12px;
    color: #173D36;
  }
  .key span.cap {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--key);
    box-shadow: 0 5px 0 var(--key-dark), inset 0 3px 0 rgba(255,255,255,.5);
    display: grid; place-items: center;
    transition: transform .06s, box-shadow .06s;
  }
  .key span.cap svg { width: 24px; height: 24px; }
  .key:active span.cap { transform: translateY(4px); box-shadow: 0 1px 0 var(--key-dark), inset 0 3px 0 rgba(255,255,255,.5); }
  .key:focus-visible span.cap { outline: 3px solid #fff; outline-offset: 3px; }
  .key:disabled { opacity: .45; cursor: default; }

  /* ---- panel ---- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    display: grid;
    gap: 20px;
  }
  .who { display: grid; gap: 4px; }
  .who h1 {
    margin: 0;
    font-family: var(--pixel);
    font-weight: 400;
    font-size: 30px;
    line-height: 1.1;
    text-wrap: balance;
  }
  .who .sub { color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip {
    font-size: 12px; font-weight: 800;
    padding: 3px 10px; border-radius: 99px;
    background: var(--track); color: var(--text);
  }
  .chip.mood-good { background: color-mix(in srgb, var(--good) 22%, transparent); }
  .chip.mood-bad { background: color-mix(in srgb, var(--bad) 22%, transparent); }

  .stats { display: grid; gap: 12px; }
  .stat { display: grid; grid-template-columns: 5.5em 1fr 2.6em; align-items: center; gap: 10px; font-size: 14px; }
  .stat b { font-weight: 800; }
  .stat .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .bar { height: 12px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 50%; border-radius: 99px; background: var(--good); transition: width .4s, background-color .4s; }

  .growth { border-top: 1px dashed var(--line); padding-top: 16px; display: grid; gap: 8px; font-size: 14px; }
  .growth .row { display: flex; justify-content: space-between; gap: 8px; }
  .growth .bar i { background: var(--shell-dark); }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0; }

  .naming { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 16px; }
  .naming label { font-weight: 800; font-size: 14px; }
  .naming .row { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1; min-width: 0;
    font: inherit; font-size: 16px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
  }
  .btn {
    font: inherit; font-weight: 800; font-size: 14px;
    padding: 8px 16px;
    border-radius: 10px;
    border: 0;
    background: var(--shell-dark);
    color: #fff;
    cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn.danger { background: var(--bad); }
  .btn:focus-visible, input:focus-visible { outline: 3px solid var(--key); outline-offset: 2px; }
  .reset { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
</style>

<div class="wrap">
  <div class="device">
    <div class="brand">POCKET MOCHIKKO</div>
    <div class="screen">
      <canvas id="lcd" width="288" height="192" aria-label="ペットの画面"></canvas>
      <div class="msg" id="msg" aria-live="polite">たまごを あたためよう</div>
    </div>
    <div class="keys">
      <button class="key" id="k-feed" type="button"><span class="cap"><svg viewBox="0 0 24 24" fill="#173D36"><path d="M12 3 3 19h18z"/><rect x="7" y="14" width="10" height="5" fill="#F4C542"/></svg></span><span id="l-feed">ごはん</span></button>
      <button class="key" id="k-play" type="button"><span class="cap"><svg viewBox="0 0 24 24" fill="#173D36"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c3 3 3 13 0 16M12 4c-3 3-3 13 0 16" stroke="#F4C542" stroke-width="1.6" fill="none"/></svg></span><span id="l-play">あそぶ</span></button>
      <button class="key" id="k-bath" type="button"><span class="cap"><svg viewBox="0 0 24 24" fill="none" stroke="#173D36" stroke-width="2.4"><circle cx="9" cy="14" r="5"/><circle cx="17" cy="8" r="3"/><circle cx="17.5" cy="17" r="2"/></svg></span><span id="l-bath">おふろ</span></button>
      <button class="key" id="k-sleep" type="button"><span class="cap"><svg viewBox="0 0 24 24" fill="#173D36"><path d="M15 3a9 9 0 1 0 6 13A8 8 0 0 1 15 3z"/></svg></span><span id="l-sleep">ねる</span></button>
    </div>
  </div>

  <div class="panel">
    <div class="who">
      <h1 id="name">たまご</h1>
      <div class="sub" id="age">なにが うまれるかな？</div>
      <div class="chips"><span class="chip" id="stage">たまご</span><span class="chip" id="mood">すやすや</span></div>
    </div>

    <div class="naming" id="naming" hidden>
      <label for="name-input">うまれたよ！ なまえを つけてあげよう</label>
      <form class="row" id="name-form">
        <input type="text" id="name-input" maxlength="8" placeholder="もち" autocomplete="off">
        <button class="btn" type="submit">けってい</button>
      </form>
    </div>

    <div class="stats" id="stats">
      <div class="stat"><b>おなか</b><div class="bar"><i id="b-hunger"></i></div><span class="num" id="n-hunger"></span></div>
      <div class="stat"><b>ごきげん</b><div class="bar"><i id="b-happy"></i></div><span class="num" id="n-happy"></span></div>
      <div class="stat"><b>せいけつ</b><div class="bar"><i id="b-clean"></i></div><span class="num" id="n-clean"></span></div>
      <div class="stat"><b>げんき</b><div class="bar"><i id="b-energy"></i></div><span class="num" id="n-energy"></span></div>
    </div>

    <div class="growth">
      <div class="row"><b>せいちょう</b><span id="grow-label"></span></div>
      <div class="bar"><i id="b-exp"></i></div>
      <p class="hint" id="hint"></p>
    </div>

    <div class="reset" id="reset-area">
      <button class="btn ghost" type="button" id="reset">はじめから</button>
    </div>
  </div>
</div>

<script>
(() => {
  const SAVE_KEY = 'pocket-mochikko-v1';
  const W = 48, H = 32, C = 6;

  // '#' = 線、'o' = 目、'+' = からだの中（画面の地の色）
  const SPR = {
    egg: [
      '...####...', '..#++++#..', '.#++++++#.', '.#+#++++#.', '#++++++++#', '#+++++#++#',
      '#++#+++++#', '#++++++++#', '#+++#++++#', '.#++++++#.', '..#++++#..', '...####...'],
    baby: [
      '...####...', '..#++++#..', '.#++++++#.', '#++o++o++#', '#++++++++#', '#+++##+++#',
      '.#++++++#.', '..######..'],
    child: [
      '.#........#.', '.##......##.', '.#+#....#+#.', '.#++####++#.', '#++++++++++#', '#+++o++o+++#',
      '#++++++++++#', '#++++##++++#', '#++++++++++#', '.#++++++++#.', '..#+#..#+#..', '..###..###..'],
    maru: [
      '....######....', '..##++++++##..', '.#++++++++++#.', '#++++++++++++#', '#+++oo++oo+++#', '#+++oo++oo+++#',
      '#++++++++++++#', '#++#++++++#++#', '#+++######+++#', '#++++++++++++#', '.#++++++++++#.', '..##++++++##..',
      '....######....'],
    pyon: [
      '..##......##..', '.#+#......#+#.', '.#+#......#+#.', '.#+#......#+#.', '.#+##....##+#.', '..#++####++#..',
      '.#++++++++++#.', '#++++++++++++#', '#+++o++++o+++#', '#++++++++++++#', '#+++++##+++++#', '#++++++++++++#',
      '.#++++++++++#.', '..#++#..#++#..', '..####..####..'],
    kira: [
      '......#.......', '.....###......', '......#.......', '......#.......', '...########...', '..#++++++++#..',
      '.#++++++++++#.', '#+++o++++o+++#', '#++++++++++++#', '#++#++++++#++#', '#+++######+++#', '.#++++++++++#.',
      '..#++++++++#..', '.#+#......#+#.', '.###......###.'],
    poop: ['..#..', '.###.', '#+#+#', '#####'],
    food: ['..##..', '.#++#.', '#++++#', '######', '######'],
    heart: ['##.##', '#####', '.###.', '..#..'],
    bubble: ['.#.', '#+#', '.#.'],
    z: ['###', '.#.', '###'],
    drop: ['.#.', '###', '.#.'],
  };

  const FORMS = {
    maru: { name: 'まんまる', why: 'ごはんが だいすき' },
    pyon: { name: 'ぴょこ', why: 'あそぶのが だいすき' },
    kira: { name: 'きらり', why: 'きれいずき' },
  };
  const STAGE_LABEL = { egg: 'たまご', baby: 'あかちゃん', child: 'こども', adult: 'おとな' };
  const GROW_AT = { baby: 15, child: 40 };

  function newState() {
    return {
      stage: 'egg', form: null, name: '', named: false, born: null,
      hunger: 80, happy: 80, clean: 100, energy: 80,
      exp: 0, warm: 0, poops: 0, poopClock: 0, sleeping: false,
      counts: { feed: 0, play: 0, bath: 0 },
      last: Date.now(), msg: 'たまごを あたためよう（ボタンか がめんを おしてね）',
    };
  }
  function load() {
    try { const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 保存できない環境でも遊べる */ }
  }

  let S;
  let anim = null;   // { type, t0 }
  let pet = { x: 24, dir: 1 };
  let frame = 0;
  const clamp = v => Math.max(0, Math.min(100, v));
  const $ = id => document.getElementById(id);

  function say(text) { S.msg = text; $('msg').textContent = text; }
  function displayName() { return S.named ? S.name : (S.stage === 'egg' ? 'たまご' : '？？？'); }

  // ---- 時間の経過 ----
  function passTime(min, offline) {
    if (S.stage === 'egg' || min <= 0) return;
    if (S.sleeping) {
      S.energy += 6 * min;
      S.hunger -= 1 * min;
      if (S.energy >= 100) { S.energy = 100; S.sleeping = false; if (!offline) say(`${displayName()}が めを さました！`); }
    } else {
      S.hunger -= 3 * min;
      S.happy -= 2 * min;
      S.energy -= 1.5 * min;
      S.poopClock += min;
      while (S.poopClock >= 1.5) {
        S.poopClock -= 1.5;
        if (S.poops < 3 && Math.random() < 0.4) { S.poops++; if (!offline) say('あっ、うんちを した！'); }
      }
    }
    S.clean -= (1 + 3 * S.poops) * min;
    if (Math.min(S.hunger, S.clean, S.energy) < 25) S.happy -= 1 * min;
    if (S.hunger > 50 && S.happy > 50 && S.clean > 50 && S.energy > 50) S.exp += min;

    const floor = offline ? 5 : 0;
    for (const k of ['hunger', 'happy', 'clean', 'energy']) S[k] = Math.max(floor, clamp(S[k]));
    grow();
  }

  function grow() {
    if (S.stage === 'baby' && S.exp >= GROW_AT.baby) {
      S.stage = 'child'; say(`${displayName()}が こどもに せいちょうした！`); startAnim('grow');
    } else if (S.stage === 'child' && S.exp >= GROW_AT.child) {
      const c = S.counts;
      S.form = c.feed >= c.play && c.feed >= c.bath ? 'maru' : c.play >= c.bath ? 'pyon' : 'kira';
      S.stage = 'adult';
      say(`${displayName()}が「${FORMS[S.form].name}」に しんかした！`); startAnim('grow');
    }
  }

  // ---- ボタン ----
  function startAnim(type) { anim = { type, t0: performance.now() }; }

  function act(kind) {
    if (S.stage === 'egg') {
      S.warm++; startAnim('shake');
      if (S.warm >= 3) {
        S.stage = 'baby'; S.born = Date.now(); S.last = Date.now();
        say('たまごが われて うまれた！'); startAnim('grow');
      } else {
        say(['たまごが ゆれた…', 'ピキッ… なにか きこえる'][S.warm - 1]);
      }
      return render();
    }
    const n = displayName();
    if (S.sleeping && kind !== 'sleep') { say(`${n}は ぐっすり ねてるよ`); return render(); }

    if (kind === 'feed') {
      if (S.hunger >= 95) { S.happy -= 3; say('もう おなか いっぱい…'); }
      else { S.hunger += 30; S.clean -= 3; S.counts.feed++; S.exp += 2; startAnim('eat'); say(`${n}は もぐもぐ たべた`); }
    } else if (kind === 'play') {
      if (S.energy < 15) { say(`${n}は つかれて うごけない… ねかせてあげよう`); }
      else { S.happy += 22; S.energy -= 12; S.hunger -= 6; S.counts.play++; S.exp += 2; startAnim('play'); say(`${n}と いっしょに あそんだ！`); }
    } else if (kind === 'bath') {
      const dirty = S.clean < 90 || S.poops > 0;
      S.poops = 0; S.clean = 100; S.happy += 4;
      if (dirty) { S.counts.bath++; S.exp += 2; }
      startAnim('bath'); say(dirty ? 'ピカピカに なった！' : 'もう きれいだよ');
    } else if (kind === 'sleep') {
      if (S.sleeping) {
        S.sleeping = false;
        if (S.energy < 60) { S.happy -= 5; say(`${n}は まだ ねむそう…`); } else say(`${n}が おきた！`);
      } else { S.sleeping = true; say('でんきを けした。おやすみ…'); }
    }
    for (const k of ['hunger', 'happy', 'clean', 'energy']) S[k] = clamp(S[k]);
    grow(); save(); render();
  }

  // ---- 画面（ドット絵）----
  const cv = $('lcd');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setupCanvas() {
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    cv.width = W * C * dpr; cv.height = H * C * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const LCD = '#C3CFA3', INK = '#26301F', GHOST = 'rgba(38,48,31,0.07)', DIM = '#8E9B74';

  function px(x, y, color) {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    ctx.fillStyle = color; ctx.fillRect(x * C, y * C, C - 1, C - 1);
  }
  function sprite(rows, x, y, opt = {}) {
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i++) {
        if (opt.cut != null && i >= opt.cut) continue;
        const ch = row[i];
        if (ch === '#') px(x + i, y + j, opt.ink || INK);
        else if (ch === 'o' && !opt.closed) px(x + i, y + j, opt.ink || INK);
      }
    });
  }

  function petSprite() {
    if (S.stage === 'adult') return SPR[S.form];
    return SPR[S.stage];
  }

  function draw() {
    const now = performance.now();
    if (anim && now - anim.t0 > 2200) anim = null;
    const at = anim ? Math.floor((now - anim.t0) / 250) : 0;
    const dark = S.sleeping;
    const ink = dark ? '#C3CFA3' : INK;

    ctx.fillStyle = dark ? '#3A4631' : LCD;
    ctx.fillRect(0, 0, W * C, H * C);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) px(x, y, dark ? 'rgba(0,0,0,0.12)' : GHOST);

    // 地面
    for (let x = 1; x < W - 1; x += 2) px(x, 30, dark ? DIM : INK);

    // うんち
    const poopX = [40, 34, 43];
    for (let i = 0; i < S.poops; i++) sprite(SPR.poop, poopX[i], 26, { ink });

    const spr = petSprite();
    const w = spr[0].length, h = spr.length;
    let x = Math.round(pet.x - w / 2), y = 30 - h;
    const bob = reduce || dark || frame % 2 === 0 ? 0 : -1;

    if (S.stage === 'egg') {
      x = 24 - w / 2;
      if (anim?.type === 'shake') x += at % 2 === 0 ? -1 : 1;
      sprite(spr, x, y, { ink });
    } else {
      if (anim?.type === 'play') y += at % 2 === 0 ? -4 : 0;
      else y += bob;
      if (anim?.type === 'grow' && at < 6 && at % 2 === 1) { /* 点滅 */ }
      else sprite(spr, x, y, { ink, closed: dark || (frame % 13 === 0) });

      if (anim?.type === 'eat') {
        const cut = Math.max(0, 6 - at);
        if (cut > 0) sprite(SPR.food, x - 8, 25, { cut, ink });
      }
      if (anim?.type === 'play') {
        sprite(SPR.heart, x + w + 1, y - 3 - (at % 3), { ink });
        if (at > 3) sprite(SPR.heart, x - 6, y - 1 - (at % 2), { ink });
      }
      if (anim?.type === 'bath') {
        for (let k = 0; k < 5; k++) {
          const bx = x - 3 + ((k * 7 + at * 3) % (w + 6));
          const by = y + h - 2 - ((at * 2 + k * 5) % (h + 4));
          sprite(SPR.bubble, bx, by, { ink });
        }
      }
      if (dark) {
        const zx = x + w + 1, zy = y - 4 - (frame % 3);
        sprite(SPR.z, zx, zy, { ink });
        if (frame % 4 > 1) sprite(SPR.z, zx + 4, zy - 4, { ink });
      } else if (!anim && Math.min(S.hunger, S.happy, S.clean, S.energy) < 25) {
        sprite(SPR.drop, x + w + 1, y + 1 + (frame % 2), { ink });
      }
    }
  }

  function wander() {
    if (S.stage === 'egg' || S.sleeping || anim) return;
    if (Math.random() < 0.3) pet.dir *= -1;
    if (Math.random() < 0.6) pet.x += pet.dir;
    const w = petSprite()[0].length;
    const min = Math.ceil(w / 2) + 1, max = 30 - Math.ceil(w / 2);
    if (pet.x < min) { pet.x = min; pet.dir = 1; }
    if (pet.x > max) { pet.x = max; pet.dir = -1; }
  }

  // ---- パネル ----
  function barColor(v) { return v < 25 ? 'var(--bad)' : v < 50 ? 'var(--warn)' : 'var(--good)'; }
  function ageText() {
    if (!S.born) return 'なにが うまれるかな？';
    const m = Math.floor((Date.now() - S.born) / 60000);
    if (m < 1) return 'うまれた ばかり';
    if (m < 60) return `うまれて ${m}ふん`;
    const hr = Math.floor(m / 60);
    if (hr < 24) return `うまれて ${hr}じかん`;
    return `うまれて ${Math.floor(hr / 24)}にち`;
  }
  function moodText() {
    if (S.stage === 'egg') return ['すやすや', 'ゆらゆら', 'ピキピキ'][Math.min(2, S.warm)];
    if (S.sleeping) return 'おやすみちゅう';
    const low = Math.min(S.hunger, S.happy, S.clean, S.energy);
    if (low < 25) {
      if (S.hunger === low) return 'おなかぺこぺこ';
      if (S.clean === low) return 'きたなくて いや';
      if (S.energy === low) return 'ねむい…';
      return 'さみしい';
    }
    const avg = (S.hunger + S.happy + S.clean + S.energy) / 4;
    return avg > 75 ? 'ごきげん！' : 'ふつう';
  }

  function render() {
    $('msg').textContent = S.msg;
    $('name').textContent = displayName();
    $('age').textContent = S.stage === 'adult' ? `${ageText()}・${FORMS[S.form].why}` : ageText();
    $('stage').textContent = S.stage === 'adult' ? `おとな（${FORMS[S.form].name}）` : STAGE_LABEL[S.stage];
    const mood = moodText();
    const moodEl = $('mood');
    moodEl.textContent = mood;
    moodEl.className = 'chip ' + (mood === 'ごきげん！' ? 'mood-good' : ['おなかぺこぺこ', 'きたなくて いや', 'ねむい…', 'さみしい'].includes(mood) ? 'mood-bad' : '');

    for (const k of ['hunger', 'happy', 'clean', 'energy']) {
      const v = Math.round(S[k]);
      const b = $('b-' + k);
      b.style.width = (S.stage === 'egg' ? 0 : v) + '%';
      b.style.backgroundColor = barColor(v);
      $('n-' + k).textContent = S.stage === 'egg' ? '—' : v;
    }

    let label, pct, hint;
    if (S.stage === 'egg') {
      label = `あたためた ${S.warm} / 3`; pct = S.warm / 3 * 100;
      hint = 'どのボタンでも たまごを あたためられるよ。';
    } else if (S.stage === 'adult') {
      label = 'おとなに なった！'; pct = 100;
      hint = 'せいちょうは ここまで。これからも なかよく くらそう。';
    } else {
      const from = S.stage === 'baby' ? 0 : GROW_AT.baby, to = GROW_AT[S.stage];
      pct = (S.exp - from) / (to - from) * 100;
      label = `つぎの せいちょうまで ${Math.max(1, Math.ceil(to - S.exp))}`;
      hint = S.stage === 'baby'
        ? 'ぜんぶの ゲージが はんぶん いじょうだと どんどん そだつよ。'
        : 'こどもの ころ いちばん した おせわで、おとなの すがたが かわるよ。';
    }
    $('grow-label').textContent = label;
    $('b-exp').style.width = Math.max(0, Math.min(100, pct)) + '%';
    $('hint').textContent = hint;

    $('l-sleep').textContent = S.sleeping ? 'おこす' : 'ねる';
    $('naming').hidden = !(S.stage !== 'egg' && !S.named);
  }

  // ---- はじめから ----
  function showResetConfirm() {
    const area = $('reset-area');
    area.innerHTML = '';
    const t = document.createElement('span');
    t.textContent = S.stage === 'egg' ? 'あたらしい たまごに する？' : `${displayName()}と おわかれして、あたらしい たまごに する？`;
    const yes = document.createElement('button');
    yes.className = 'btn danger'; yes.type = 'button'; yes.textContent = 'はい';
    const no = document.createElement('button');
    no.className = 'btn ghost'; no.type = 'button'; no.textContent = 'やめる';
    yes.onclick = () => { S = newState(); pet.x = 24; save(); restoreReset(); render(); };
    no.onclick = restoreReset;
    area.append(t, yes, no);
    no.focus();
  }
  function restoreReset() {
    const area = $('reset-area');
    area.innerHTML = '<button class="btn ghost" type="button" id="reset">はじめから</button>';
    $('reset').onclick = showResetConfirm;
  }

  // ---- 起動 ----
  function start(data) {
    S = (data && data.state) || load() || newState();
    const away = (Date.now() - S.last) / 60000;
    if (away > 0.5) {
      passTime(Math.min(away, 480), true);
      if (S.stage !== 'egg') say(`おかえり！ ${displayName()}が まってたよ`);
    }
    S.last = Date.now();

    setupCanvas();
    window.addEventListener('resize', setupCanvas);
    $('k-feed').onclick = () => act('feed');
    $('k-play').onclick = () => act('play');
    $('k-bath').onclick = () => act('bath');
    $('k-sleep').onclick = () => act('sleep');
    cv.onclick = () => { if (S.stage === 'egg') act('warm'); };
    $('reset').onclick = showResetConfirm;
    $('name-form').addEventListener('submit', e => {
      e.preventDefault();
      const v = $('name-input').value.trim() || 'もち';
      S.name = v; S.named = true; say(`きょうから きみは「${v}」！`); save(); render();
    });

    // 1秒ごとに時間をすすめる
    setInterval(() => {
      const now = Date.now();
      const dt = (now - S.last) / 60000;
      S.last = now;
      passTime(Math.min(dt, 480), dt > 0.5);
      render();
    }, 1000);
    setInterval(save, 5000);
    document.addEventListener('visibilitychange', save);
    window.addEventListener('pagehide', save);

    // 画面は 1秒に4コマ（むかしの液晶っぽく）
    setInterval(() => { frame++; if (frame % 2 === 0) wander(); draw(); }, 250);

    if (window.claude?.hot && typeof window.claude.hot.snapshot === 'function') {
      window.claude.hot.snapshot(() => ({ state: S }));
    }
    render(); draw();
  }

  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
