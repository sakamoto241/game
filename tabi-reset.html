<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf0"><title>はじめから遊ぶ｜ちいさな魔女の旅じたく</title><style>*{box-sizing:border-box}body{margin:0;padding:40px 18px;background:#eee9db;color:#65563f;font:15px/1.9 -apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:460px;margin:6vh auto;background:#fffaf0;border:1px solid #cfbd96;border-radius:14px;padding:28px 24px;box-shadow:0 10px 40px #67512b15}small{color:#8a9075}h1{font:700 28px/1.6 'Yu Mincho',serif;color:#98654d;margin:8px 0 18px}p{font-size:14px;color:#7d7f66}button,a{touch-action:manipulation}button{display:block;width:100%;min-height:56px;margin-top:24px;border:1px solid #9d6e4b;border-radius:8px;background:#b7785e;color:#fff9eb;font:700 16px/1.7 sans-serif;padding:12px;cursor:pointer}button:disabled{opacity:.55}a{display:block;text-align:center;color:#73805b;margin-top:18px;text-underline-offset:4px}#result{font-size:13px;color:#a56850}</style></head><body><main><small>ちいさな魔女の旅じたく</small><h1>新しい旅を、<br>はじめから。</h1><p>このブラウザに保存された、このゲームの進行・仲間・装備・おまもりを初期化します。</p><p>普段ゲームを遊んでいるブラウザで開き、下のボタンを押してください。初期化後はタイトル画面へ戻ります。</p><button id="reset-save">データを消して、はじめから</button><p id="result" role="status"></p><a href="tabi.html?v=20">データを消さずに戻る</a></main><script>document.querySelector('#reset-save').onclick=()=>{const b=document.querySelector('#reset-save');b.disabled=true;try{const base='lili-tabijitaku-v1',marker='lili-tabijitaku-reset',previous=localStorage.getItem(marker)||'',token=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);localStorage.setItem(marker,token);localStorage.removeItem(previous?base+'-reset-'+previous:base);localStorage.removeItem(base);location.replace('tabi.html?v=20');}catch(error){b.disabled=false;document.querySelector('#result').textContent='このブラウザでは保存データを操作できませんでした。いつも遊んでいるブラウザで開き直してください。';}};</script></body></html>
