function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function noise2(seed) {
  const r = mulberry(seed); const g = [];
  for (let i = 0; i < 20 * 20; i++) g.push(r());
  const at = (x, y) => g[((y % 20 + 20) % 20) * 20 + ((x % 20 + 20) % 20)];

const SEA = 0, SAND = 1, GRASS = 2, RIVER = 3, BRIDGE = 4, PATH = 5;
function genWorld(seed) {
  const r = mulberry(seed);
  const n1 = noise2(seed + 1), n2 = noise2(seed + 2);
  const tile = [];
  for (let y = 0; y < MH; y++) {
    tile.push([]);
    for (let x = 0; x < MW; x++) {
      const nx = (x - MW / 2) / (MW / 2 - 5), ny = (y - MH / 2) / (MH / 2 - 5);
      const d = Math.pow(Math.abs(nx), 2.6) + Math.pow(Math.abs(ny), 2.6);
      const nz = (n1(x / 6, y / 6) - 0.5) * 0.5 + (n2(x / 2.5, y / 2.5) - 0.5) * 0.12;
      const v = d + nz;
      tile[y].push(v < 0.78 ? GRASS : v < 1 ? SAND : SEA);
    }
  }
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (x < 3 || y < 3 || x >= MW - 3 || y >= MH - 3) tile[y][x] = SEA;
  // 川（北から南へ）
  let rx = Math.floor(MW * (0.52 + (r() - 0.5) * 0.1));
  const riverX = [];
  for (let y = 0; y < MH; y++) {
    rx += Math.round((n1(y / 5, 3) - 0.5) * 1.6);
    rx = clamp(rx, Math.floor(MW * 0.42), Math.floor(MW * 0.62));
    riverX.push(rx);
    for (let k = 0; k < 2; k++) if (tile[y][rx + k] !== SEA) tile[y][rx + k] = RIVER;
  }
  // 橋
  const bridges = [];
  for (const fy of [0.33, 0.66]) {
    let by = Math.floor(MH * fy);
    const bx = riverX[by];
    if (tile[by][bx] === RIVER) {
      for (let k = -1; k <= 2; k++) if (tile[by][bx + k] === RIVER) tile[by][bx + k] = BRIDGE;
      bridges.push({ x: bx, y: by });
    }
  }
  const occ = Array.from({ length: MH }, () => Array(MW).fill(null));
  const isGrass = (x, y) => tile[y] && tile[y][x] === GRASS && !occ[y][x];
  function areaFree(x, y, w, h, m) {
    for (let j = y - m; j < y + h + m; j++) for (let i = x - m; i < x + w + m; i++) if (!isGrass(i, j)) return false;
    return true;
  }
  const buildings = [];
  function place(kind, w, h, px, py, extra) {
    for (let rad = 0; rad < 30; rad++) {
      for (let a = 0; a < Math.max(1, rad * 8); a++) {
        const ang = a / Math.max(1, rad * 8) * Math.PI * 2;
        const x = Math.round(px + Math.cos(ang) * rad), y = Math.round(py + Math.sin(ang) * rad);
        if (areaFree(x, y, w, h + 2, 1)) {
          const b = { kind, x, y, w, h, door: { x: x + Math.floor(w / 2), y: y + h }, ...extra };
          for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) occ[j][i] = b;
          // 入口の前は道にする
          for (let j = y + h; j < y + h + 2; j++) for (let i = x + Math.floor(w / 2) - 1; i <= x + Math.floor(w / 2) + 1; i++) if (tile[j][i] === GRASS) tile[j][i] = PATH;
          buildings.push(b);
          return b;
        }
      }
    }
    // 見つからなければ 島じゅうを さがす（すき間を ゆるめて）
    for (let y = 4; y < MH - h - 6; y++) for (let x = 4; x < MW - w - 4; x++) {
      if (areaFree(x, y, w, h + 1, 0)) {
        const b = { kind, x, y, w, h, door: { x: x + Math.floor(w / 2), y: y + h }, ...extra };
        for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) occ[j][i] = b;
        if (tile[y + h][b.door.x] === GRASS) tile[y + h][b.door.x] = PATH;
        buildings.push(b);
        return b;
      }
    }
    return null;
  }
  const midRiver = riverX[Math.floor(MH / 2)];
  const leftC = Math.floor((midRiver + 6) / 2), rightC = Math.floor((midRiver + 2 + MW - 6) / 2);
  // 広場
  const plaza = { x: leftC - 2, y: Math.floor(MH * 0.45) };
  for (let j = plaza.y - 2; j <= plaza.y + 2; j++) for (let i = plaza.x - 3; i <= plaza.x + 3; i++) if (tile[j] && tile[j][i] === GRASS) tile[j][i] = PATH;
  for (let j = plaza.y - 2; j <= plaza.y + 2; j++) for (let i = plaza.x - 3; i <= plaza.x + 3; i++) if (occ[j]) occ[j][i] = 'plaza';
  place('museum', 5, 3, leftC - 1, Math.floor(MH * 0.22));
  place('shop', 4, 3, leftC + 4, Math.floor(MH * 0.62));
  place('house', 3, 3, rightC, Math.floor(MH * 0.42), { owner: 'player' });
  const vPos = [[leftC - 7, MH * 0.36], [leftC - 6, MH * 0.7], [rightC - 3, MH * 0.2], [rightC + 3, MH * 0.68]];
  VILLAGERS.forEach((v, i) => place('vhouse', 3, 3, vPos[i][0], Math.floor(vPos[i][1]), { vid: v.id }));
  for (let j = plaza.y - 2; j <= plaza.y + 2; j++) for (let i = plaza.x - 3; i <= plaza.x + 3; i++) if (occ[j] && occ[j][i] === 'plaza') occ[j][i] = null;

  // 木・石・花
  const trees = [], rocks = [], flowers = [];
  let fruitCount = 0;
  const near = (x, y, list, d) => list.some(o => Math.abs(o.x - x) < d && Math.abs(o.y - y) < d);
  const nearB = (x, y) => buildings.some(b => x >= b.x - 2 && x < b.x + b.w + 2 && y >= b.y - 2 && y < b.y + b.h + 3);
  const nearPlaza = (x, y) => Math.abs(x - plaza.x) <= 4 && Math.abs(y - plaza.y) <= 3;
  for (let tries = 0; tries < 3000 && trees.length < 95; tries++) {
    const x = Math.floor(r() * MW), y = Math.floor(r() * MH);
    if (!isGrass(x, y) || nearB(x, y) || nearPlaza(x, y) || near(x, y, trees, 2)) continue;
    if (tile[y + 1] && tile[y + 1][x] !== GRASS) continue;
    const fruit = fruitCount < 16 && r() < 0.25;
    if (fruit) fruitCount++;
    const t = { x, y, kind: fruit ? 'fruit' : (r() < 0.22 ? 'pine' : 'tree'), idx: trees.length };
    trees.push(t); occ[y][x] = t;
  }
  for (let tries = 0; tries < 800 && trees.filter(t => t.kind === 'palm').length < 9; tries++) {
    const x = Math.floor(r() * MW), y = Math.floor(r() * MH);
    if (tile[y][x] !== SAND || occ[y][x] || near(x, y, trees, 3)) continue;
    let landN = 0; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (tile[y + dy] && (tile[y + dy][x + dx] === SAND || tile[y + dy][x + dx] === GRASS)) landN++;
    if (landN < 3) continue;
    const t = { x, y, kind: 'palm', idx: trees.length };
    trees.push(t); occ[y][x] = t;
  }
  for (let tries = 0; tries < 800 && rocks.length < 6; tries++) {
    const x = Math.floor(r() * MW), y = Math.floor(r() * MH);
    if (!isGrass(x, y) || nearB(x, y) || near(x, y, rocks, 8) || nearPlaza(x, y)) continue;
    const k = { x, y, idx: rocks.length, type: 'rock' };
    rocks.push(k); occ[y][x] = k;
  }
  const FL = ['#F26D6D', '#F7D24A', '#FFFFFF', '#F59AC4', '#9B7BE0', '#F2994A'];
  for (let c = 0; c < 22; c++) {
    const cx = Math.floor(r() * MW), cy = Math.floor(r() * MH), col = pick(FL, r);
    for (let k = 0; k < 6; k++) {
      const x = cx + Math.floor(r() * 4) - 1, y = cy + Math.floor(r() * 3) - 1;
      if (isGrass(x, y) && !nearB(x, y) && !flowers.some(f => f.x === x && f.y === y)) flowers.push({ x, y, color: col, ph: r() * 6 });
    }
  }
  return { tile, occ, buildings, trees, rocks, flowers, bridges, plaza, riverX, seed };
}
const tileAt = (x, y) => (W.tile[y] && W.tile[y][x] !== undefined) ? W.tile[y][x] : SEA;
const isWater = t => t === SEA || t === RIVER;
const isLand = t => t === SAND || t === GRASS || t === PATH || t === BRIDGE;

function dailyReset(force) {
  const key = dayKey();
  if (G.day && G.day.key === key && !force) return false;
  const r = mulberry(strSeed(key) ^ G.seed);
  const free = [];
  const freeSand = [];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (W.occ[y][x]) continue;
    const t = W.tile[y][x];
    if (t === GRASS && !W.buildings.some(b => x >= b.x - 1 && x <= b.x + b.w && y >= b.y - 1 && y <= b.y + b.h + 1)) free.push({ x, y });
    if (t === SAND) freeSand.push({ x, y });
  }
  const take = (list) => { const i = Math.floor(r() * list.length); return list.splice(i, 1)[0]; };
  const drops = [], weeds = [], digs = [];
  for (let i = 0; i < 6; i++) { const p = take(free); drops.push({ ...p, id: 'branch' }); }
  for (let i = 0; i < 7; i++) { const p = take(free); weeds.push(p); }
  const shells = ['sh_hotate', 'sh_hotate', 'sh_sakura', 'sh_sakura', 'sh_maki', 'sh_sango'];
  for (let i = 0; i < 6; i++) { const p = take(freeSand); if (p) drops.push({ ...p, id: pick(shells, r) }); }
  for (let i = 0; i < 4; i++) { const p = take(free); digs.push({ ...p, kind: 'fossil' }); }
  const pm = take(free); digs.push({ ...pm, kind: 'money' });
  const wr = r();
  const weather = wr < 0.55 ? 'sunny' : wr < 0.8 ? 'cloudy' : 'rain';
  // お店
  const furn = [...SHOP_FURN].sort(() => r() - 0.5).slice(0, 4);
  const shirts = [...SHIRTS.map(s => s.id)].sort(() => r() - 0.5).slice(0, 2);
  // 住人のお願い
  const v = pick(VILLAGERS, r);
  const wants = ['fr_' + G.native, 'branch', 'sh_hotate', 'wood', 'stone', 'f_funa', 'f_aji', 'b_ari'];
  const request = { vid: v.id, want: pick(wants, r), reward: pick(SHOP_FURN, r), done: false };
  G.day = { key, drops, weeds, digs, weather, shop: [...furn, ...shirts], fruitTaken: {}, shaken: {}, rockHits: {}, chops: {}, request, bagTrees: Math.floor(r() * W.trees.length) };
  return true;
}

function inputVec() {
  let x = 0, y = 0;
  if (keys['a'] || keys['arrowleft']) x -= 1;
  if (keys['d'] || keys['arrowright']) x += 1;
  if (keys['w'] || keys['arrowup']) y -= 1;
  if (keys['s'] || keys['arrowdown']) y += 1;
  let run = keys['shift'];
  if (joy.on) {
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, len = Math.hypot(dx, dy);
    if (len > 8) { x = dx / len; y = dy / len; run = len > 60; }
  }
  const l = Math.hypot(x, y);
  if (l > 1) { x /= l; y /= l; }
  return { x, y, run };
}

let actx = null, soundOn = true;
function audio() {
  if (!soundOn) return null;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { soundOn = false; return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type = 'sine', vol = 0.06, when = 0, slide = 0) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
const SFX = {

let dq = [];            // 会話の待ち行列

function updateDialog(dt) {

      dTimer -= 0.035;
      const ch = dCur.text[dShown++];
      if (dShown % 2 === 1) voiceBlip(ch, dCur.speaker.voice || 300);

// =============== ポケット ===============
function addItem(id, n = 1) {
  const st = ITEMS[id].stack;
  for (let k = 0; k < n; k++) {
    let placed = false;
    if (st > 1) for (const s of G.pockets) if (s && s.id === id && s.n < st) { s.n++; placed = true; break; }
    if (!placed) {
      const i = G.pockets.findIndex(s => !s);
      if (i < 0) return k;
      G.pockets[i] = { id, n: 1 };
    }
  }
  return n;
}
function countItem(id) { return G.pockets.reduce((n, s) => n + (s && s.id === id ? s.n : 0), 0); }
function removeItem(id, n = 1) {
  for (let i = G.pockets.length - 1; i >= 0 && n > 0; i--) {
    const s = G.pockets[i];
    if (s && s.id === id) { const k = Math.min(n, s.n); s.n -= k; n -= k; if (s.n <= 0) G.pockets[i] = null; }
  }
}
function pocketsFull() { return !G.pockets.some(s => !s); }
function canAdd(id) { return !pocketsFull() || (ITEMS[id].stack > 1 && G.pockets.some(s => s && s.id === id && s.n < ITEMS[id].stack)); }
function give(id, n = 1, msg) {
  if (id === 'leafbag') { G.leaf += 1000; SFX.coin(); toast('1,000 リーフ 手に入れた！'); updateHud(); return true; }
  const got = addItem(id, n);
  if (got <= 0) { toast('ポケットが いっぱい！'); return false; }
  SFX.pick();
  toast(msg || `${ITEMS[id].name}${got > 1 ? ' ×' + got : ''} を 手に入れた！`);
  save();
  return true;
}

// =============== キャラクターを描く ===============
function drawChar(c, x, y, o) {
  // o: { type: 'human'|species, face, walk, body, inner, shirt, hair, action, actT, sleep }
  const f = o.face;
  const bob = o.moving ? Math.abs(Math.sin(o.walk * 2)) * 2 : 0;
  c.save(); c.translate(x, y - bob);
  // 影
  c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(0, bob + 1, 10, 4, 0, 0, 7); c.fill();
  // 足

  c.fillStyle = o.type === 'human' ? '#5A4632' : o.body;
  c.beginPath(); c.ellipse(-4, -2 + lg * (f === 'left' || f === 'right' ? 0 : 0.3), 3.2, 3, 0, 0, 7); c.fill();
  c.beginPath(); c.ellipse(4, -2 - lg * 0.3, 3.2, 3, 0, 0, 7); c.fill();

  c.fillStyle = skin;
  c.beginPath(); c.ellipse(0, hy, 12.5, 11.5, 0, 0, 7); c.fill();
  if (o.type === 'frog') { c.fillStyle = o.body; c.beginPath(); c.arc(-6, hy - 9, 5, 0, 7); c.arc(6, hy - 9, 5, 0, 7); c.fill(); }
  // 髪（人間）

    c.fillStyle = o.hair;
    if (f === 'up') { c.beginPath(); c.ellipse(0, hy - 1, 13, 12, 0, 0, 7); c.fill(); }
    else {
      c.beginPath(); c.ellipse(0, hy - 5, 13, 8.5, 0, Math.PI, 0); c.fill();
      c.beginPath(); c.moveTo(-13, hy - 5); c.quadraticCurveTo(-12, hy + 4, -9, hy + 5); c.lineTo(-8, hy - 3); c.fill();
      c.beginPath(); c.moveTo(13, hy - 5); c.quadraticCurveTo(12, hy + 4, 9, hy + 5); c.lineTo(8, hy - 3); c.fill();
      if (f === 'left') { c.beginPath(); c.ellipse(4, hy - 2, 9, 9, 0, 0, 7); c.fill(); }

  }

}

// =============== 地形の絵（最初に1回だけ描く） ===============

    summer: { grass: '#6FC04F', grass2: '#62B345', tuft: '#4E9A38' },

  // 草地

    const t = W.tile[y][x];
    if (t === GRASS || t === PATH || (t === RIVER && [[1, 0], [-1, 0]].some(([i]) => tileAt(x + i, y) === GRASS || tileAt(x + i, y) === PATH)) || (t === BRIDGE)) roundRect(g, x * T - 3, y * T - 3, T + 6, T + 6, 10);

    g.strokeStyle = col.tuft; g.lineWidth = 1.5;

  }

  // 川
  g.fillStyle = '#C9B98A';
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (W.tile[y][x] === RIVER || W.tile[y][x] === BRIDGE) roundRect(g, x * T - 3, y * T - 1, T + 6, T + 2, 8);
  g.fillStyle = '#58B4DA';
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (W.tile[y][x] === RIVER || W.tile[y][x] === BRIDGE) roundRect(g, x * T, y * T - 2, T, T + 4, 6);
  // 道
  g.fillStyle = se === 'winter' ? '#D8D2C6' : '#DCC28E';
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (W.tile[y][x] === PATH) roundRect(g, x * T - 1, y * T - 1, T + 2, T + 2, 8);
  g.fillStyle = 'rgba(160,120,70,.25)';
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (W.tile[y][x] === PATH) for (let k = 0; k < 2; k++) g.fillRect(x * T + r() * 28, y * T + r() * 28, 3, 2);
  // 橋
  for (const b of W.bridges) {
    const xs = []; for (let i = -1; i <= 2; i++) if (W.tile[b.y][b.x + i] === BRIDGE) xs.push(b.x + i);
    const x0 = Math.min(...xs) * T - 6, x1 = (Math.max(...xs) + 1) * T + 6;
    g.fillStyle = '#A8784A'; g.fillRect(x0, b.y * T + 4, x1 - x0, T - 8);
    g.fillStyle = '#8A5E34'; for (let x = x0 + 4; x < x1; x += 8) g.fillRect(x, b.y * T + 4, 2, T - 8);
    g.fillStyle = '#6E4A2A'; g.fillRect(x0, b.y * T + 2, x1 - x0, 3); g.fillRect(x0, b.y * T + T - 5, x1 - x0, 3);

function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fill(); }

// =============== 虫・魚の生き物 ===============
let bugs = [], shadows = [], fishing = null, particles = [];
function availableBugs() {
  const d = now(), m = d.getMonth() + 1, h = d.getHours();
  return BUGS.filter(b => inMonths(m, b.months) && inHours(h, b.hours) && !(G.day.weather === 'rain' && (b.kind === 'butterfly' || b.kind === 'bee' || b.kind === 'dragon')));
}
function availableFish(loc) {
  const d = now(), m = d.getMonth() + 1, h = d.getHours();
  return FISH.filter(f => f.loc === loc && inMonths(m, f.months) && inHours(h, f.hours));
}
function weightedPick(list, wf) { let s = list.reduce((n, x) => n + wf(x), 0), r = Math.random() * s; for (const x of list) { r -= wf(x); if (r < 0) return x; } return list[0]; }
function spawnBug() {
  const list = availableBugs(); if (!list.length) return;
  const b = weightedPick(list, x => x.rare ? 0.4 : x.price > 900 ? 1 : 3);
  const cx = player.x / T, cy = player.y / T;
  for (let tries = 0; tries < 30; tries++) {
    const tx = Math.floor(cx + rand(-11, 11)), ty = Math.floor(cy + rand(-8, 8));
    if (Math.abs(tx - cx) < 4 && Math.abs(ty - cy) < 3) continue;
    const t = tileAt(tx, ty);
    let ok = false, x = tx * T + 16, y = ty * T + 16, anchor = null;
    if (b.where === 'fly') ok = isLand(t);
    if (b.where === 'flower') { const f = W.flowers.find(f => Math.abs(f.x - tx) < 3 && Math.abs(f.y - ty) < 3); if (f) { ok = true; x = f.x * T + 16; y = f.y * T + 18; anchor = f; } }
    if (b.where === 'tree') { const tr = W.trees.find(tr => tr.kind !== 'palm' && Math.abs(tr.x - tx) < 3 && Math.abs(tr.y - ty) < 3); if (tr) { ok = true; x = tr.x * T + 16; y = tr.y * T + 10; anchor = tr; } }
    if (b.where === 'ground') ok = t === GRASS && !W.occ[ty][tx];
    if (b.where === 'beach') ok = t === SAND && !W.occ[ty][tx];
    if (!ok) continue;
    if (bugs.some(o => Math.hypot(o.x - x, o.y - y) < 30)) continue;
    bugs.push({ b, x, y, hx: x, hy: y, t: rand(0, 6), anchor, flee: false, vx: 0, vy: 0, life: rand(60, 120) });

}
function spawnShadow() {
  const cx = player.x / T, cy = player.y / T;
  for (let tries = 0; tries < 40; tries++) {
    const tx = Math.floor(cx + rand(-11, 11)), ty = Math.floor(cy + rand(-8, 8));
    const t = tileAt(tx, ty);
    if (!isWater(t)) continue;
    if (Math.abs(tx - cx) < 2 && Math.abs(ty - cy) < 2) continue;
    const loc = t === RIVER ? 'river' : 'sea';
    // 海は岸の近くだけ
    if (loc === 'sea') { let near = false; for (let j = -3; j <= 3 && !near; j++) for (let i = -3; i <= 3; i++) if (isLand(tileAt(tx + i, ty + j))) { near = true; break; } if (!near) continue; }
    const list = availableFish(loc); if (!list.length) continue;

    shadows.push({ f, x: tx * T + 16, y: ty * T + 16, t: rand(0, 6), dir: rand(0, 6), loc, state: 'swim', life: rand(60, 140) });

}
function waterAtPx(x, y) { return isWater(tileAt(Math.floor(x / T), Math.floor(y / T))); }

// =============== 世界の当たり判定 ===============
function blockedTile(tx, ty) {

    return room.occ[ty][tx] != null;

}
function blockedAt(px, py) {

// =============== 前にあるもの ===============
const DIRS = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] };
function frontPoint(d = 22) { const [dx, dy] = DIRS[player.face]; return { x: player.x + dx * d, y: player.y + dy * d }; }
function frontTile() { const p = frontPoint(); return { x: Math.floor(p.x / T), y: Math.floor(p.y / T) }; }
function villagerNear() {

  for (const v of villagerStates) { if (!v.out) continue; const d = Math.hypot(v.x - p.x, v.y - p.y); if (d < bd) { bd = d; best = v; } }

function dropAt(tx, ty) { return G.day.drops.findIndex(d => d.x === tx && d.y === ty); }

// =============== Aボタン ===============
function contextLabel() {

    const ft = frontTile();
    if (ft.y >= ROOM_H || (ft.y === ROOM_H - 1 && player.face === 'down' && Math.floor(player.y / T) === ROOM_H - 1 && ft.x === 4)) return 'そとへ出る';

  if (b) return { museum: 'はくぶつかんに入る', shop: 'よろず屋に入る', house: '家に入る', vhouse: 'ノックする' }[b.kind];
  if (dropAt(me.x, me.y) >= 0 || dropAt(ft.x, ft.y) >= 0) return 'ひろう';
  if (weedAt(me.x, me.y) >= 0 || weedAt(ft.x, ft.y) >= 0) return 'ざっそうをぬく';
  const o = W.occ[ft.y] && W.occ[ft.y][ft.x];
  const tool = G.tool;

function pressA() {

    if (o && o.type === 'rock') { hitRock(o); return; }
    return;
  }
  if (tool === 'axe' && o && W.trees.includes(o) && o.kind !== 'palm') { chopTree(o); return; }
  if (o && W.trees.includes(o)) { shakeTree(o); return; }
}

function pop(x, y, color) { for (let i = 0; i < 8; i++) particles.push({ x, y, vx: rand(-50, 50), vy: rand(-80, -20), life: .5, max: .5, color, s: rand(2, 4) }); }
function freeSpotNear(tx, ty) {
  for (let rad = 1; rad < 4; rad++) for (let j = -rad; j <= rad; j++) for (let i = -rad; i <= rad; i++) {
    const x = tx + i, y = ty + j;
    if (!isLand(tileAt(x, y)) || W.occ[y][x] || dropAt(x, y) >= 0 || weedAt(x, y) >= 0 || digAt(x, y) >= 0) continue;
    if (Math.random() < 0.5) return { x, y };
  }
  return null;
}
function shakeTree(tr) {
  player.act = 'shake'; player.actT = 0; SFX.shake();
  tr.shakeT = 0.5;
  const day = G.day;
  if (tr.kind === 'fruit' && !day.fruitTaken[tr.idx]) {
    day.fruitTaken[tr.idx] = true;
    for (let i = 0; i < 3; i++) { const p = freeSpotNear(tr.x, tr.y + 1); if (p) day.drops.push({ ...p, id: 'fr_' + G.native }); }
    toast(`${FRUITS[G.native].name}が 落ちてきた！`);
  } else if (tr.kind === 'palm' && !day.fruitTaken[tr.idx]) {
    day.fruitTaken[tr.idx] = true;
    for (let i = 0; i < 2; i++) { const p = freeSpotNear(tr.x, tr.y + 1); if (p) day.drops.push({ ...p, id: 'coconut' }); }
  } else if (!day.shaken[tr.idx]) {
    day.shaken[tr.idx] = true;
    if (tr.idx === day.bagTrees) { const p = freeSpotNear(tr.x, tr.y + 1); if (p) { day.drops.push({ ...p, id: 'leafbag' }); toast('なにか 落ちてきた！'); } }
    else if (Math.random() < 0.45) { const p = freeSpotNear(tr.x, tr.y + 1); if (p) day.drops.push({ ...p, id: 'branch' }); }
  }
  // 木にとまっていた虫は逃げる

}
function hitRock(rk) {

}
function chopTree(tr) {

}
function digUp(di, d) {
  G.day.digs.splice(di, 1);
  if (d.kind === 'money') { G.leaf += 1000; SFX.coin(); toast('光る地面から 1,000 リーフ！'); updateHud(); save(); return; }
  const fossils = FOSSILS.filter(f => f.id !== 'x_atama' || Math.random() < 0.3);
  const f = pick(fossils);

// ---- 釣り ----
function castTarget() {
  const [dx, dy] = DIRS[player.face];
  for (const dist of [48, 64, 36, 80]) {
    const x = player.x + dx * dist, y = player.y + dy * dist - (dy === 0 ? 6 : 0);
    if (waterAtPx(x, y)) return { x, y };
  }
  return null;
}
function castRod() {
  const tp = castTarget();
  if (!tp) { toast('水のほうを 向いて投げよう'); return; }
  SFX.splash();
  fishing = { x: tp.x, y: tp.y, state: 'float', t: 0, fish: null, nibbles: 0, wait: rand(1, 3) };
  pop(tp.x, tp.y, 'rgba(255,255,255,.9)');
}
function reelIn() {
  const F = fishing;
  if (F.state === 'bite') {
    const f = F.fish.f;
    shadows = shadows.filter(s => s !== F.fish);
    fishing = null;
    if (!canAdd(f.id)) { toast('ポケットが いっぱいで 逃がした…'); return; }
    addItem(f.id);
    SFX.catch();
    const line = catchLine(f, 'fish');
    say({ name: '', color: '#fff' }, [line]);
    save();
    return;
  }
  if (F.fish && F.state !== 'approach') { F.fish.state = 'flee'; toast('逃げられた…'); }
  else if (F.fish) F.fish.state = 'swim';
  fishing = null;
}
function catchLine(it, kind) {
  const quips = {
    f_same: 'サメを つりあげた！ こわ〜！', f_madai: 'マダイを つりあげた！ めでたい！', f_fugu: 'フグを つりあげた！ ぷくっとふくれた！',
    f_koi: 'コイを つりあげた！ 恋のよかん？', f_tako: 'タコを つりあげた！ 8本足で じたばた！', f_iwana: 'イワナを つりあげた！ 渓流の女王！',
    b_kabuto: 'カブトムシを つかまえた！ 夏の王様だ！', b_kuwagata: 'ノコギリクワガタを つかまえた！ かっこいい〜！', b_oomurasaki: 'オオムラサキを つかまえた！ 日本の国蝶！',
    b_ari: 'アリを つかまえた！ ちいさいけど 力もち！', b_hotaru: 'ホタルを つかまえた！ 光ってる…！',
  };
  if (quips[it.id]) return quips[it.id];
  return kind === 'fish' ? `${it.name}を つりあげた！` : `${it.name}を つかまえた！`;
}
function updateFishing(dt) {
  const F = fishing; if (!F) return;
  F.t += dt;
  if (F.state === 'float') {
    F.wait -= dt;
    if (F.wait <= 0 && !F.fish) {
      let best = null, bd = 150;
      for (const s of shadows) { if (s.state !== 'swim') continue; const d = Math.hypot(s.x - F.x, s.y - F.y); if (d < bd) { bd = d; best = s; } }
      if (best) { F.fish = best; best.state = 'approach'; F.state = 'approach'; }
      else F.wait = rand(1, 2);
    }
  } else if (F.state === 'approach') {
    const s = F.fish;
    const a = Math.atan2(F.y - s.y, F.x - s.x);
    s.dir = a;
    const d = Math.hypot(F.x - s.x, F.y - s.y);
    const target = 6 + s.f.size * 2;
    if (d > target) { s.x += Math.cos(a) * 22 * dt; s.y += Math.sin(a) * 22 * dt; }
    else { F.state = 'nibble'; F.nibbles = Math.floor(rand(1, 4)); F.next = rand(0.8, 1.5); }
  } else if (F.state === 'nibble') {
    F.next -= dt;
    if (F.next <= 0) {
      if (F.nibbles > 0) { F.nibbles--; F.dip = 0.25; SFX.nibble(); F.next = rand(0.9, 1.6); }
      else { F.state = 'bite'; F.biteT = 0.7; F.dip = 0.7; SFX.bite(); pop(F.x, F.y, 'rgba(255,255,255,.9)'); try { navigator.vibrate && navigator.vibrate(80); } catch (e) {} }
    }
  } else if (F.state === 'bite') {
    F.biteT -= dt;
    if (F.biteT <= 0) { F.fish.state = 'flee'; fishing = null; toast('逃げられた…'); }
  }
  if (F.dip) F.dip = Math.max(0, F.dip - dt);
}

function tryNet() {
  const p = frontPoint(24);
  for (const b of bugs) {
    if (b.flee) continue;

// =============== 住人 ===============
let villagerStates = [];
function initVillagers() {
  villagerStates = VILLAGERS.map(v => {
    const h = W.buildings.find(b => b.vid === v.id);
    const hx = (h.door.x) * T + 16, hy = (h.door.y + 1) * T + 16;
    return { v, home: h, x: hx, y: hy, face: 'down', walk: 0, moving: false, tx: hx, ty: hy, wait: rand(1, 4), out: true, talkT: 0 };
  });
}
function villagerAwake() { const h = now().getHours(); return h >= 6 && h < 22; }
function updateVillagers(dt) {
  const awake = villagerAwake();
  for (const s of villagerStates) {
    s.out = awake && player.scene === 'island';
    if (!s.out) continue;
    if (s.talkT > 0) { s.talkT -= dt; s.moving = false; continue; }
    s.wait -= dt;
    const dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy);
    if (d > 2) {
      const sp = 38 * dt;
      const nx = s.x + dx / d * Math.min(sp, d), ny = s.y + dy / d * Math.min(sp, d);
      if (!blockedForNpc(nx, ny) && Math.hypot(nx - player.x, ny - player.y) > 18) { s.x = nx; s.y = ny; s.moving = true; s.walk += dt * 8; s.face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
      else { s.tx = s.x; s.ty = s.y; s.moving = false; }
    } else {
      s.moving = false;
      if (s.wait <= 0) {
        s.wait = rand(2, 7);
        const home = s.home;
        for (let k = 0; k < 10; k++) {
          const tx = (home.door.x + Math.floor(rand(-7, 8))) * T + 16, ty = (home.door.y + Math.floor(rand(-4, 7))) * T + 16;
          if (!blockedForNpc(tx, ty)) { s.tx = tx; s.ty = ty; break; }
        }
      }
    }
  }
}
function blockedForNpc(px, py) {
  const tx = Math.floor(px / T), ty = Math.floor(py / T);
  const t = tileAt(tx, ty);
  if (!isLand(t) || W.occ[ty][tx]) return true;
  return false;
}

function talkTo(s) {

  if (uniq.length) choices.push({ label: `寄付する（${uniq.length}しゅるい）`, fn: () => {
    const names = [];
    for (const { s } of uniq) { const cat = ITEMS[s.id].cat; G.museum[cat][s.id] = true; names.push(ITEMS[s.id].name); removeItem(s.id); }
    SFX.catch();
    say(sp, [`ほっほう！ ${names.slice(0, 3).join('、')}${names.length > 3 ? ' など' : ''}… すばらしい！`, 'さっそく てんじ しておこう。ありがとう、ありがとう。']);
    save();
  } });
  choices.push({ label: 'てんじを見る', fn: () => openDex() });
  choices.push({ label: 'なんでもない', fn: () => say(sp, ['いつでも おいで。ほっほう。']) });
  say(sp, [uniq.length ? 'ほっほう、なにか めずらしいものを 持っているようじゃな。' : `ようこそ はくぶつかんへ。館長の ゲンブじゃ。`, '虫や 魚や 化石を 寄付してくれると うれしいのう。'], choices);
}

// =============== 家の中 ===============
function enterRoom() {
  player.scene = 'room';
  room = { occ: Array.from({ length: ROOM_H }, () => Array(ROOM_W).fill(null)) };
  room.occ[2][1] = 'bench';
  for (const it of G.room) if (room.occ[it.y] && room.occ[it.y][it.x] == null) room.occ[it.y][it.x] = it;
  player.outside = { x: player.x, y: player.y };
  player.x = 4 * T + 16; player.y = (ROOM_H - 1) * T + 16; player.face = 'up';
  bugs = []; shadows = []; fishing = null;
}
function exitRoom() {
  SFX.door();
  player.scene = 'island';
  const h = W.buildings.find(b => b.kind === 'house');
  player.x = h.door.x * T + 16; player.y = (h.door.y + 1) * T + 10; player.face = 'down';
  room = null;
  save();
}
function roomAction() {
  const ft = frontTile();
  const ty = Math.floor(player.y / T);
  if (player.face === 'down' && ty === ROOM_H - 1 && ft.x === 4) { exitRoom(); return; }
  const o = room.occ[ft.y] && room.occ[ft.y][ft.x];
  if (o === 'bench') { openCraft(); return; }
  if (o) {
    const it = ITEMS[o.id];
    say({ name: '', color: '#fff' }, [`${it.name}だ。`], [
      { label: 'ポケットに しまう', fn: () => { if (pocketsFull()) { toast('ポケットが いっぱい！'); return; } room.occ[ft.y][ft.x] = null; G.room = G.room.filter(r => r !== o); addItem(o.id); SFX.pick(); save(); } },
      { label: 'そのまま', fn: () => {} },
    ]);
  }
}
function placeFurniture(idx) {
  if (player.scene !== 'room') { toast('家の中で 置けるよ'); return; }
  const ft = frontTile();
  if (ft.x < 0 || ft.x >= ROOM_W || ft.y < 2 || ft.y >= ROOM_H || room.occ[ft.y][ft.x] != null) { toast('前に 置けるばしょが ないよ'); return; }
  if (ft.y === ROOM_H - 1 && ft.x === 4) { toast('入口には 置けないよ'); return; }
  const s = G.pockets[idx];
  const it = { id: s.id, x: ft.x, y: ft.y };
  removeItem(s.id);
  G.room.push(it); room.occ[ft.y][ft.x] = it;
  SFX.pick(); closePanel(); save();
}

      }, 'btn', !sel.size);

      d.innerHTML = `${it.name}<small>${catName}・売ると ${priceOf(s.id).toLocaleString()} リーフ</small>`;
      if (mode === 'gift') { btn('これを あげる', () => { closePanel(); opt.onPick(cur); }); }
      else {
        if (it.cat === 'furn') btn('へやに 置く', () => placeFurniture(cur), 'btn', player.scene !== 'room');
        if (it.cat === 'shirt') btn('着る', () => { const old = G.shirt; G.shirt = s.id; G.pockets[cur] = old && ITEMS[old] ? { id: old, n: 1 } : null; SFX.pick(); save(); closePanel(); toast(`${it.name}に 着がえた！`); });
        if (it.id === 'leafbag') btn('あける', () => { G.pockets[cur] = null; give('leafbag'); closePanel(); });
        btn('すてる', () => {

// =============== 更新 ===============
let camX = 0, camY = 0, zoom = 2, VW = 0, VH = 0, dpr = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = VW * dpr; cv.height = VH * dpr;
  zoom = clamp(Math.min(VW / (11 * T), VH / (9 * T)), 1, 2.6);
}
window.addEventListener('resize', resize);
resize();

let tAll = 0, bugTimer = 0, shadowTimer = 0, hudTimer = 0, saveTimer = 0, rain = [];
function update(dt) {
  tAll += dt;
  updateDialog(dt);
  // 日付がかわったら島をリセット
  hudTimer -= dt;
  if (hudTimer <= 0) {
    hudTimer = 1;
    if (dailyReset()) { toast('あたらしい 1日が はじまった！'); bugs = []; shadows = []; if (season() !== terrainSeason) buildTerrain(); }
    updateHud();
  }
  saveTimer -= dt; if (saveTimer <= 0) { saveTimer = 10; save(); }

  // 動く
  if (canAct() && !fishing) {
    const v = inputVec();
    const moving = Math.hypot(v.x, v.y) > 0.1;
    player.moving = moving && !player.act;
    player.running = v.run;
    if (player.moving) {
      const sp = (v.run ? 150 : 88) * dt;
      const nx = player.x + v.x * sp, ny = player.y + v.y * sp;
      if (!blockedAt(nx, player.y)) player.x = nx;
      if (!blockedAt(player.x, ny)) player.y = ny;
      player.walk += dt * (v.run ? 12 : 8);
      player.face = Math.abs(v.x) > Math.abs(v.y) ? (v.x > 0 ? 'right' : 'left') : (v.y > 0 ? 'down' : 'up');
      // 家から出る
      if (player.scene === 'room' && player.y > (ROOM_H - 1) * T + 22 && Math.floor(player.x / T) === 4 && player.face === 'down') exitRoom();
    }
  } else if (fishing) {
    const v = inputVec();
    if (Math.hypot(v.x, v.y) > 0.5) { if (fishing.fish) fishing.fish.state = 'swim'; fishing = null; }
    player.moving = false;
  } else player.moving = false;
  if (player.scene === 'room') {
    player.x = clamp(player.x, 16, ROOM_W * T - 16);
  }

  if (player.act) {
    player.actT += dt;
    if (player.act === 'net' && player.actT > 0.18 && !player.netDone) { player.netDone = true; tryNet(); }
    if (player.actT > 0.35) { player.act = null; player.netDone = false; }
  }

  if (player.scene === 'island') {
    updateVillagers(dt);
    // 虫
    bugTimer -= dt;
    if (bugTimer <= 0) { bugTimer = rand(1.5, 3.5); if (bugs.length < 6) spawnBug(); }
    for (const b of bugs) {
      b.t += dt; b.life -= dt;
      const d = Math.hypot(b.x - player.x, b.y - player.y);
      if (!b.flee && ((player.running && player.moving && d < 90) || (d < 26 && player.moving && b.b.where === 'fly'))) b.flee = true;
      if (b.flee) {
        const a = Math.atan2(b.y - player.y, b.x - player.x);
        b.x += Math.cos(a) * 140 * dt; b.y += Math.sin(a) * 140 * dt - 40 * dt;
        b.life = Math.min(b.life, 2);
      } else if (b.b.where === 'fly' || (b.b.where === 'flower' && b.b.kind !== 'lady')) {
        const r = b.b.where === 'fly' ? 50 : 14;
        b.x = b.hx + Math.sin(b.t * 0.7) * r + Math.sin(b.t * 2.1) * 6;
        b.y = b.hy + Math.cos(b.t * 0.9) * r * 0.6 + Math.sin(b.t * 3) * 4 - 10;
      } else if (b.b.where === 'ground' || b.b.where === 'beach') {
        if (Math.sin(b.t * 1.3) > 0.7) { b.x += Math.cos(b.t) * 18 * dt; b.y += Math.sin(b.t * 0.7) * 10 * dt; }
      }
    }
    bugs = bugs.filter(b => b.life > 0 && Math.abs(b.x - player.x) < 700 && Math.abs(b.y - player.y) < 500);
    // 魚影
    shadowTimer -= dt;
    if (shadowTimer <= 0) { shadowTimer = rand(1.5, 3); if (shadows.length < 5) spawnShadow(); }
    for (const s of shadows) {
      s.t += dt; s.life -= dt;
      if (s.state === 'swim') {
        s.dir += Math.sin(s.t * 0.5) * dt * 0.8;
        const nx = s.x + Math.cos(s.dir) * 12 * dt, ny = s.y + Math.sin(s.dir) * 12 * dt;
        if (waterAtPx(nx, ny) && waterAtPx(nx + Math.cos(s.dir) * 12, ny + Math.sin(s.dir) * 12)) { s.x = nx; s.y = ny; } else s.dir += Math.PI * 0.6;
      } else if (s.state === 'flee') {
        s.x += Math.cos(s.dir + Math.PI) * 80 * dt; s.y += Math.sin(s.dir + Math.PI) * 80 * dt; s.life = Math.min(s.life, 0.8);
      }
    }
    shadows = shadows.filter(s => s.life > 0 && (s.state !== 'swim' || Math.abs(s.x - player.x) < 700));
    updateFishing(dt);
    for (const tr of W.trees) if (tr.shakeT) tr.shakeT = Math.max(0, tr.shakeT - dt);
    for (const rk of W.rocks) if (rk.shakeT) rk.shakeT = Math.max(0, rk.shakeT - dt);
  }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  if (G.day.weather === 'rain' && player.scene === 'island') {
    while (rain.length < 120) rain.push({ x: rand(0, VW), y: rand(-VH, 0), v: rand(500, 800) });
    for (const r of rain) { r.y += r.v * dt; r.x -= r.v * 0.15 * dt; if (r.y > VH) { r.y = rand(-40, 0); r.x = rand(0, VW + 100); } }
  } else rain = [];

  // Aボタンの説明
  const lbl = contextLabel();
  const h = $('a-hint');
  if (h.textContent !== lbl) h.textContent = lbl;
  h.hidden = !lbl;
}

// =============== 描画 ===============
function lightFor(h, m) {
  const t = h + m / 60;
  // [時刻, 色, 濃さ]
  const keysL = [[0, '#1B2350', .55], [4.5, '#1B2350', .5], [6, '#F2A0A8', .18], [8, '#FFFFFF', 0], [16, '#FFFFFF', 0], [17.5, '#F29048', .2], [19, '#5A3A7A', .35], [20.5, '#1B2350', .5], [24, '#1B2350', .55]];
  for (let i = 0; i < keysL.length - 1; i++) {
    const [a, ca, pa] = keysL[i], [b, cb, pb] = keysL[i + 1];
    if (t >= a && t <= b) { const k = (t - a) / (b - a); return { color: k < 0.5 ? ca : cb, a: lerp(pa, pb, k) }; }
  }
  return { color: '#1B2350', a: .5 };
}
function treeColors(se, kind) {
  if (kind === 'pine') return se === 'winter' ? ['#4E7A5A', '#EEF3F6'] : ['#3E7A4A', '#2F6A3E'];
  if (se === 'spring') return now().getMonth() === 3 && kind === 'tree' ? ['#F7C3D4', '#EFA9C0'] : ['#7CC45A', '#62AE48'];
  if (se === 'summer') return ['#4FA848', '#3D943A'];
  if (se === 'autumn') return kind === 'fruit' ? ['#C8A040', '#B08A30'] : ['#E0843A', '#C86A2A'];
  return ['#9AAE9A', '#EEF3F6'];
}
function drawTree(c, tr, x, y) {
  const se = season();
  const sh = tr.shakeT ? Math.sin(tr.shakeT * 40) * 3 : 0;
  c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(x, y + 12, 16, 6, 0, 0, 7); c.fill();
  if (tr.kind === 'palm') {
    c.strokeStyle = '#A8784A'; c.lineWidth = 6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x, y + 10); c.quadraticCurveTo(x + 6, y - 14, x + sh + 2, y - 36); c.stroke();
    c.fillStyle = se === 'winter' ? '#6E9A6A' : '#4FA848';

}
function confirmNew() {
  const p = $('title-panel');
  p.innerHTML = `<h2>はじめから あそぶ？</h2><p>いまの 島の データは 消えてしまいます。</p><div class="actions"><button class="btn" type="button" id="cn-y">はじめから</button><button class="btn ghost" type="button" id="cn-n">やめる</button></div>`;
  $('cn-y').addEventListener('click', newGameForm);
  $('cn-n').addEventListener('click', titleScreen);
}
function newGameForm() {
  const p = $('title-panel');
  let hair = HAIRS[0], shirt = SHIRT_START[0];
  p.innerHTML = `<h2>あなたのことを 教えてね</h2>
    <form id="nf" style="display:grid;gap:14px">
      <label class="field">なまえ<input id="nf-name" maxlength="8" autocomplete="off" placeholder="たとえば そうた" required></label>
      <label class="field">島のなまえ<input id="nf-island" maxlength="8" autocomplete="off" placeholder="こもれび" value="こもれび"></label>
      <div class="field">かみの色<div class="swatches" id="nf-hair"></div></div>
      <div class="field">ふくの色<div class="swatches" id="nf-shirt"></div></div>
      <button class="btn" type="submit">島へ 出発！</button>
    </form>`;
  const sw = (box, list, getSel, setSel) => {
    box.innerHTML = '';
    for (const c of list) { const b = document.createElement('button'); b.type = 'button'; b.className = 'sw' + (getSel() === c ? ' on' : ''); b.style.background = c; b.setAttribute('aria-label', c); b.addEventListener('click', () => { setSel(c); sw(box, list, getSel, setSel); }); box.appendChild(b); }
  };
  sw($('nf-hair'), HAIRS, () => hair, c => hair = c);
  sw($('nf-shirt'), SHIRT_START, () => shirt, c => shirt = c);
  $('nf').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('nf-name').value.trim() || 'あなた';
    const island = $('nf-island').value.trim().replace(/島$/, '') || 'こもれび';
    const s = defaultSave({ name, island, hair, shirt });
    startGame(s, true);
  });
  $('nf-name').focus();
}
function startGame(s, fresh) {
  G = s;
  if (!G.shirt) G.shirt = SHIRT_START[0];
  W = genWorld(G.seed);
  dailyReset();
  buildTerrain();
  initVillagers();
  if (fresh || !G.x) {
    const h = W.buildings.find(b => b.kind === 'house');
    G.x = h.door.x * T + 16; G.y = (h.door.y + 1) * T + 12; G.face = 'down';
  }
  player.x = G.x; player.y = G.y; player.face = G.face || 'down'; player.scene = 'island';
  if (blockedAt(player.x, player.y)) { const h = W.buildings.find(b => b.kind === 'house'); player.x = h.door.x * T + 16; player.y = (h.door.y + 1) * T + 12; }
  $('title').hidden = true; $('hud').hidden = false; $('controls').hidden = false;
  buildToolbar(); updateHud(); save();
  const sp = { name: NPC.marin.name, color: NPC.marin.color, voice: NPC.marin.voice };
  if (fresh) {
    G.met = true;
    say(sp, [
      `${G.name}さん、${G.island}島へ ようこそ〜！ よろず屋の マリンです！`,
      'この島では、本物と おなじ 時間が 流れているんです。朝は朝、夜は夜。季節も かわりますよ〜。',
      '画面を なぞると 歩けます。Aボタンで 話したり、ひろったり、木を ゆらしたり できます。',
      '下の 道具ボタンで あみや つりざおに もちかえてね。虫や魚は はくぶつかんの ゲンブさんが よろこびますよ〜。',
      'つかまえたものは よろず屋で 売れます。家に 帰れば DIYも できます。それでは、島ぐらしを 楽しんで〜！',
    ]);
  } else {
    const hr = now().getHours();
    toast(`${hr < 11 ? 'おはよう' : hr < 18 ? 'こんにちは' : 'こんばんは'}、${G.name}さん！`);
  }
}
titleScreen();
requestAnimationFrame(loop);
})();
</script>
