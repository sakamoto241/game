<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d29"><title>ノアの一閃｜その一撃で、夜を裂け。</title><meta name="description" content="斬る、かわす、弾き返す。ノアが挑むボス戦アクション。スマホ・PC対応、無料・登録不要。"><meta property="og:title" content="ノアの一閃"><meta property="og:description" content="斬る、かわす、弾き返す。その一撃で、夜を裂け。"><meta property="og:image" content="https://sakamoto241.github.io/game/noa-og.png?v=5"><link rel="preload" as="image" href="noa-pose-5.webp" fetchpriority="high"><link rel="stylesheet" href="noa.css?v=51"></head><body><main class="game">
<header><div><small>NOA / NIGHTFALL</small><h1>ノアの一閃</h1></div><div class="header-right"><span id="difficulty">本番</span><button id="menu" aria-label="休憩と操作説明">Ⅱ</button></div></header>
<section class="boss-ui" aria-label="ボスの体力"><div><span id="boss-name">夜の守り人</span><span id="phase" class="phase-pips" role="img" aria-label="第1形態"><i class="lit"></i><i></i><i></i></span></div><div class="boss-track" role="progressbar" aria-label="夜の守り人の体力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="boss-lag"></i><i id="boss-fill"></i></div><div id="stagger" class="stagger-track" role="img" aria-label="守りを崩すゲージ"><i id="stagger-fill"></i></div></section>
<section class="stage" aria-label="ボス戦の画面"><canvas id="world" aria-label="方向ボタンで移動、跳ぶでジャンプ、斬るを上下にスワイプして空中技"></canvas><div class="battle-info"><div id="health" role="img" aria-label="体力6"><i></i><i></i><i></i><i></i><i></i><i></i></div><span id="time">00:00</span></div><button id="jump" aria-label="ジャンプ"><span>跳ぶ</span></button><button id="ultimate" disabled><span>一閃</span><i id="gauge-fill"></i></button></section>
