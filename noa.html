<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d29"><title>ノアの一閃｜その一撃で、夜を裂け。</title><meta name="description" content="斬る、かわす、弾き返す。ノアが挑むボス戦アクション。スマホ・PC対応、無料・登録不要。"><meta property="og:title" content="ノアの一閃"><meta property="og:description" content="斬る、かわす、弾き返す。その一撃で、夜を裂け。"><meta property="og:image" content="https://sakamoto241.github.io/game/noa-og.png"><link rel="preload" as="image" href="noa-pose-5.webp" fetchpriority="high"><link rel="stylesheet" href="noa.css?v=1"></head><body><main class="game">
<header><div><small>NOA / NIGHTFALL</small><h1>ノアの一閃</h1></div><div class="header-right"><span id="difficulty">本番</span><button id="menu" aria-label="休憩と操作説明">Ⅱ</button></div></header>
<section class="boss-ui" aria-label="ボスの体力"><div><span id="boss-name">夜の守り人</span><span id="phase">PHASE 01</span></div><div class="boss-track" role="progressbar" aria-label="夜の守り人の体力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="boss-lag"></i><i id="boss-fill"></i></div></section>
<section class="stage" aria-label="ボス戦の画面"><canvas id="world" aria-label="方向ボタンで移動、斬るで攻撃、回避でダッシュ"></canvas><div class="battle-info"><div id="health" role="img" aria-label="体力6"><i></i><i></i><i></i><i></i><i></i><i></i></div><span id="time">00:00</span></div><div class="style-meter"><strong id="combo">0</strong><small>CHAIN</small><span id="style">刃を、研ぎ澄ませ。</span></div><div id="callout" role="status" aria-live="polite"></div><div id="warning-text">金色の予告を見て、直前に回避。</div><button id="ultimate" disabled><span>一閃</span><small id="gauge">0%</small><i id="gauge-fill"></i></button></section>
<section class="console"><div class="controls"><div class="movement"><button data-move="left" aria-label="左に移動">〈</button><button data-move="right" aria-label="右に移動">〉</button></div><div class="combat"><button id="dodge"><span>回避</span><small id="dodge-label">直前でスロー</small><i id="dodge-cd"></i></button><button id="attack"><span>斬る</span><small>押して連撃</small></button></div></div><p>弾が近づく瞬間に「斬る」で弾き返す。光が満ちたら「一閃」。</p></section></main>
<dialog id="panel"><div id="paper"></div></dialog>
<script src="noa-core.js?v=1"></script><script src="noa.js?v=2"></script></body></html>
