<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9d7b6"><title>灰の砲手</title><link rel="stylesheet" href="style.css"></head><body><main id="game"><canvas id="world" width="1000" height="620"></canvas><header><div><b>灰の砲手</b><span id="stage"></span></div><div id="boss-hud" hidden><span id="boss-name">鉄面の砲手</span><div class="bar"><i id="boss-hp"></i></div></div><button id="pause" aria-label="一時停止">Ⅱ</button></header><div id="hint" role="status"></div><div id="health"><span>守衛の炉</span><div class="bar"><i id="hp"></i></div><small id="hp-text"></small></div><div id="stick" aria-label="移動スティック"><span id="knob"></span></div><div id="skills"><button data-skill="slam"><b>叩きつけ</b><small>J</small></button><button data-skill="dash"><b>突進</b><small>K</small><em></em></button><button data-skill="dodge"><b>回避</b><small>SPACE</small><em></em></button></div><div id="overlay"><section id="panel"></section></div><div id="rotate"><b>横向きで、砲手と対峙する。</b><p>端末を横にしてください</p></div></main><script src="core.js"></script><script src="art.js"></script><script src="game.js"></script></body></html>
