<title>ぽわぽわ探検隊</title>
<meta name="description" content="コンパスで探索して、属性バトルでぽわもんを捕まえて育てる、絵本風モンスター収集RPG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  /* 絵本の世界で固定した配色（ライト/ダーク共通） */
  :root {
    color-scheme: light;
    --paper: #FFF7E8;
    --paper-2: #F6E8CC;
    --ink: #5B4336;
    --muted: #9A8170;
    --line: #6A4B3C;
    --fire: #F0806A;
    --water: #6FB4E6;
    --grass: #86C06A;
    --gold: #F5C44E;
    --mint: #7ED6CF;
    --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: #2F4A3E; }
  body { font-family: var(--font); color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  button { font-family: inherit; color: inherit; }

  /* 画面の列（縦長スマホの幅） */
  .col { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100vw, 62vh, 480px); pointer-events: none; }
  .col > * { pointer-events: auto; }
  .scr { position: absolute; inset: 0; pointer-events: none; }
  .scr > * { pointer-events: auto; }

  .card {
    background: var(--paper); border: 3px solid var(--line); border-radius: 22px;
    box-shadow: 0 5px 0 rgba(106,75,60,.35);
  }
  .btn {
    border: 3px solid var(--line); border-radius: 99px; cursor: pointer;
    background: var(--mint); font-weight: 900; font-size: 18px; padding: 12px 22px;
    box-shadow: 0 5px 0 var(--line);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
  .btn.gold { background: var(--gold); }
  .btn.white { background: var(--paper); }
  .btn.small { font-size: 14px; padding: 7px 14px; box-shadow: 0 3px 0 var(--line); }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn:focus-visible, .ibtn:focus-visible, .skill:focus-visible, .mcard:focus-visible, .tab:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .topbar {
    position: absolute; left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border: 3px solid var(--line);
    border-radius: 99px; padding: 4px 12px 4px 6px; font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums;
    box-shadow: 0 3px 0 rgba(106,75,60,.3);
  }
  .chip i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: inline-block; }
  .chip i.coin { background: radial-gradient(circle at 35% 35%, #FFE69A, var(--gold)); }
  .chip i.ball { background: linear-gradient(#F59AB0 50%, #fff 50%); }
  .chip i.berry { background: radial-gradient(circle at 35% 35%, #D9B8FF, #9B6BE0); }

  /* 吹き出し（ガイド） */
  .guide {
    position: absolute; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center;
    background: var(--paper); border: 3px solid var(--line); border-radius: 24px; padding: 10px 16px 10px 10px;
    box-shadow: 0 5px 0 rgba(106,75,60,.3); cursor: pointer;
  }
  .guide canvas { width: 58px; height: 58px; flex: none; }
  .guide p { margin: 0; font-weight: 700; font-size: 16px; line-height: 1.55; }
  .guide b { color: #F08A3A; }

  /* 探索 */
  .progress { position: absolute; left: 12px; right: 12px; top: calc(58px + env(safe-area-inset-top, 0px)); }
  .pbar { height: 20px; border: 3px solid var(--line); border-radius: 99px; background: #6A4B3C; overflow: hidden; position: relative; }
  .pbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#FFE38A, #F5C44E); border-right: 3px solid var(--line); transition: width .35s; }
  .pbar b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: #fff; text-shadow: 0 1px 0 var(--line); font-weight: 900; }
  .area-name { text-align: center; font-weight: 900; font-size: 15px; color: #fff; text-shadow: 0 2px 0 var(--line), 0 0 6px rgba(0,0,0,.3); margin-bottom: 4px; }
  .compass {
    position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--line); cursor: pointer; padding: 0;
    background: radial-gradient(circle at 40% 35%, #FFF2C0, var(--gold)); box-shadow: 0 6px 0 var(--line);
    display: grid; place-items: center;
  }
  .compass:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 2px 0 var(--line); }
  .compass[disabled] { filter: grayscale(.7); opacity: .6; }
  .compass canvas { width: 80px; height: 80px; }
  .side-btn { position: absolute; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
  .ibtn {
    width: 64px; height: 64px; border-radius: 20px; border: 3px solid var(--line); background: var(--paper); cursor: pointer;
    display: grid; place-items: center; font-weight: 900; font-size: 12px; box-shadow: 0 4px 0 var(--line); padding: 4px;
  }
  .ibtn canvas { width: 38px; height: 38px; }

  /* バトル */
  .gauge { display: flex; align-items: center; gap: 6px; }
  .gauge .num {
    width: 38px; height: 38px; flex: none; display: grid; place-items: center; font-weight: 900; font-size: 18px; color: var(--ink);
    background: radial-gradient(circle at 40% 35%, #FFE7A0, #E8A640); border: 3px solid var(--line); transform: rotate(45deg); border-radius: 8px;
  }
  .gauge .num span { transform: rotate(-45deg); }
  .segs { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; background: var(--line); border: 3px solid var(--line); border-radius: 99px; padding: 2px; }
  .segs i { height: 14px; border-radius: 6px; background: #8B6A55; }
  .segs i.on { background: linear-gradient(#FFF0A8, #E9C84A); }
  .segs i.fill { background: #B89A6A; }
  .b-top { position: absolute; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); display: grid; gap: 6px; }
  .b-top .gauge { flex-direction: row-reverse; }
  .b-bottom { position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
  .skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .skill {
    border: 3px solid var(--line); border-radius: 18px; cursor: pointer; padding: 8px 6px 6px; background: var(--paper);
    box-shadow: 0 4px 0 var(--line); display: grid; gap: 3px; justify-items: center; position: relative;
  }
  .skill b { font-size: 13px; line-height: 1.2; }
  .skill small { font-size: 11px; color: var(--muted); font-weight: 700; }
  .skill .cost { display: flex; gap: 2px; }
  .skill .cost i { width: 10px; height: 10px; transform: rotate(45deg); border: 2px solid var(--line); background: var(--gold); border-radius: 2px; }
  .skill.fire { background: #FFE4DC; } .skill.water { background: #DDF0FF; } .skill.grass { background: #E5F5D8; }
  .skill.ready { animation: glow 1s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 4px 0 var(--line), 0 0 0 4px rgba(245,196,78,.8); } }
  .skill[disabled] { opacity: .5; cursor: default; animation: none; }
  .brow { display: flex; gap: 8px; align-items: center; }
  .team { display: flex; gap: 6px; }
  .tbtn { width: 52px; height: 52px; border-radius: 16px; border: 3px solid var(--line); background: var(--paper); padding: 0; cursor: pointer; position: relative; overflow: hidden; }
  .tbtn canvas { width: 100%; height: 100%; }
  .tbtn.on { background: #FFE9A8; }
  .tbtn[disabled] { filter: grayscale(1); opacity: .5; }
  .tbtn i { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 5px; border-radius: 3px; background: #ddd; overflow: hidden; }
  .tbtn i b { display: block; height: 100%; background: #6CC46A; }
  .ballbtn { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  /* パネル */
  .panel { position: absolute; left: 10px; right: 10px; top: calc(60px + env(safe-area-inset-top, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); overflow: auto; padding: 16px; display: grid; gap: 12px; align-content: start; }
  .panel h2 { margin: 0; text-align: center; font-weight: 900; font-size: 22px; text-wrap: balance; }
  .panel p.sub { margin: 0; text-align: center; color: var(--muted); font-size: 13px; font-weight: 700; }
  .mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .mcard { border: 3px solid var(--line); border-radius: 16px; background: #fff; padding: 6px 4px; cursor: pointer; display: grid; justify-items: center; gap: 2px; position: relative; }
  .mcard canvas { width: 72px; height: 72px; }
  .mcard b { font-size: 13px; }
  .mcard small { font-size: 11px; color: var(--muted); font-weight: 700; }
  .mcard.inteam { background: #FFF1C2; }
  .mcard .tag { position: absolute; top: 4px; left: 4px; font-size: 10px; font-weight: 900; background: var(--gold); border: 2px solid var(--line); border-radius: 99px; padding: 0 6px; }
  .mcard.unknown { background: var(--paper-2); cursor: default; }
  .el { display: inline-block; font-size: 11px; font-weight: 900; color: #fff; border: 2px solid var(--line); border-radius: 99px; padding: 0 7px; text-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .el.fire { background: var(--fire); } .el.water { background: var(--water); } .el.grass { background: var(--grass); }
  .detail { display: grid; gap: 10px; }
  .detail .top { display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: center; }
  .detail canvas.big { width: 110px; height: 110px; }
  .stats { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; font-size: 13px; font-weight: 700; align-items: center; font-variant-numeric: tabular-nums; }
  .stats .bar { height: 8px; background: var(--paper-2); border-radius: 4px; overflow: hidden; border: 2px solid var(--line); }
  .stats .bar i { display: block; height: 100%; }
  .work { background: #EAF7F5; border: 2px dashed var(--mint); border-radius: 12px; padding: 8px 10px; font-size: 13px; font-weight: 700; }
  .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .tab { border: 3px solid var(--line); border-radius: 99px; background: #fff; font-weight: 900; font-size: 13px; padding: 5px 12px; cursor: pointer; }
  .tab.on { background: var(--gold); }
  .navbar { position: absolute; left: 10px; right: 10px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .navbar .ibtn { width: 100%; height: 70px; }
  .areas { display: grid; gap: 10px; }
  .area { display: grid; grid-template-columns: 76px 1fr auto; gap: 10px; align-items: center; border: 3px solid var(--line); border-radius: 18px; padding: 8px; background: #fff; }
  .area canvas { width: 76px; height: 56px; border-radius: 12px; border: 2px solid var(--line); }
  .area b { display: block; font-size: 16px; }
  .area small { font-size: 12px; color: var(--muted); font-weight: 700; }
  .area.locked { opacity: .55; }
  .shop { display: grid; gap: 8px; }
  .shopi { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; border: 3px solid var(--line); border-radius: 16px; background: #fff; padding: 8px 12px; font-weight: 700; font-size: 14px; }
  .shopi small { display: block; color: var(--muted); font-size: 12px; }

  /* タイトル・スターター */
  .center { position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); display: grid; gap: 16px; justify-items: center; text-align: center; }
  .logo { font-weight: 900; font-size: clamp(38px, 12vw, 56px); color: #fff; line-height: 1.05; text-shadow: 0 4px 0 var(--line), 0 0 0 var(--line); -webkit-text-stroke: 3px var(--line); paint-order: stroke fill; letter-spacing: .02em; }
  .logo small { display: block; font-size: .36em; -webkit-text-stroke: 2px var(--line); letter-spacing: .25em; margin-top: 8px; color: #FFE38A; }
  .pick-card { position: absolute; left: 12px; right: 12px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); padding: 18px; display: grid; gap: 12px; }
  .pick-card p { margin: 0; font-weight: 700; font-size: 16px; line-height: 1.6; }
  .pick-card b.nm { color: #F08A3A; }
  .x { justify-self: center; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--line); background: #fff; font-weight: 900; font-size: 20px; cursor: pointer; }
  .label-pill { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border: 3px solid var(--line); border-radius: 99px; padding: 6px 18px; font-weight: 900; font-size: 16px; white-space: nowrap; }

  .toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 50; pointer-events: none;
    font-weight: 900; font-size: clamp(26px, 8vw, 38px); color: #fff; -webkit-text-stroke: 3px var(--line); paint-order: stroke fill; text-shadow: 0 4px 0 var(--line); white-space: nowrap; }
  .modal { position: absolute; inset: 0; background: rgba(60,40,30,.45); display: grid; place-items: center; padding: 16px; z-index: 20; }
  .modal .card { width: 100%; padding: 18px; display: grid; gap: 12px; text-align: center; }
  .modal h3 { margin: 0; font-size: 22px; font-weight: 900; }
  .modal p { margin: 0; font-weight: 700; line-height: 1.6; }
  .rate { font-size: 44px; font-weight: 900; font-variant-numeric: tabular-nums; color: #F08A3A; -webkit-text-stroke: 2px var(--line); paint-order: stroke fill; }
</style>

<canvas id="cv"></canvas>
<div class="col" id="col">
  <!-- タイトル -->
  <div class="scr" id="s-title">
    <div class="center">
      <div class="logo">ぽわぽわ<br>探検隊<small>POWA POWA EXPEDITION</small></div>
      <button class="btn gold" id="t-start" type="button">はじめる</button>
      <button class="btn white small" id="t-reset" type="button" hidden>データを消して はじめから</button>
    </div>
  </div>

  <!-- 最初の1匹 -->
  <div class="scr" id="s-starter" hidden>
    <div class="guide" id="st-guide" style="top: calc(16px + env(safe-area-inset-top, 0px))"><canvas class="gd"></canvas><p>わあ、ここに<b>3匹のぽわもん</b>が隠れてる！<br>まずは1匹、仲間にしてみよう！</p></div>
    <div class="label-pill" id="st-pill">お気に入りの ぽわもんを えらぼう</div>
    <div class="card pick-card" id="st-card" hidden>
      <p id="st-text"></p>
      <button class="btn" id="st-ok" type="button">この子にする</button>
      <button class="x" id="st-x" type="button" aria-label="とじる">×</button>
    </div>
  </div>

  <!-- ホーム -->
  <div class="scr" id="s-home" hidden>
    <div class="topbar"><span class="chip"><i class="coin"></i><span class="v-coin">0</span></span><span class="chip"><i class="ball"></i><span class="v-ball">0</span></span><span class="chip"><i class="berry"></i><span class="v-berry">0</span></span></div>
    <div class="card panel" id="home-panel"></div>
    <div class="navbar" id="navbar"></div>
  </div>

  <!-- 探索 -->
  <div class="scr" id="s-explore" hidden>
    <div class="topbar"><span class="chip"><i class="coin"></i><span class="v-coin">0</span></span><span class="chip"><i class="ball"></i><span class="v-ball">0</span></span></div>
    <div class="progress"><div class="area-name" id="ex-area"></div><div class="pbar"><i id="ex-bar"></i><b id="ex-pct"></b></div></div>
    <div class="guide" id="ex-guide" style="top: calc(112px + env(safe-area-inset-top, 0px))" hidden><canvas class="gd"></canvas><p id="ex-say"></p></div>
    <button class="compass" id="compass" type="button" aria-label="すすむ"><canvas id="compass-cv"></canvas></button>
    <div class="side-btn" style="left:14px"><button class="ibtn" id="ex-home" type="button"><canvas data-icon="home"></canvas>かえる</button></div>
    <div class="side-btn" style="right:14px"><button class="ibtn" id="ex-team" type="button"><canvas data-icon="team"></canvas>チーム</button></div>
  </div>

  <!-- バトル -->
  <div class="scr" id="s-battle" hidden>
    <div class="b-top"><div class="gauge" id="g-enemy"><div class="num"><span>0</span></div><div class="segs"></div></div></div>
    <div class="guide" id="b-guide" style="top: calc(64px + env(safe-area-inset-top, 0px))" hidden><canvas class="gd"></canvas><p id="b-say"></p></div>
    <div class="b-bottom">
      <div class="skills" id="skills"></div>
      <div class="brow"><div class="team" id="b-team"></div>
        <div class="ballbtn"><button class="btn gold small" id="b-ball" type="button">キャッチ</button><button class="btn white small" id="b-run" type="button">にげる</button></div></div>
      <div class="gauge" id="g-ally"><div class="num"><span>0</span></div><div class="segs"></div></div>
    </div>
  </div>

  <!-- キャッチ -->
  <div class="scr" id="s-catch" hidden>
    <div class="guide" style="top: calc(16px + env(safe-area-inset-top, 0px))"><canvas class="gd"></canvas><p id="c-say">わっかが <b>いちばん小さく</b>なった時に タップ！</p></div>
    <div style="position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom, 0px));text-align:center;display:grid;gap:4px;justify-items:center">
      <div style="font-weight:900;color:#fff;text-shadow:0 2px 0 var(--line)">つかまえる かくりつ</div>
      <div class="rate" id="c-rate">0%</div>
      <button class="btn white small" id="c-cancel" type="button">やめる</button>
    </div>
  </div>

  <div class="modal" id="modal" hidden><div class="card" id="modal-card"></div></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const rand = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const OL = '#6A4B3C';

// =====================================================================
// データ
// =====================================================================
const EL = { fire: { name: 'ほのお', color: '#F0806A' }, water: { name: 'みず', color: '#6FB4E6' }, grass: { name: 'くさ', color: '#86C06A' } };
// 属性相性：ほのお→くさ→みず→ほのお に強い
const BEATS = { fire: 'grass', grass: 'water', water: 'fire' };
function typeMul(atk, def) { return BEATS[atk] === def ? 1.5 : BEATS[def] === atk ? 0.7 : 1; }

const SKILLS = {
  fire:  [{ name: 'ひのこ', cost: 1, pow: 30 }, { name: 'ほのおパンチ', cost: 2, pow: 58 }, { name: 'フレアバースト', cost: 3, pow: 92 }],
  water: [{ name: 'みずでっぽう', cost: 1, pow: 30 }, { name: 'バブルシャワー', cost: 2, pow: 58 }, { name: 'おおつなみ', cost: 3, pow: 92 }],
  grass: [{ name: 'はっぱカッター', cost: 1, pow: 30 }, { name: 'つるのムチ', cost: 2, pow: 58 }, { name: 'もりのいぶき', cost: 3, pow: 80, heal: 0.2 }],
};
const WORKS = {
  chop: { name: 'たきぎわり', desc: 'たんけん中、木を こわす力 +1' },
  coin: { name: 'みずくみ', desc: 'たんけん中の コイン +20%' },
  find: { name: 'たからさがし', desc: '宝箱が 見つかりやすくなる' },
  heal: { name: 'おいしゃさん', desc: 'すすむたびに チームの体力が 少し回復' },
  ball: { name: 'ボールづくり', desc: '宝箱から ぽわボールが 出やすい' },
  exp:  { name: 'おべんきょう', desc: 'もらえる けいけんち +20%' },
};
// 種族：base = HP/ATK/DEF、rate = 捕まえやすさ
const SPECIES = [
  { id: 'hinoko', name: 'ヒノコン', el: 'fire', body: 'beast', ears: 'point', top: 'flame', tail: 'flame', c: ['#F08A6C', '#FFF1DC', '#F7C948'], hp: 48, atk: 14, def: 9, rate: .45, work: 'chop', desc: '頭の炎は、考えるたびに ゆらゆら 大きさが 変わる。' },
  { id: 'pururin', name: 'プルリン', el: 'water', body: 'blob', top: 'jelly', c: ['#8FC9F2', '#E8F6FF', '#B79BE8'], hp: 54, atk: 12, def: 10, rate: .45, work: 'coin', desc: 'ぷるぷるの体は ひんやり。雨の日が 大すき。' },

// =====================================================================
// 計算式
// =====================================================================
// ステータス：レベル1ごとに 12% ずつ伸びる
function stat(m, key) { const b = SP[m.sp][key]; return Math.floor(b * (1 + (m.lv - 1) * 0.12)); }
function maxHp(m) { return stat(m, 'hp'); }
// つぎのレベルまでの けいけんち
function needExp(lv) { return 10 + lv * lv * 4; }
// ダメージ = 攻撃 × わざの威力 ÷ 40 × 防御補正 × 属性相性 × ゆらぎ × 会心
function calcDamage(atkMon, defMon, skill) {
  const A = stat(atkMon, 'atk'), D = stat(defMon, 'def');
  const tm = typeMul(SP[atkMon.sp].el, SP[defMon.sp].el);
  const crit = Math.random() < 0.08 ? 1.5 : 1;
  const dmg = Math.max(1, Math.floor(A * skill.pow / 40 * (50 / (50 + D)) * tm * rand(0.9, 1.1) * crit));
  return { dmg, tm, crit: crit > 1 };
}
// 捕まえる確率 = 種族の捕まえやすさ × 体力補正 × タイミング補正（0.1〜0.95）
function catchRate(m, hpRatio, timing) {
  const base = SP[m.sp].rate;
  const hpF = 1 - 0.75 * hpRatio;          // 体力が少ないほど 捕まえやすい
  const lvF = clamp(1 - (m.lv - 1) * 0.01, 0.7, 1);
  return clamp(base * (0.6 + hpF) * timing * lvF, 0.05, 0.95);
}

    B.fill += dt / 1.1; if (B.fill >= 1) { B.fill -= 1; B.aEnergy = Math.min(10, B.aEnergy + 1); }
    B.eFill += dt / (B.boss ? 1.0 : 1.25); if (B.eFill >= 1) { B.eFill -= 1; B.eEnergy = Math.min(10, B.eEnergy + 1); }
    if (B.aEnergy >= 10) B.fill = 0; if (B.eEnergy >= 10) B.eFill = 0;
    B.eTimer -= dt;
    if (B.eTimer <= 0 && !B.busy) { B.eTimer = rand(1.4, 2.6) * (B.boss ? 0.8 : 1); enemyAct(); }
  }

  B.switchCd = Math.max(0, B.switchCd - dt);
  for (const k of ['hurtE', 'hurtA', 'lungeA', 'lungeE', 'shake']) B[k] = Math.max(0, (B[k] || 0) - dt);
  for (const f of B.fx) f.t += dt;
  B.fx = B.fx.filter(f => f.t < f.d + 0.05);
  for (const n of B.nums) { n.t -= dt; n.y -= 30 * dt; }

}

// =====================================================================
let C = null;
function startCatch(hpRatio) {
  const target = B.enemy;
  C = { m: target, hpRatio, t: 0, state: 'aim', ring: 1, q: 0, rate: 0, ball: null, shakes: 0, fromBattle: !B.over };
  show('catch');
  $('c-say').innerHTML = 'わっかが <b>いちばん小さく</b>なった時に タップ！';
}
function catchTiming() {
  // わっかは 1.3秒ごとに 大→小。小さいほど ボーナス（最大 1.5倍）
  const ph = (C.t % 1.3) / 1.3;
  C.ring = 1 - ph;
  const q = 1 - Math.min(1, Math.abs(C.ring - 0.12) / 0.5);
  return { q, mul: 1 + 0.5 * q };
}
function throwBall() {
  if (!C || C.state !== 'aim') return;
  const tm = catchTiming();
  C.q = tm.q; C.rate = catchRate(C.m, C.hpRatio, tm.mul);
  S.balls--; updateChips(); save();
  C.state = 'throw'; C.ball = { t: 0 };
  SFX.throw();
  if (tm.q > 0.85) toast('パーフェクト！', 900); else if (tm.q > 0.55) toast('グッド！', 900);
}
function resolveCatch() {
  // 3回ゆれて、ぜんぶ たえたら 成功
  const per = Math.pow(C.rate, 1 / 3);
  let ok = true;
  const shakeOnce = (k) => {
    if (!C) return;
    if (k === 3) { finishCatch(ok); return; }
    SFX.shake(); C.shakes = k + 1; C.shakeT = 0;
    if (Math.random() > per) { ok = false; setTimeout(() => finishCatch(false), 450); return; }
    setTimeout(() => shakeOnce(k + 1), 650);
  };
  C.state = 'shake';
  setTimeout(() => shakeOnce(0), 400);
}
function finishCatch(ok) {
  if (!C) return;
  const m = C.m, sp = SP[m.sp];
  if (ok) {
    C.state = 'done';
    SFX.caught();
    const nm = makeMon(m.sp, m.lv);
    addMon(nm);
    burst(195, LH * 0.45, '#FFE38A', 30);
    setTimeout(() => modal(`<h3>${sp.name}が 仲間になった！</h3><p>${sp.desc}<br>${S.team.includes(nm.uid) ? 'チームに くわわったよ！' : 'チームが いっぱいなので ホームで 待ってるよ。'}</p>`, [{ label: 'やったね！', fn: () => { C = null; if (B) { B.over = true; } endBattle(); } }]), 500);
  } else {
    C.state = 'escape';
    SFX.fail();
    if (C.fromBattle) {
      setTimeout(() => { toast('ボールから 出てきた！'); C = null; show('battle'); buildBattleUI(); B.eEnergy = Math.min(10, B.eEnergy + 1); }, 400);
    } else {
      setTimeout(() => modal(`<h3>ボールから 出てきた！</h3><p>${sp.name}は まだ そこに いる。</p>`, [
        ...(S.balls > 0 ? [{ label: `もう1回 なげる（${S.balls}）`, cls: 'gold', fn: () => startCatch(0) }] : []),
        { label: 'すすむ', cls: 'white', fn: () => { C = null; endBattle(); } }]), 500);
    }
  }
}
$('c-cancel').addEventListener('click', () => {
  if (!C || C.state !== 'aim') return;
  const fromBattle = C.fromBattle; C = null;
  if (fromBattle) { show('battle'); buildBattleUI(); } else endBattle();
});
function updateCatch(dt) {
  C.t += dt;
  if (C.state === 'aim') { const tm = catchTiming(); C.rate = catchRate(C.m, C.hpRatio, tm.mul); $('c-rate').textContent = Math.round(C.rate * 100) + '%'; }
  if (C.state === 'throw') { C.ball.t += dt; if (C.ball.t >= 0.6) resolveCatch(); }
  if (C.shakeT !== undefined) C.shakeT += dt;
}

  if (e.code === 'Space' && !e.repeat) {
    if (scene === 'catch') { e.preventDefault(); tapCatch(); }
    else if (scene === 'explore' && !EX.event && $('modal').hidden) { e.preventDefault(); stepExplore(); }
  }
});

// =====================================================================
// ループ
// =====================================================================
let last = performance.now(), compassT = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  T += dt;
  if (scene === 'battle' && B && $('modal').hidden) updateBattle(dt);
  if (scene === 'catch' && C) updateCatch(dt);
  compassT += dt;
  if (scene === 'explore' && compassT > 0.05) { compassT = 0; paintCompass(T); }
  drawScene(dt);
  requestAnimationFrame(loop);
}
document.querySelectorAll('canvas[data-icon]').forEach(c => drawIconTo(c, c.dataset.icon));
paintGuides();
initTitle();
requestAnimationFrame(loop);
window.addEventListener('pagehide', () => S && save());
})();
